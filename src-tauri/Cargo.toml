[package]
name = "mg-canvas-desktop"
version = "0.2.0"
edition = "2021"
description = "Local desktop host for MG Canvas"
default-run = "mg-canvas-desktop"

[[bin]]
name = "mgcanvas"
path = "src/bin/mgcanvas.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
  "Win32_Storage_FileSystem", "Win32_System_RemoteDesktop",
  "Win32_System_Threading", "Win32_UI_WindowsAndMessaging",
] }

[features]
custom-protocol = ["tauri/custom-protocol"]
