<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>绘图工作台 · 无限画布</title>
<style>
:root{--workspace-font:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif}
/* Shell tokens do not alter the document's fill, stroke, or project theme. */
:root{
  font-family:var(--workspace-font,system-ui,sans-serif);
  color-scheme:light;color:var(--text);background:var(--surface);font-size:13px;line-height:1.5;
  --surface:#fff;--canvas:#f3f5f9;--well:#f8f9fc;--hover:#f3f6fb;--line:#dde3ed;
  --text:#1f293b;--head:#202436;--muted:#637187;--secondary:#4c5c76;
  --blue:#3659d9;--blue-hover:#294ac3;--focus:#5674ee;--soft:#edf2ff;--accent-ink:#294ab8;
  --insignia:#334fac;--warning:#964607;--shape-icon:#5473ac;--shape-tint:#eef4ff;
  --map-icon:#6758bd;--map-tint:#f1edff;--path-icon:#4e647c;--path-tint:#f0f4f8;
  --shadow-xs:#30457512;--shadow-sm:#26375b20;--shadow-lg:#1b2b5627;
  --dock-active-fill:#e5edff;--dock-active-edge:#647dbe;
  --dock-selected:#3854c5;--dock-on-selected:#fff;--dock-glyph-tint:#dae4fc;
}
:root[data-workspace-theme=dark]{
  color-scheme:dark;
  --surface:#24262e;--canvas:#1b1d23;--well:#20222a;--hover:#303442;--line:#3b404e;
  --text:#e9edf5;--head:#f1f3fa;--muted:#a8b1c3;--secondary:#c0cadc;
  --blue:#385cca;--blue-hover:#4262c2;--focus:#93afff;--soft:#303c60;--accent-ink:#c7d7ff;
  --insignia:#3f518a;--warning:#ffc286;--shape-icon:#a9c9ff;--shape-tint:#303d58;
  --map-icon:#d3c6ff;--map-tint:#403659;--path-icon:#c2d2e5;--path-tint:#344255;
  --shadow-xs:#0002;--shadow-sm:#0005;--shadow-lg:#0007;
  --dock-active-fill:#303e60;--dock-active-edge:#8094c8;
  --dock-selected:#b5c6ff;--dock-on-selected:#1b2a54;--dock-glyph-tint:#414e6a;
}

*{box-sizing:border-box}
body{margin:0}
button,input,select,textarea,summary{font:inherit;color:inherit}
button,summary{cursor:pointer}
button:disabled{cursor:default;opacity:.45}
:where(button,summary,input,select,textarea,[tabindex]):focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.icon-library{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}
.ui-icon,.tool svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
#workspace{
  --space:16px;--dock-bottom:max(var(--space),env(safe-area-inset-bottom));--dock-height:72px;
  display:grid;grid-template-areas:"header" "viewport";grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);
  height:100vh;height:100dvh;isolation:isolate
}
.header{
  grid-area:header;position:relative;z-index:6;display:grid;grid-template-columns:minmax(150px,1fr) auto auto;
  align-items:center;gap:20px;min-height:64px;padding:9px 20px;border-bottom:1px solid var(--line);background:var(--surface)
}
.doc,.doc-meta,.document-actions,.workspace-actions,.panel-switch,.workspace-theme{display:flex;align-items:center}
.doc{gap:10px;min-width:0}.doc-info{min-width:0}
.doc strong{display:block;font-size:16px;font-weight:680;line-height:1.4;color:var(--head);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-meta{min-width:0;gap:7px;font-size:11px;color:var(--muted);white-space:nowrap}
#status{overflow:hidden;text-overflow:ellipsis}
.subtitle{padding-inline-start:7px;border-inline-start:1px solid var(--line)}
.sigil{display:grid;place-items:center;width:37px;height:37px;flex:none;border-radius:11px;color:#fff;background:var(--insignia)}.sigil svg{width:28px;height:28px}
.workspace-actions{gap:16px}.document-actions,.panel-switch{gap:4px}
.document-actions{padding-inline-start:16px;border-inline-start:1px solid var(--line)}
.button,.header-button,.panel-toggle,.file-history summary,.menu-button,.icon-button,.flat,.tool{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:8px;background:transparent;
  font-weight:550;line-height:1.35;white-space:nowrap
}
.button,.header-button,.panel-toggle,.file-history summary{min-height:36px;padding:5px 10px}
.button{border:1px solid var(--line);background:var(--surface);font-size:12px}
.button.primary{color:white;background:var(--blue);border-color:var(--blue);font-weight:650}
.button.primary:not(:disabled):hover{background:var(--blue-hover)}
:where(.button,.header-button,.panel-toggle,.file-history summary,.icon-button,.flat,.tool,.menu-button):not(:disabled):hover{background:var(--hover)}
.header-button,.panel-toggle,.file-history summary{color:var(--secondary);font-size:13px}
.panel-toggle[aria-expanded=true],.tool:is(.selected,[aria-pressed=true]),.flat[aria-pressed=true]{background:var(--soft);color:var(--accent-ink)}
.tool[aria-expanded=true]:not([aria-pressed=true]){color:var(--accent-ink);box-shadow:inset 0 0 0 1px var(--line)}
.file-history{position:relative}.file-history summary{list-style:none}.file-history summary::-webkit-details-marker{display:none}
.file-history[open] summary{background:var(--well);color:var(--head)}
.file-history-list,.floating-panel,.tool-strip,.zoom-bar{border:1px solid var(--line);background:var(--surface);box-shadow:0 2px 5px var(--shadow-xs),0 8px 24px var(--shadow-sm)}
.file-history-list{position:absolute;top:calc(100% + 6px);right:0;z-index:7;width:max-content;min-width:154px;max-width:calc(100vw - 16px);max-height:58dvh;overflow:auto;border-radius:12px;padding:6px}
.menu-button{display:flex;width:100%;min-height:34px;padding:6px 9px;justify-content:flex-start}
.workspace-theme{padding:3px;gap:2px;background:var(--well);border:1px solid var(--line);border-radius:10px}
.workspace-theme label{position:relative;min-width:0;cursor:pointer}
.workspace-theme input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.workspace-theme label>span{display:flex;align-items:center;justify-content:center;gap:5px;min-height:29px;padding:3px 8px;border-radius:6px;color:var(--secondary);font-size:12px;white-space:nowrap}
.workspace-theme .ui-icon{width:15px;height:15px}
.workspace-theme label:hover>span{background:var(--hover)}
.workspace-theme input:checked+span{color:var(--accent-ink);background:var(--surface);box-shadow:0 1px 3px var(--shadow-sm);font-weight:650}
.workspace-theme input:focus-visible+span{outline:2px solid var(--focus);outline-offset:-2px}
#viewport{grid-area:viewport;min-width:0;min-height:0;position:relative;overflow:hidden;isolation:isolate;background:var(--canvas)}
#canvas{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;overscroll-behavior:none}
#canvas:focus-visible{outline-offset:-3px}
#pointer-feedback{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#selection-count{
  position:absolute;z-index:1;pointer-events:none;user-select:none;white-space:nowrap;
  font-size:12px;font-weight:600;line-height:18px;font-variant-numeric:tabular-nums;
  padding:1px 7px;border:1px solid var(--focus);border-radius:5px;background:var(--surface);color:var(--accent-ink);
}
.table-controls,.table-cell-editor{position:absolute;z-index:1}
.table-controls{pointer-events:none;--table-accent:var(--focus)}
.table-selection{position:absolute;pointer-events:none;border:2px solid var(--table-accent);background:color-mix(in srgb,var(--focus) 12%,transparent)}
.table-controls button{font:inherit;cursor:pointer}
.table-controls .table-control{position:absolute;pointer-events:auto;border:0;border-radius:5px;padding:0;background:color-mix(in srgb,var(--focus) 22%,var(--surface));color:var(--accent-ink);touch-action:manipulation}
.table-controls .table-control:hover,.table-controls .table-control:focus-visible{background:color-mix(in srgb,var(--focus) 38%,var(--surface))}
.table-controls .table-control:disabled{opacity:.45;cursor:default}
.table-controls .table-addRow,.table-controls .table-addCol{font:600 20px/1 var(--workspace-font)}
.table-addRow{left:0;top:calc(100% + 8px);width:100%;height:24px}
.table-addCol{left:calc(100% + 8px);top:0;height:100%;width:24px}
.table-controls .table-row,.table-controls .table-col,.table-controls .table-whole{width:24px;height:20px;background:transparent;display:grid;place-items:center}
.table-row{left:-32px;transform:translateY(-50%)}
.table-col{top:-30px;transform:translateX(-50%)}
.table-whole{left:-32px;top:-30px}
.table-controls .table-whole[aria-pressed=true]{background:var(--soft);box-shadow:inset 0 0 0 1px var(--table-accent)}
.table-row::after,.table-col::after,.table-whole::after{content:"";width:15px;height:5px;border-radius:4px;background:var(--table-accent)}
.table-row::after{width:5px;height:14px}.table-whole::after{width:7px;height:7px}
.table-axis-menu{position:absolute;z-index:2;display:grid;min-width:120px;pointer-events:auto;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:4px;box-shadow:0 4px 14px var(--shadow-sm)}
.table-axis-menu button{border:0;border-radius:4px;background:transparent;color:inherit;text-align:left;white-space:nowrap;padding:6px 9px}
.table-axis-menu button:hover,.table-axis-menu button:focus-visible{background:var(--soft)}.table-axis-menu button:disabled{opacity:.45;cursor:default}
.table-cell-editor{outline:2px solid var(--focus);outline-offset:-1px;overflow:hidden}
.table-cell-editor .inline-text{height:100%;border-radius:0;background:transparent;color:inherit;box-sizing:border-box;white-space:pre-wrap;overflow-wrap:anywhere}
.view-controls{position:absolute;z-index:2;inset-block-start:var(--space);inset-inline-start:var(--space)}
#frame-meter{position:absolute;z-index:2;inset-block-start:var(--space);inset-inline-end:var(--space);pointer-events:none;
  padding:4px 7px;border:1px solid var(--line);border-radius:8px;color:var(--secondary);
  background:color-mix(in srgb,var(--surface) 85%,transparent);font-size:10px;line-height:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.frame-meter-heading{display:flex;justify-content:space-between}
#frame-meter-min{display:block;color:var(--head);font-size:11px;line-height:15px}
#frame-meter svg{display:block;width:148px;height:24px}
.frame-meter-grid{stroke:var(--line);stroke-width:1}
#frame-meter-line{fill:none;stroke:var(--accent-ink);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
#frame-meter-budget{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 2}
#frame-meter-low{fill:var(--accent-ink);stroke:var(--surface);stroke-width:1}
#frame-meter-low[data-late=true]{fill:var(--warning)}
.frame-rate{position:absolute;z-index:2;inset-block-start:calc(var(--space) + 66px);inset-inline-end:var(--space);
  display:flex;align-items:center;gap:6px;padding:3px 5px 3px 8px;border:1px solid var(--line);border-radius:8px;
  background:var(--surface);color:var(--secondary);font-size:11px;white-space:nowrap}
.frame-rate select{font:inherit;color:var(--text);background:var(--well);border:1px solid var(--line);border-radius:5px;padding:3px}
.zoom-bar{display:flex;align-items:center;padding:3px;gap:1px;border-radius:12px}
.icon-button,.flat{color:var(--secondary);min-width:32px;height:32px;padding:3px 5px;font-size:12px}
.snap-toggle{padding-inline:8px;margin-right:3px}.zoom-bar .snap-toggle::after{content:"";height:16px;border-inline-end:1px solid var(--line);margin-left:4px}
.fit-content{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px 7px;white-space:nowrap}
.fit-caption{display:flex;align-items:center;gap:4px;color:var(--head);font-size:12px;font-weight:600;line-height:14px}
.fit-caption kbd{padding:0 3px;border:1px solid var(--line);border-radius:3px;color:var(--secondary);font:500 10px/12px var(--workspace-font,system-ui,sans-serif)}
#zoom-read{min-width:38px;text-align:center;font-size:11px;line-height:12px;font-variant-numeric:tabular-nums}
.flow-help{position:absolute;top:calc(var(--space) + 47px);left:var(--space);max-width:min(450px,calc(100% - 2 * var(--space)));z-index:1;margin:0;padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--secondary);font-size:12px;pointer-events:none}
.floating-panel{
  --panel-offset:101px;
  grid-area:viewport;align-self:start;justify-self:end;z-index:3;min-height:0;width:min(316px,calc(100% - 2 * var(--space)));
  margin:var(--space);margin-block-start:calc(var(--space) + var(--panel-offset));
  max-height:calc(100% - var(--space) - var(--panel-offset) - var(--dock-bottom) - var(--dock-height) - 12px);
  overflow:auto;overscroll-behavior:contain;scroll-padding-block:54px 8px;border-radius:16px;scrollbar-width:thin;scrollbar-color:var(--muted) transparent
}
#workspace:has(.secondary-tools:not([hidden])) .floating-panel{max-height:calc(100% - var(--space) - var(--panel-offset) - var(--dock-bottom) - 2 * var(--dock-height) - 20px)}
.panel-title{position:sticky;top:0;z-index:2;min-height:48px;padding:6px 12px 6px 16px;display:flex;align-items:center;justify-content:space-between;gap:6px;border-bottom:1px solid var(--line);background:var(--surface)}
.panel-title>strong{display:flex;align-items:center;gap:8px;color:var(--head);font-size:14px;font-weight:650}
.panel-title>strong .ui-icon{color:var(--accent-ink)}
.panel-title .icon-button{margin-inline-start:3px}
.tool-strip{
  position:absolute;z-index:4;left:50%;transform:translateX(-50%);display:flex;flex-flow:row nowrap;align-items:center;gap:2px;
  width:max-content;max-width:calc(100% - 2 * min(var(--space),12px));padding:5px;
  overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scroll-padding-inline:5px;
  scrollbar-width:thin;scrollbar-color:var(--muted) transparent;border-radius:13px
}
.tool-strip.main-tools{
  bottom:var(--dock-bottom);height:var(--dock-height);gap:9px;padding:3px 4px 6px;
  background:transparent;border:0;box-shadow:none;border-radius:0
}
.dock-group{
  display:flex;align-items:center;gap:1px;padding:4px;border:1px solid var(--line);border-radius:18px;
  background:var(--surface);box-shadow:0 1px 2px var(--shadow-xs),0 3px 6px -3px var(--shadow-sm)
}
.dock-navigation,.dock-history{border-radius:23px}
.dock-creation .tool-sep{height:23px;margin-inline:3px}
.secondary-tools{bottom:calc(var(--dock-bottom) + var(--dock-height) + 8px)}
.sticky-palette{gap:2px;padding:3px 8px;min-height:36px}
.sticky-swatch{position:relative;display:grid;place-items:center;flex:none;width:28px;height:28px;padding:0;border:0;border-radius:50%;background:transparent}
.sticky-swatch span{width:17px;height:17px;border:1px solid #2222;border-radius:50%}
.sticky-swatch[aria-checked=true]::after{content:"";position:absolute;inset:2px;border:2px solid var(--focus);border-radius:50%}
.sticky-swatch:hover{background:var(--hover)}
@media(pointer:coarse){.sticky-swatch{width:40px;height:40px}.sticky-swatch[aria-checked=true]::after{inset:7px}}
#placement-preview{position:absolute;z-index:0;pointer-events:none;user-select:none;box-sizing:border-box}
.placement-shape{display:none;width:100%;height:100%;overflow:visible;opacity:.65;stroke-linejoin:round}
.placement-shape>*{display:none}
#placement-preview:is([data-kind=process],[data-kind=decision],[data-kind=triangle]) .placement-shape,
#placement-preview[data-kind=process] .placement-shape rect,#placement-preview[data-kind=decision] .diamond,
#placement-preview[data-kind=triangle] .triangle{display:block}
#placement-preview[data-kind=sticky]{border:1px solid #28212930;border-radius:3px;opacity:.82;box-shadow:0 2px 5px var(--shadow-sm)}
#placement-preview[data-kind=markdown]{border:1.5px dashed var(--focus);border-radius:5px;background:rgb(255 255 255 / .68);box-shadow:0 2px 5px var(--shadow-sm)}
#placement-preview[data-hint]::before{content:attr(data-hint);display:block;color:#303c4c;font-weight:400;line-height:1.5}
#placement-preview[data-kind=text]{border:1.5px dashed var(--focus);border-radius:3px;background:color-mix(in srgb,var(--soft) 45%,transparent)}
#placement-preview[data-kind=text]::before{content:"";position:absolute;top:20%;bottom:20%;left:4px;border-left:1px solid var(--accent-ink)}
#placement-preview[data-kind=table]{
  border:1px dashed var(--focus);background-color:color-mix(in srgb,var(--surface) 65%,transparent);
  background-image:linear-gradient(var(--focus),var(--focus)),linear-gradient(var(--focus),var(--focus));
  background-size:1px 100%,100% 1px;background-position:center;background-repeat:no-repeat
}
.tool{min-height:40px;padding:5px 10px;flex:none;color:var(--secondary);font-size:12px;font-weight:500}
.main-tools .tool{
  position:relative;display:grid;place-items:center;width:48px;height:50px;
  padding:0 0 8px;color:var(--text);background:transparent;border-radius:12px
}
.dock-navigation .tool,.dock-history .tool{border-radius:16px}
.main-tools .tool>svg{width:26px;height:26px;stroke-width:1.7}
.main-tools .glyph-surface{fill:var(--dock-glyph-tint)}
.main-tools .glyph-solid{fill:currentColor}
#tool-sticky:not([aria-pressed=true]) .glyph-surface{fill:color-mix(in srgb,#dfae48 37%,var(--surface))}
.main-tools .tool>span{
  position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap
}
.secondary-tools:not(.ink-tools) .tool{
  position:relative;display:grid;grid-template-columns:20px max-content;grid-template-rows:22px;
  align-items:center;align-content:start;justify-content:center;column-gap:4px;
  min-width:64px;height:50px;padding:8px 6px 0;border-radius:8px;
  color:var(--text);font-size:14px;font-weight:500;line-height:20px
}
.secondary-tools:not(.ink-tools) .tool>svg{grid-area:1 / 1;width:20px;height:20px;stroke-width:1.7}
.secondary-tools:not(.ink-tools) .tool>span{grid-area:1 / 2}
.dock-key{
  position:absolute;inset-inline-end:5px;bottom:4px;color:var(--muted);
  pointer-events:none;white-space:nowrap;
  font:500 10px/12px var(--workspace-font,system-ui,sans-serif);font-variant-numeric:tabular-nums
}
.main-tools .dock-key{min-width:11px;padding-inline:2px;text-align:center;border-radius:3px;background:color-mix(in srgb,currentColor 8%,transparent)}
.tool-strip .tool:is(.selected,[aria-pressed=true],[aria-expanded=true]){
  color:var(--accent-ink);background:var(--dock-active-fill);box-shadow:inset 0 0 0 1px var(--dock-active-edge)
}
.tool-strip .tool:is(.selected,[aria-pressed=true],[aria-expanded=true]) .dock-key{color:var(--accent-ink)}
.tool-strip .tool:disabled{opacity:1;color:color-mix(in srgb,var(--text) 56%,var(--surface))}
.tool-strip .tool:disabled .dock-key{color:inherit}
.tool-strip .tool:not(:disabled):not([aria-pressed=true]):not([aria-expanded=true]):hover{
  background:var(--hover);color:var(--head)
}
.tool-strip :is(button,select,input):focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.main-tools .tool[aria-pressed=true]{
  color:var(--dock-on-selected);background:var(--dock-selected);box-shadow:none
}
.main-tools .tool[aria-pressed=true] .dock-key{color:inherit}
.main-tools .tool[aria-pressed=true] .glyph-surface{fill:color-mix(in srgb,currentColor 22%,transparent)}
.main-tools .tool[aria-pressed=true]:focus-visible{outline-color:var(--dock-on-selected);outline-offset:-3px}
#dock-hint{
  position:fixed;z-index:5;max-width:calc(100vw - 16px);padding:5px 10px;border-radius:7px;
  background:var(--text);color:var(--surface);box-shadow:0 2px 6px var(--shadow-sm);
  font-size:12px;font-weight:550;line-height:18px;pointer-events:none
}
.tool-strip :focus-visible{outline-offset:-2px}.tool-strip>*{flex:none}
.tool-sep{width:1px;height:24px;margin:0 1px;background:var(--line)}
.dock-control{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;min-height:40px;white-space:nowrap;font-size:12px;color:var(--secondary)}
.dock-control input,.dock-control select{min-width:0;border:1px solid var(--line);border-radius:6px;background:var(--well);accent-color:var(--blue)}
#path-segment{width:3.5em;padding:4px}#path-part{max-width:8em;padding:4px}.part-control:has([hidden]){display:none}
.ink-tools{gap:2px;padding:5px 7px}
.ink-tools .ink-tool,.ink-tools .ink-weight{width:34px;min-height:34px;padding:4px}
.ink-tools .ink-tool svg{width:22px;height:22px}
.ink-tools .ink-weight{width:29px}.ink-weight svg{width:19px;stroke-width:1.7}.ink-weight.thick svg{stroke-width:4.5}
.ink-size,.ink-swatches{display:inline-flex;align-items:center;gap:2px}
.ink-size{padding-inline:3px;color:var(--secondary);font-size:11px;font-variant-numeric:tabular-nums}
#ink-width{width:49px;margin:0;accent-color:var(--accent-ink);cursor:pointer}
#ink-width-value{min-width:2ch;text-align:center}
.ink-swatch,.ink-custom{position:relative;display:inline-grid;place-items:center;width:29px;height:34px;padding:0;border:0;border-radius:7px;background:transparent;flex:none}
.ink-swatch:hover,.ink-custom:hover{background:var(--hover)}
