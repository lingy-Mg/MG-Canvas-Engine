<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>绘图工作台 · 无限画布</title>
<style>
/* Shell tokens do not alter the document's fill, stroke, or project theme. */
:root{
  font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:light;color:var(--text);background:var(--surface);font-size:13px;
  --surface:#fff;--canvas:#f3f5f9;--well:#f8f9fc;--hover:#f3f6fb;--line:#e8edf5;
  --text:#1f293b;--head:#202436;--muted:#637187;--secondary:#4c5c76;
  --blue:#3659d9;--blue-hover:#294ac3;--focus:#5674ee;--soft:#edf2ff;--accent-ink:#294ab8;
  --insignia:#2d385e;--warning:#964607;--shape-icon:#5473ac;--shape-tint:#eef4ff;
  --map-icon:#6758bd;--map-tint:#f1edff;--path-icon:#4e647c;--path-tint:#f0f4f8;
  --shadow-xs:#30457512;--shadow-sm:#26375b20;--shadow-lg:#1b2b5627;
}
:root[data-workspace-theme=dark]{
  color-scheme:dark;
  --surface:#24262e;--canvas:#1b1d23;--well:#20222a;--hover:#303442;--line:#3b404e;
  --text:#e9edf5;--head:#f1f3fa;--muted:#a8b1c3;--secondary:#c0cadc;
  --blue:#385cca;--blue-hover:#4262c2;--focus:#93afff;--soft:#303c60;--accent-ink:#c7d7ff;
  --insignia:#3f518a;--warning:#ffc286;--shape-icon:#a9c9ff;--shape-tint:#303d58;
  --map-icon:#d3c6ff;--map-tint:#403659;--path-icon:#c2d2e5;--path-tint:#344255;
  --shadow-xs:#0002;--shadow-sm:#0005;--shadow-lg:#0007;
}
.workspace-theme{font:inherit;font-size:11px;min-width:0;max-width:91px;height:32px;
  border:0;border-left:1px solid var(--line);border-radius:0 8px 8px 0;
  padding:0 5px;color:var(--secondary);background:var(--surface);cursor:pointer}
.workspace-theme:hover{background:var(--hover)}
.workspace-theme:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
@media(max-width:760px){.workspace-theme{height:44px;max-width:80px}}
*{box-sizing:border-box}
body{margin:0}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,#canvas:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button:disabled{cursor:default;opacity:.38}
#workspace{display:grid;grid-template-areas:"header header header" "left viewport right";grid-template-columns:224px minmax(0,1fr) 248px;grid-template-rows:64px minmax(0,1fr);height:100vh;height:100dvh}
.header{grid-area:header;display:flex;align-items:center;justify-content:space-between;padding:0 19px;border-bottom:1px solid var(--line);background:var(--surface);z-index:5;gap:12px}
.doc,.document-actions{display:flex;align-items:center;gap:10px}
.doc{min-width:0}
.doc strong{color:var(--head);font-size:15px;display:block;line-height:1.3}
.subtitle{font-size:10px;letter-spacing:.04em;color:var(--muted);margin-top:2px;white-space:nowrap}
.sigil{display:grid;place-items:center;width:35px;height:35px;flex:none;border-radius:10px;color:#fff;background:var(--insignia)}
.document-actions{gap:8px}
.document-actions [hidden]{display:none}
#status{font-size:11px;color:var(--muted);white-space:nowrap;margin-right:5px;max-width:210px;overflow:hidden;text-overflow:ellipsis}
.button{border:1px solid var(--line);background:var(--surface);border-radius:7px;height:34px;padding:0 12px;white-space:nowrap;font-weight:650}
.button:not(:disabled):hover{background:var(--hover)}
.button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.button.primary:not(:disabled):hover{background:var(--blue-hover)}
.sidebar{background:var(--surface);min-height:0;overflow:auto;z-index:3}
.left{grid-area:left;border-right:1px solid var(--line)}
.right{grid-area:right;border-left:1px solid var(--line)}
.panel-title{height:46px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 15px}
.panel-title span{color:var(--muted);font-size:10px}
.layer-lock-actions{display:flex;gap:3px}
.layer-visibility{flex:none;margin-left:auto;font-size:10px;color:var(--accent-ink)}
.layer-visibility[hidden]{display:none}
.layer[data-hidden=true] .layer-name{color:var(--secondary)}
.layer-lock-actions button{height:28px;padding:0 5px;border:1px solid var(--line);border-radius:6px;background:var(--well);color:var(--text);font-size:12px}
.layer-lock-actions button[hidden]{display:none}
.layer[data-locked=true]::after{content:"锁";margin-left:auto;padding:1px 5px;border:1px solid var(--line);border-radius:4px;color:var(--secondary);background:var(--well);font-size:10px;flex:none}
@media(min-width:761px) and (max-width:1100px){
  #layers-panel .panel-title{padding-inline:6px}
  .layer-lock-actions{gap:2px}
  .layer-lock-actions button{font-size:11px;padding-inline:3px;white-space:nowrap}
}
@media(max-width:760px){.layer-lock-actions button{height:44px;min-width:44px}}
.layer-search{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:2px;padding:6px 8px;background:var(--surface)}
.layer-search-field{display:block;flex:1;min-width:0}
.layer-search input{width:100%;min-width:0;height:32px;padding:0 9px;font:inherit;color:var(--text);background:var(--well);border:1px solid var(--line);border-radius:7px}
.layer-search input::placeholder{color:var(--muted);opacity:1}
.layer-search input:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.layer-search-clear{flex:none;width:32px;height:32px;border:0;border-radius:7px;font-size:18px;line-height:1;background:transparent;color:var(--secondary)}
.layer-search-clear:hover{background:var(--hover)}
.layer-results{margin:0;padding:2px 12px 6px;color:var(--secondary);font-size:11px}
.layer{scroll-margin-block-start:46px}
.layer-search-clear[hidden],.layer-results[hidden],.layer-paging>div[hidden]{display:none}
@media(max-width:760px){
  .layer-search input{height:44px;font-size:16px}
  .layer-search-clear{width:44px;height:44px}
  .layer{scroll-margin-block-start:58px}
}
#layers{display:grid;gap:2px;padding:0 8px}
.layer{border:0;background:transparent;padding:8px 8px;display:flex;align-items:center;gap:9px;border-radius:7px;min-height:38px;text-align:left;white-space:nowrap;overflow:hidden}
.layer[data-flow-group] .layer-name::before{content:"";display:inline-block;width:5px;height:9px;border-left:2px solid currentColor;opacity:.6;margin-right:5px}
.layer .layer-name{overflow:hidden;text-overflow:ellipsis}
.layer[aria-pressed=true]{background:var(--soft);color:var(--accent-ink)}
.layer:hover:not([aria-pressed=true]){background:var(--hover)}
.topic-tree{margin:0 6px 5px;border-block:1px solid var(--line);color:var(--text)}
.topic-tree[hidden],.topic-tree [hidden],#topic-tree-current[hidden]{display:none}
.topic-tree button{font:inherit;color:inherit;border:0;background:transparent;text-align:start}
#topic-tree-toggle,#topic-tree-current{display:block;width:100%;padding:6px 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#topic-tree-toggle{font-weight:650}
#topic-tree-current{color:var(--accent-ink);font-size:11px}
.topic-tree-status{margin:0;padding:2px 5px 5px;color:var(--secondary);font-size:11px}
.topic-tree-list{max-height:min(34vh,285px);overflow:auto;overscroll-behavior:contain}
.topic-row{display:flex;align-items:center;width:100%;min-height:30px;padding:3px 4px;gap:3px;border-radius:5px}
.topic-tree button:hover{background:var(--hover)}
.topic-tree .topic-row[aria-selected=true]{background:var(--soft);color:var(--accent-ink);font-weight:650}
.topic-row[aria-selected=true] .topic-caption::before{content:"● ";font-size:8px}
.topic-tree button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.topic-caret{flex:0 0 19px;align-self:stretch;display:grid;place-items:center;color:var(--secondary)}
.topic-row-copy{min-width:0}
.topic-caption,.topic-context{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topic-context{font-size:10px;color:var(--secondary)}
.topic-tree-pager{display:flex;align-items:center;justify-content:space-between;gap:4px;color:var(--secondary);font-size:10px}
.topic-tree-pager button{padding:5px}
@media(max-width:760px){
  .topic-tree button{min-height:44px}
  .topic-caret{flex-basis:32px}
  .topic-tree-list{max-height:22dvh}
}
.layer-icon{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;font-size:13px;color:var(--shape-icon);background:var(--shape-tint);flex:none}
.layer-icon.mindmap{color:var(--map-icon);background:var(--map-tint)}
.layer-icon.connector{color:var(--path-icon);background:var(--path-tint)}
#viewport{grid-area:viewport;min-width:0;min-height:0;position:relative;overflow:hidden;isolation:isolate;background:var(--canvas)}
#canvas{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;overscroll-behavior:none}
#canvas:focus-visible{outline-offset:-3px}
.stage-head,.zoom-bar,.stage-foot,.floating-tools{position:absolute;z-index:1}
.stage-head{top:15px;left:14px;display:flex;align-items:center;gap:10px;pointer-events:none}
.tag-stage{display:flex;align-items:center;gap:7px;border-radius:20px;background:var(--surface);padding:6px 10px;box-shadow:0 2px 6px var(--shadow-xs);font-weight:650;color:var(--head);font-size:11px}
.tag-stage i{width:6px;height:6px;border-radius:50%;background:var(--focus)}
.stage-trail,.stage-foot{color:var(--muted);font-size:10px}
.zoom-bar{top:14px;right:14px;background:var(--surface);border:1px solid var(--line);border-radius:9px;display:flex;align-items:center;box-shadow:0 3px 12px var(--shadow-xs)}
.icon-button,.flat{border:0;background:transparent;height:32px;min-width:33px}
.icon-button{font-size:17px}
.flat{min-width:51px;font-size:11px;font-weight:650;color:var(--secondary)}
.icon-button:hover,.flat:hover{background:var(--hover)}
.snap-toggle{border-inline-end:1px solid var(--line);border-radius:8px 0 0 8px}
.snap-toggle[aria-pressed=true]{background:var(--soft);color:var(--accent-ink)}
@media(max-width:450px){.stage-trail{display:none}}
.stage-foot{bottom:13px;left:14px;pointer-events:none}
.stage-foot span{padding:0 4px}
.floating-tools{display:flex;align-items:center;gap:2px;bottom:29px;left:50%;transform:translateX(-50%);padding:5px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 7px 25px var(--shadow-sm)}
.tool{border:0;background:transparent;border-radius:7px;display:grid;place-items:center;gap:3px;width:52px;height:47px;font-size:9px;color:var(--secondary);padding:4px}
.tool.selected,.tool[aria-expanded=true]{color:var(--accent-ink);background:var(--soft)}
.tool:not(:disabled):hover{background:var(--hover)}
.tool svg{fill:none;width:18px;height:18px;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
.tool-sep{width:1px;height:32px;background:var(--line);margin:0 2px}
.mobile{display:none}
.inside{padding:15px;display:grid;gap:13px}
.inside h2{font-size:13px;margin:0}
.inside p{color:var(--muted);margin:0;font-size:11px;line-height:1.65}
.type-chip{display:inline-block;padding:4px 7px;background:var(--soft);border-radius:5px;color:var(--accent-ink);font-size:10px}
.props{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0}
.props div{display:grid;gap:4px;background:var(--well);border:1px solid var(--line);border-radius:6px;padding:7px;min-width:0}
.props dt,.props dd{margin:0;font-size:10px}
.props dt{color:var(--muted)}.props dd{font-weight:650;overflow:hidden;text-overflow:ellipsis}
#fold{width:100%}
@media(max-width:1100px){#workspace{grid-template-columns:177px minmax(0,1fr) 192px}.stage-trail{display:none}}
@media(max-width:760px){
  #workspace{grid-template-areas:"header" "viewport";grid-template-columns:minmax(0,1fr);grid-template-rows:56px minmax(0,1fr)}
  .header{padding:0 10px;gap:6px}.doc{gap:7px}.doc strong{font-size:13px}.sigil{width:30px;height:30px}.sigil svg{width:17px;height:17px}
  .document-actions{gap:5px}.document-actions .button{height:44px;padding:0 9px}.document-actions #status{max-width:75px;margin:0;font-size:9px}
  .sidebar{position:fixed;left:8px;right:8px;bottom:calc(69px + env(safe-area-inset-bottom,0px));max-height:min(53dvh,360px);display:none;border:1px solid var(--line);border-radius:13px;box-shadow:0 9px 28px var(--shadow-lg);z-index:4}
  .sidebar.show{display:block}
  .floating-tools{bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:3px;gap:1px;z-index:5}
  .tool{width:44px;height:47px}.mobile{display:grid}
  .stage-foot{display:none}
  .zoom-bar{top:9px;right:9px}.icon-button,.flat{height:44px;min-width:44px}
  .stage-head{top:13px;left:10px}.layer{min-height:44px}
}
.transform{display:grid;gap:8px}
.transform[hidden]{display:none}
.transform-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.transform-fields label{display:grid;grid-template-columns:max-content minmax(0,1fr);align-items:center;gap:5px;min-width:0;padding:0 6px;border-radius:6px;background:var(--well);border:1px solid var(--line)}
.transform-fields span{font-size:10px;color:var(--muted)}
.transform-fields input{min-width:0;width:100%;height:32px;background:transparent;border:0;text-align:right;font:inherit;color:var(--text)}
.transform-fields input::-webkit-inner-spin-button,.transform-fields input::-webkit-outer-spin-button{appearance:none;margin:0}
.transform-fields input:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.transform p:empty{display:none}
.transform-fields.appearance-fields{grid-template-columns:minmax(0,1fr)}
.appearance-paint{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-column:1/-1;gap:5px}
.appearance-paint .paint-choice{position:relative;display:flex;min-width:40px;overflow:hidden;cursor:pointer;background:repeating-conic-gradient(#fff 0 25%,#c9ced2 0 50%) 0 0/10px 10px}
.paint-choice .paint-chip{position:absolute;inset:0;pointer-events:none}
.paint-choice input[type=color]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.paint-choice:focus-within{outline:2px solid var(--focus)}
@media(max-width:760px){.transform-fields input,.transform .button{height:44px}}
.text-overlay{position:absolute;z-index:6;border-radius:9px;box-shadow:0 8px 24px var(--shadow-lg);background:var(--surface);border:1px solid var(--focus);overflow:hidden}
.inline-text{display:block;width:100%;min-height:0;resize:none;box-sizing:border-box;border:0;padding:5px 7px;outline:none;font-family:inherit;line-height:1.4;color:var(--text);background:var(--surface)}
.inline-actions{display:flex;gap:5px;justify-content:flex-end;padding:4px;background:var(--well)}
.inline-actions .button{height:30px;padding:0 8px}
.topic-editor{border:0;box-shadow:none;overflow:visible;background:transparent}
.topic-editor .inline-text{border:1px solid var(--focus);border-radius:8px;background:var(--surface);box-shadow:0 2px 8px var(--shadow-sm);font-weight:600;line-height:1.25}
.topic-editor .inline-actions{position:absolute;top:calc(100% + 4px);right:0;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 12px var(--shadow-sm)}
.style-select{min-width:0;width:100%;height:33px;background:transparent;border:0;font:inherit;color:var(--text)}
.transform-fields input[type="color"]{padding:4px 2px;cursor:pointer}
.inline-warning{color:var(--warning)!important}
@media(max-width:760px){
  .header{gap:4px}.doc .subtitle{overflow:hidden;max-width:105px;text-overflow:ellipsis}.document-actions{min-width:0}
  .document-actions #status{position:absolute;top:57px;right:9px;z-index:7;max-width:190px;padding:2px 6px;background:var(--surface);border-radius:4px;pointer-events:none}
  .document-actions .button{padding:0 5px;min-width:44px;font-size:10px}
  .floating-tools{gap:0;max-width:100%;width:max-content;padding:3px}
  .tool{width:44px}.tool-sep{display:none}
  .inline-actions .button,.style-select{min-height:44px}
}
.aspect-option,.standalone-actions{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px}
.standalone-actions .button{flex:1}
@media(max-width:374px){
  /* Keep both recovery choices and the export button in the header. */
  .header:has(#open-other:not([hidden])) .sigil{display:none}
  .header:has(#open-other:not([hidden])) .subtitle{max-width:46px}
  .header:has(#open-legacy:not([hidden])) .doc{display:none}
  .floating-tools{width:calc(100% - 12px);justify-content:center;flex-wrap:wrap}
  .sidebar{bottom:calc(115px + env(safe-area-inset-bottom,0px))}
}
.flow-help{position:absolute;top:59px;left:14px;z-index:1;background:var(--surface);color:var(--secondary);box-shadow:0 1px 8px var(--shadow-sm);border-radius:7px;padding:7px 10px;font-size:11px;pointer-events:none}

.shape-palette[hidden],.flow-help[hidden]{display:none}
.flow-properties{display:grid;gap:8px}

.flow-field,.endpoint-rows{display:flex;align-items:center;gap:4px;min-width:0}

.endpoint-rows .button{min-width:0;padding:0 6px}
.waypoint-row{display:grid;grid-template-columns:12px minmax(0,1fr) minmax(0,1fr) auto auto;align-items:center;gap:3px}

@media(max-width:760px){
  .tool{width:44px}.shape-palette{bottom:calc(68px + env(safe-area-inset-bottom,0px))}

.arrange-menu[hidden]{display:none}

@media(pointer:coarse){.arrange-menu [role="menuitem"]{min-height:44px}}
.inspector-section{font-size:11px;font-weight:650;margin:0;color:var(--secondary)}

.ink-tools{align-items:center;max-width:calc(100% - 20px);white-space:nowrap}
.ink-tools label{display:flex;align-items:center;gap:3px;font-size:11px}
.ink-tools input[type=range]{width:clamp(45px,16vw,88px)}
.ink-tools input[type=color]{width:32px;height:32px}
.ink-tools button[aria-pressed=true]{background:var(--soft);color:var(--accent-ink)}
@media(max-width:760px){.ink-tools input{min-height:44px}}
@media(max-width:479px){
  #workspace:has(#open-fourth:not([hidden])){grid-template-rows:102px minmax(0,1fr)}
  .header:has(#open-fourth:not([hidden])) .doc{display:none}
  .header:has(#open-fourth:not([hidden])) .document-actions{
    display:grid;width:100%;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;
  }
  .header:has(#open-fourth:not([hidden])) .document-actions .button{min-width:0}
}


</style>
</head>
<body>
<div id="workspace">
  <header class="header">
    <div class="doc">
      <div class="sigil" aria-hidden="true"><svg width="19" height="19" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="9" height="9" rx="2" stroke="currentColor" stroke-width="1.8"/><rect x="12" y="12" width="9" height="9" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5h2a2.5 2.5 0 0 1 2.5 2.5v2" stroke="currentColor" stroke-width="1.8"/></svg></div>
      <div><strong>会议室系统</strong><div class="subtitle">无限画布<span class="dot"> · </span>开发预览 M5AS</div></div>
    </div>
    <div class="document-actions">
      <span id="status" role="status" aria-live="polite">未保存</span>
      <button id="open" class="button" type="button" title="打开最近保存的画板">重开</button>
      <button id="open-other" class="button" type="button" hidden>另一副本</button>
      <button id="open-legacy" class="button" type="button" hidden>旧副本</button>
      <button id="open-fourth" class="button" type="button" hidden>更多副本</button>
      <button id="open-fifth" class="button" type="button" hidden>更多副本</button>
      <button id="open-sixth" class="button" type="button" hidden>更多副本</button>
      <button id="open-seventh" class="button" type="button" hidden>更多副本</button>
      <button id="project-open" class="button" type="button" title="打开已导出的项目文件">导入</button>
      <button id="project-export" class="button" type="button" title="导出含图片原始数据的项目文件">导出</button>
      <button id="save" class="button primary" type="button" title="保存（Ctrl+S）">保存</button>
    </div>
  </header>
  <aside id="layers-panel" class="sidebar left" aria-label="图层">
    <div class="panel-title"><strong>图层</strong><div class="layer-lock-actions">
      <button id="layer-hide" type="button" title="隐藏所选图层，仅限本次打开" aria-label="隐藏所选图层" disabled>隐藏</button>
      <button id="layer-show-all" type="button" title="显示当前画板的全部图层" aria-label="显示全部图层" hidden>全显</button>
      <button id="layer-lock" type="button" title="锁定所选图层，仅限本次打开" aria-label="锁定所选图层" disabled>锁定</button>
      <button id="layer-unlock" type="button" title="解锁所选图层" aria-label="解锁所选图层" hidden>解锁</button>
    </div></div>
    <div class="layer-search" role="search" aria-label="图层名称">
      <span id="layer-search-field" class="layer-search-field"></span>
      <button id="layer-search-clear" class="layer-search-clear" type="button" aria-label="清空图层搜索" title="清空图层搜索" hidden>×</button>
    </div>
    <p id="layer-results" class="layer-results" role="status" hidden></p>
    <section id="topic-tree" class="topic-tree" aria-label="当前脑图的主题层级" hidden></section>
    <div id="layers" aria-label="对象列表"></div>
    <div id="layer-paging" class="layer-paging" hidden>
      <div id="layer-page-controls"><button id="layer-newer" class="button" type="button">上一页</button><span id="layer-page-read" aria-live="polite"></span><button id="layer-older" class="button" type="button">下一页</button></div>
      <button id="layer-locate" class="button" type="button">定位所选图层</button>
    </div>
  </aside>
  <main id="viewport" aria-label="无限画布工作区">
    <canvas id="canvas" tabindex="0" aria-label="项目画布：可点选图层，拖形状或图片的角点缩放，也可用属性面板输入数值。"></canvas>
    <div class="stage-head"><span class="tag-stage"><i></i> 混排画板</span><span class="stage-trail">自由流程图 / 自动布局脑图</span></div>
    <div class="zoom-bar" aria-label="画布控件">
      <button id="drag-snap" class="flat snap-toggle" type="button" aria-label="拖动对齐吸附" aria-pressed="false" title="拖动对齐吸附，按住 Alt / Option 可临时暂停">吸附</button>
      <button id="zoom-out" class="icon-button" aria-label="缩小" type="button">−</button>
      <button id="fit" class="flat" title="查看整板（0）" type="button"><span id="zoom-read">100%</span></button>
      <button id="zoom-in" class="icon-button" aria-label="放大" type="button">+</button>
      <select id="workspace-theme" class="workspace-theme" aria-label="工作区外观" title="工作区外观">
        <option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option>
      </select>
    </div>
    <output id="flow-help" class="flow-help" aria-live="polite" hidden></output>
    <div id="path-tools" class="mind-tools" aria-label="路径操作" hidden>
      <label id="path-segment-label" hidden>段 <input id="path-segment" type="number" inputmode="numeric" min="1" step="1" aria-label="选中路径段"></label>
      <button id="path-insert" class="button" type="button" aria-pressed="false" aria-keyshortcuts="I Insert" title="点路径插入，Enter 在选中段的参数中点插入" hidden>插入顶点</button>
      <button id="path-convert" class="button" type="button" hidden>转为曲线</button>
      <select id="path-part" aria-label="重叠时选择拖动目标" title="重叠时选择拖动目标" hidden><option value="auto">自动选点</option><option value="vertex">顶点</option><option value="out">起点柄</option><option value="in">终点柄</option></select>
      <button id="path-finish" class="button" type="button">完成开放路径</button>
      <button id="path-close" class="button" type="button">闭合路径</button>
      <button id="path-cancel" class="button" type="button">取消</button>
    </div>
    <div id="mind-tools" class="mind-tools" aria-label="脑图主题操作" hidden>
      <button id="mind-child" class="button" type="button" title="添加子主题（Tab）">子主题</button>
      <button id="mind-sibling" class="button" type="button" title="添加同级主题（Enter）">同级</button>
      <button id="mind-edit" class="button" type="button" title="编辑主题文字（F2）">改字</button>
      <button id="mind-fold" class="button" type="button">折叠</button>
      <button id="mind-done" class="button" type="button" title="退出主题编辑（Esc）">完成</button>
    </div>
    <div id="shape-palette" class="shape-palette" aria-label="形状工具" hidden>
      <button id="shape-process" class="button" type="button">矩形 · 流程</button>
      <button id="shape-decision" class="button" type="button">菱形 · 判断</button>
      <button id="shape-triangle" class="button" type="button">三角形</button>
      <button id="shape-line" class="button" type="button">自由直线</button>
    </div>
    <div id="ink-tools" class="mind-tools ink-tools" aria-label="手写工具设置" hidden>
      <button id="ink-finger" class="button" type="button" aria-pressed="false">手指书写</button>
      <label>颜色 <input id="ink-color" type="color" value="#223344"></label>
      <label>笔宽 <input id="ink-width" type="range" min="1" max="24" step="1" value="4"></label>
    </div>
    <div class="floating-tools" aria-label="画布工具">
      <button id="tool-select" class="tool selected" type="button" title="选择（V）" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="m5 3 14 11-7 1.1-3.8 5.4L5 3Z"/></svg><span>选择</span></button>
      <button id="tool-hand" class="tool" type="button" title="手形（H）" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M8 13V6a1.5 1.5 0 0 1 3 0v4-5a1.5 1.5 0 0 1 3 0v5-3a1.5 1.5 0 0 1 3 0v4-2a1.5 1.5 0 0 1 3 0v5a6 6 0 0 1-6 6h-1a5 5 0 0 1-4-2l-3-4a1.5 1.5 0 0 1 2-2.1l2 1.4"/></svg><span>平移</span></button>
      <button id="tool-shapes" class="tool" type="button" aria-controls="shape-palette" aria-expanded="false" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="10" height="8" rx="2"/><path d="m16 12 5 5-5 5-5-5 5-5Z"/></svg><span>图形</span></button>
      <button id="tool-connect" class="tool" type="button" title="连接（C）" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M6 17v-5h12V7"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/></svg><span>连接</span></button>
      <button id="tool-mind" class="tool" type="button" aria-pressed="false" title="新建脑图（M）"><svg viewBox="0 0 24 24"><path d="M6 12h4m4 0h2a2 2 0 0 0 2-2V7m-2 5a2 2 0 0 1 2 2v3"/><circle cx="4" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18" cy="5" r="2"/><circle cx="18" cy="19" r="2"/></svg><span>脑图</span></button>
      <button id="tool-text" class="tool" type="button" title="添加独立文字（T）" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M5 7V4h14v3M12 4v16M9 20h6"/></svg><span>文字</span></button>
      <button id="tool-path" class="tool" type="button" title="逐点绘制矢量路径" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="m4 16 8-10 8 11"/><path d="M2 14h4v4H2zm8-10h4v4h-4zm8 11h4v4h-4z"/></svg><span>路径</span></button>
      <button id="tool-ink" class="tool" type="button" title="手写（P）" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="m4 16-.5 4.5L8 20 20 8l-4-4L4 16Z"/><path d="m13 7 4 4"/></svg><span>手写</span></button>
      <button id="tool-image" class="tool" type="button" title="导入 PNG、JPEG 或静态 WebP"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m4 17 5-5 3 3 3-4 5 6M15 8h.01"/></svg><span>图片</span></button>
      <div class="tool-sep"></div>
      <button id="undo" class="tool" type="button" title="撤销（Ctrl+Z）" disabled><svg viewBox="0 0 24 24"><path d="M9 6 4 11l5 5M4 11h10a5 5 0 0 1 5 5v2"/></svg><span>撤销</span></button>
      <button id="redo" class="tool" type="button" title="重做（Ctrl+Shift+Z）" disabled><svg viewBox="0 0 24 24"><path d="m15 6 5 5-5 5m5-5H10a5 5 0 0 0-5 5v2"/></svg><span>重做</span></button>
      <button id="toggle-layers" class="tool mobile" type="button" aria-controls="layers-panel" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5ZM3 12l9 5 9-5M3 16l9 5 9-5"/></svg><span>图层</span></button>
      <button id="toggle-inspector" class="tool mobile" type="button" aria-controls="inspector-panel" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16M8 4v4m8 2v4M9 16v4"/></svg><span>属性</span></button>
    </div>
    <div class="stage-foot">空白拖拽框选 <span>·</span> Shift 多选 <span>·</span> 空格拖动画布 <span>·</span> Ctrl + 滚轮缩放</div>
  </main>
  <aside id="inspector-panel" class="sidebar right" aria-label="属性">
    <div class="panel-title"><strong>属性</strong><span>编辑预览</span></div>
    <div id="inspector"></div>
  </aside>
</div>
<input id="image-picker" type="file" accept="image/png,image/jpeg,image/webp,.png,.jpg,.jpeg,.webp" hidden>
<input id="project-picker" type="file" accept=".mgcanvas,application/json" hidden>
<script type="module">
const units=[{"path":"platform/theme.js","code":"                                                    \n                                                             \nexport const THEME_STORAGE_KEY=\"mg-canvas:workspace-theme\";\nexport function parseTheme(value        )                {return value===\"light\"||value===\"dark\"?value:\"system\";}\nexport function resolveTheme(preference                ,prefersDark        )               {\n  return preference===\"system\"?(prefersDark?\"dark\":\"light\"):preference;\n}\nexport const canvasThemes={\n  light:{bg:\"#f3f5f9\",grid:\"#d8dee9\",accent:\"#3566e7\",guide:\"#b02570\",accentMuted:\"#89a6ef\",accentFill:\"#3566e721\",handle:\"#ffffff\",\n    valid:\"#16886e\",invalid:\"#c54a3e\",placeholder:\"#e7edf6\",placeholderBorder:\"#b4c3dc\",placeholderInk:\"#52647d\",ink:\"#212735\",halo:\"#ffffff\"},\n  dark:{bg:\"#1b1d23\",grid:\"#363b49\",accent:\"#84a7ff\",guide:\"#ff91ca\",accentMuted:\"#6178ac\",accentFill:\"#84a7ff29\",handle:\"#252938\",\n    valid:\"#4bd7ae\",invalid:\"#ff8e82\",placeholder:\"#2b3443\",placeholderBorder:\"#687c9a\",placeholderInk:\"#d9e4f5\",ink:\"#e9eefb\",halo:\"#a2b5d3\"},\n}         ;\nfunction luminance(hex       )                 {\n  const spec=/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(hex)?.[1];\n  if(!spec)return;\n  const n=Number.parseInt(spec.length===3?[...spec].map(x=>x+x).join(\"\"):spec,16);\n  const lin=(b       )=>{const x=b/255;return x\u003c=.04045?x/12.92:((x+.055)/1.055)**2.4;};\n  return .2126*lin(n>>16)+.7152*lin((n>>8)&255)+.0722*lin(n&255);\n}\nexport function contrastRatio(fg       ,bg       )                 {\n  const a=luminance(fg),b=luminance(bg);\n  return a===undefined||b===undefined?undefined:(Math.max(a,b)+.05)/(Math.min(a,b)+.05);\n}\n/** Applies to automatically chosen diagram labels only, never persistent object ink. */\nexport function autoLabelInk(preferred       ,fill       )       {\n  const score=contrastRatio(preferred,fill);\n  if(score===undefined||score>=4.5)return preferred;\n  return (contrastRatio(\"#ffffff\",fill)??0)>=(contrastRatio(\"#000000\",fill)??0)?\"#ffffff\":\"#000000\";\n}\n","deps":{}},{"path":"platform/text-metrics.js","code":"/** The layout surface and the painter use the same canvas font and ink extent. */\nexport const textFallback='\"Microsoft YaHei UI\",\"PingFang SC\",\"Noto Sans CJK SC\",\"Noto Sans CJK JP\",\"Noto Color Emoji\",sans-serif';\nexport const nodeFont=(size       ,weight       )=>weight+\" \"+size+\"px \"+textFallback;\nexport const standaloneFont=(size       )=>\"500 \"+size+\"px system-ui,\"+textFallback;\n                                                                                                                                                       \nexport const inkWidth=(m           )=>Math.max(m.width,(m.actualBoundingBoxLeft??0)+(m.actualBoundingBoxRight??0));\nconst surfaces=new WeakMap                                        ();\n/** A dedicated, untransformed measuring context is shared by scene, hit testing\n * and topic layout. Pure model callers can use the deterministic width estimate. */\nexport function topicMeasureContext()                                   {\n  if(typeof document===\"undefined\")return;\n  if(!surfaces.has(document)){\n    let surface                              =null;\n    try{\n      const ctx=document.createElement(\"canvas\").getContext(\"2d\");\n      if(ctx&&ctx.measureText(\"M\")?.width>0){ctx.textAlign=\"center\";ctx.textBaseline=\"alphabetic\";surface=ctx;}\n    }catch{}\n    surfaces.set(document,surface);\n  }\n  return surfaces.get(document)??undefined;\n}\n","deps":{}},{"path":"features/text-layout.js","code":"/** Row breaks are display data. Original graphemes (including whitespace) stay intact. */\nconst segmenter=new Intl.Segmenter(\"zh\",{granularity:\"grapheme\"});\nconst opening=new Set([...\"（《〈【「『〔［｛“‘\"]);\nconst closing=new Set([...\"），。、！？；：》〉】」』〕］｝”’…\"]);\nconst BACKTRACK=8;\nexport const normalizeBreaks=(text       )=>text.replace(/\\r\\n?/g,\"\\n\");\n\n/** Keep the existing UTF-16 budget but never cut inside a grapheme. */\nexport function graphemePrefix(text       ,budget       )       {\n  if(text.length\u003c=budget)return text;\n  if(budget\u003c=0)return \"\";\n  const boundary=segmenter.segment(text).containing(budget);\n  return text.slice(0,boundary?.index??text.length);\n}\n/** Keep the unchanged suffix on a paste or composition in the middle of a full\n * field. Only the overflow path compares strings, bounded by the previous value. */\nexport function overflowEdit(previous       ,next       ,budget       ){\n  if(next.length\u003c=budget)return;\n  let prefix=0,tail=0;\n  const shared=Math.min(previous.length,next.length);\n  while(prefix\u003cshared&&previous.charCodeAt(prefix)===next.charCodeAt(prefix))prefix++;\n  while(tail\u003cshared-prefix&&previous.charCodeAt(previous.length-tail-1)===next.charCodeAt(next.length-tail-1))tail++;\n  const old=segmenter.segment(previous),fresh=segmenter.segment(next);\n  const floor=(parts              ,index       )=>parts.containing(index)?.index??index;\n  const ceil=(parts              ,index       )=>{\n    const part=parts.containing(index);\n    return part&&part.index\u003cindex?part.index+part.segment.length:index;\n  };\n  const start=Math.min(floor(old,prefix),floor(fresh,prefix));\n  const suffix=Math.min(previous.length-ceil(old,previous.length-tail),next.length-ceil(fresh,next.length-tail));\n  const oldEnd=previous.length-suffix,end=next.length-suffix;\n  // Regional-indicator parity can shift boundaries on both sides of a changed run.\n  if(floor(old,start)!==start||floor(fresh,start)!==start||floor(old,oldEnd)!==oldEnd||floor(fresh,end)!==end)\n    return {start:0,end:next.length,text:previous};\n  const cut=floor(fresh,budget-suffix);\n  if(cut\u003c=start)return {start,end,text:previous.slice(start,oldEnd)};\n  return {start:cut,end,text:\"\"};\n}\nexport function boundedTextEdit(previous       ,next f(!controls){const d=chordDistance(a,b,region);if(d\u003c=limit)best=Math.min(best,d);return;}\n    const {c1,c2}=controls,cutoff=Math.min(best,limit);\n    const dx=Math.max(0,region.min.x-Math.max(a.x,b.x,c1.x,c2.x),Math.min(a.x,b.x,c1.x,c2.x)-region.max.x);\n    const dy=Math.max(0,region.min.y-Math.max(a.y,b.y,c1.y,c2.y),Math.min(a.y,b.y,c1.y,c2.y)-region.max.y);\n    if(Math.hypot(dx,dy)>cutoff)return;\n    const flat=Math.max(pointLine(c1,a,b),pointLine(c2,a,b));\n    const chord=chordDistance(a,b,region);\n    if(chord-flat>cutoff)return;\n    if(flat\u003c=.0001||depth>=36){if(chord\u003c=limit)best=Math.min(best,chord);return;}\n    const [left,right]=splitSegment(s,.5);visit(left,depth+1);visit(right,depth+1);\n  };\n  visit(segment,0);return best;\n}\nexport function closestSegment(segments                       ,p      ,radius       ,preferred        )                 {\n  const region={min:p,max:p};\n  let best=preferred!==undefined&&segments[preferred]?segmentDistance(segments[preferred],region,radius):Infinity;\n  let index=Number.isFinite(best)?preferred:undefined;\n  segments.forEach((s,i)=>{\n    if(i===preferred)return;\n    const d=segmentDistance(s,region,Math.min(best,radius));\n    if(d\u003cbest){best=d;index=i;}\n  });\n  return index;\n}\n","deps":{}},{"path":"core/path-transform.js","code":"                                                    \n                                                           \nimport {validPathGeometry} from \"./document.js\";\nimport {segmentBetween,vectorBounds} from \"./path-geometry.js\";\n\n                                                                                          \nconst frames=new WeakMap                      ();\nconst minus=(a      ,b      )      =>({x:a.x-b.x,y:a.y-b.y});\n\n/** A contour-relative box follows rotations even for asymmetric curves. Its axes\n * come from the first significant directed edge; the bounds include cubic extrema. */\nexport function pathFrame(path           )          {\n  const cached=frames.get(path);\n  if(cached)return cached;\n  const {vertices,closed,curves}=path,first=vertices[0],count=vertices.length-(closed?0:1);\n  const edges=Array.from({length:count},(_,i)=>minus(vertices[(i+1)%vertices.length],vertices[i]));\n  const lengths=edges.map(p=>Math.hypot(p.x,p.y));\n  const longest=lengths.reduce((a,b)=>Math.max(a,b),0);\n  const index=lengths.findIndex(n=>n>0&&n>=longest*1e-8);\n  const ux=index\u003c0?1:edges[index].x/lengths[index],uy=index\u003c0?0:edges[index].y/lengths[index];\n  const local=(p      )      =>({x:p.x*ux+p.y*uy,y:-p.x*uy+p.y*ux});\n  const points=vertices.map(p=>local(minus(p,first)));\n  const segments=edges.map((_,i)=>{\n    const pair=curves?.[i];\n    return segmentBetween(points[i],points[(i+1)%points.length],pair?{out:local(pair.out),in:local(pair.in)}:undefined);\n  });\n  const {min,max}=vectorBounds(segments),x=(min.x+max.x)/2,y=(min.y+max.y)/2;\n  const center={x:(path.at.x+first.x)+(x*ux-y*uy),y:(path.at.y+first.y)+(x*uy+y*ux)};\n  const frame={center,width:max.x-min.x,height:max.y-min.y,rotation:Math.atan2(uy,ux)};\n  frames.set(path,frame);return frame;\n}\n\n/** Make the four corner targets distinct even for a single horizontal segment.\n * Padding belongs to the editing UI and is never part of the contour. */\nexport function pathHandleBox(frame          ,camera       )    {\n  const min=48/camera.zoom,width=Math.max(min,frame.width),height=Math.max(min,frame.height);\n  return {at:{x:frame.center.x-width/2,y:frame.center.y-height/2},width,height,rotation:frame.rotation};\n}\n\n/** Painted round caps and joins extend equally along both local axes. Grips still transform the centerline. */\nexport function pathStrokeBox(frame          ,strokeWidth       )    {\n  const width=frame.width+strokeWidth,height=frame.height+strokeWidth;\n  return {at:{x:frame.center.x-width/2,y:frame.center.y-height/2},width,height,rotation:frame.rotation};\n}\n\nfunction handleCoincides(at      ,vertex      ,delta      )        {\n  const x=at.x+vertex.x,y=at.y+vertex.y;\n  return x+delta.x===x&&y+delta.y===y;\n}\n\n/** At the new origin a drawable edge or handle must not vanish through numerical rounding. */\nfunction checkedPlacement(original           ,next           )                     {\n  if(!validPathGeometry(next))return;\n  const {vertices,at}=next,old=original.vertices;\n  for(let i=0;i\u003cvertices.length-(next.closed?0:1);i++){\n    const j=(i+1)%vertices.length,a=vertices[i],b=vertices[j];\n    if(at.x+a.x===at.x+b.x&&at.y+a.y===at.y+b.y&&\n      (original.at.x+old[i].x!==original.at.x+old[j].x||original.at.y+old[i].y!==original.at.y+old[j].y))return;\n    const pair=next.curves?.[i],before=original.curves?.[i];\n    if(pair&&before&&(handleCoincides(at,a,pair.out)&&!handleCoincides(original.at,old[i],before.out)||\n      handleCoincides(at,b,pair.in)&&!handleCoincides(original.at,old[j],before.in)))return;\n  }\n  return next;\n}\n\n/** Bake a center-based similarity, then place explicitly supplied axes at their final path origin.\n * For translation alone, retain the original relative anchors and cubic handles. */\nexport function transformPath(path           ,angle       ,scale       ,frame           ,position                )                     {\n  if(!Number.isFinite(angle)||!Number.isFinite(scale)||scale\u003c=0)return;\n  const turn=angle%(2*Math.PI);\n  const quarter=Math.PI/2,k=Math.round(turn/quarter);\n  const axis=Math.abs(turn-k*quarter)\u003c=4*Number.EPSILON;\n  const i=(k%4+4)%4,c=axis?[1,0,-1,0][i]:Math.cos(turn),s=axis?[0,1,0,-1][i]:Math.sin(turn);\n  if(c===1&&s===0&&scale===1){\n    const x=position?.x??path.at.x,y=position?.y??path.at.y;\n    return x===path.at.x&&y===path.at.y?path:checkedPlacement(path,{...path,at:{x,y}});\n  }\n  frame??=pathFrame(path);\n  const vector=(p      )      =>({x:(p.x*c-p.y*s)*scale,y:(p.x*s+p.y*c)*scale});\n  // Older files can place a valid short contour extremely far from its local\n  // origin export const flowGroupOf=(doc              ,id    )=>doc.flowGroups&&id?index(doc).owners.get(id):undefined;\nexport const groupUnit=(doc              ,group   )              =>doc.flowGroups?index(doc).units.get(group)??[]:[];\nexport function expandGroupSelection(doc              ,ids              ,editing    )              {\n  if(!doc.flowGroups)return ids;\n  const seen=new Set    (),out=new Set    ();\n  for(const id of ids){\n    const group=flowGroupOf(doc,id);\n    if(!group||group===editing)out.add(id);\n    else if(!seen.has(group)){seen.add(group);for(const child of groupUnit(doc,group))out.add(child);}\n  }\n  return [...out];\n}\nexport function groupableNodes(doc              ,ids              )               {\n  if(ids.length\u003c2)return;\n  const picked=new Set(ids),nodes     =[];\n  for(const id of picked){\n    const item=doc.objects[id];if(!item||flowGroupOf(doc,id))return;\n    if(item.kind===\"shape\")nodes.push(id);\n    else if(item.kind!==\"connector\"||item.from.kind!==\"anchor\"||item.to.kind!==\"anchor\"||\n      !picked.has(item.from.objectId)||!picked.has(item.to.objectId))return;\n  }\n  return nodes.length>=2?nodes:undefined;\n}\n","deps":{}},{"path":"core/history.js","code":"import { assertDocument, DocumentValidationError,isRecord,contentVersion, freezeData, has, isBox,isPoint,objectById,resolveEndpoint,zeroLengthConnector } from \"./document.js\";\nimport { validInkGeometry } from \"../features/ink.js\";\n                                                                                           \n\n                   \n                                                     \n                                            \n                                                          \n                                                    \n                                                   \n                                           \n                                                \n                                                                                 \n                                  \n                                                                       \n                                                                       \n                                                                                                     \n   \n                                                                                 \n                                                                                                                           \n                                                                               \n\nconst HISTORY_LIMIT = 100;\nconst checkedDocuments=new WeakSet               ();\nconst unchanged = freezeData           ({\n  added: [], updated: [], removed: [], invalidatedMaps: [], invalidatedConnectors: [],\n  assetsChanged: [], orderChanged: false, themeChanged: false,\n});\nexport function createHistory(doc               )          {\n  const copy = structuredClone(doc);\n  assertDocument(copy);\n  const checked=freezeData(copy);checkedDocuments.add(checked);\n  return asState(checked, 0, [], []);\n}\n\nfunction asState(doc               , revision        , past         , future         )          {\n  // Document snapshots share their frozen unchanged objects. Do not re-walk history.\n  return Object.freeze({ doc, revision, past: Object.freeze(past), future: Object.freeze(future) });\n}\nfunction frame(label        , doc               , forward          )        {\n  return Object.freeze({ label, doc, forward });\n}\nfunction appendCapped(frames                  , entry       )          {\n  return [...frames.slice(-(HISTORY_LIMIT - 1)), entry];\n}\n\nexport function dispatch(state         , transaction             )                {\n  if (!transaction.patches.length) return { state, changeSet: unchanged };\n  const fast=geometryDispatch(state,transaction);\n  if(fast)return fast;\n  const { doc } = state;\n  let objects                                     ;\n  let assets                                    ;\n  let order = doc.order;\n  let theme = doc.theme;\n  let members=doc.flowGroups?.members,explicitGroups=false,removed=false;\n  // Null-prototype staging cannot reinterpret a malformed key as a setter.\n  const objectsForWrite = ()                          => objects ??= Object.assign(Object.create(null), doc.objects);\n  const assetsForWrite = ()                         => assets ??= Object.assign(Object.create(null), doc.assets);\n  for (const patch of transaction.patches) {\n    switch (patch.op) {\n      case \"putObject\": {\n        const next = objectsForWrite();\n        const id = patch.value.id;\n        if (!has(next, id)) order = [...order, id];\n        const previous = has(next,id) ? next[id] : undefined;\n        const copy = structuredClone(patch.value);\n        // Preserve immutable tree identity when only its group transform changes.\n        next[id] = freezeData(copy.kind === \"mindmap\" && previous?.kind === \"mindmap\" &&\n          equal(copy.topics,previous.topics) ? { ...copy, topics:previous.topics } : copy);\n        break;\n      }\n      case \"removeObject\": {\n        const next = objectsForWrite();\n        if (!has(next, patch.id)) break;\n        removed=true;\n        delete next[patch.id];\n        order = order.filter(id => id !== patch.id);\n        break;\n      }\n      case \"putAsset\":\n        assetsForWrite()[patch.value.id] = freezeData(structuredClone(patch.value));\n        break;\n      case \"removeAsset\":\n        delete assetsForWrite()[patch.id];\n        break;\n      case \"setFlowGroups\":\n        if(!isRecord(patch.members))throw new DocumentValidationError([{path:\"flowGroups.members\",message:\"分组成员表无效\"}]);\n        members=structuredClone(patch.members);explicitGroups=true;break;\n      case \"setOrder\":\n        order = [...patch.ids];\n        break;\n      case \"setTheme\":\n        theme = patch.theme;\n        break;\n      default:\n        t olors.mint:object.theme===\"warm\"?mindColors.warm:mindColors.indigo;\n      const index = layoutIndex(local);\n      for (const node of local) {\n        const inside = node.parent ? index.get(node.parent) : undefined;\n        if (!inside) continue;\n        const left = node.side === \"left\";\n        const a = portWorld(inside.box,\"rect\",left?\"west\":\"east\"), b=portWorld(node.box,\"rect\",left?\"east\":\"west\");\n        const center = (a.x+b.x)/2;\n        line([a,point(center,a.y),point(center,b.y),b],left?color.leftStroke:color.rightStroke,1.8,undefined,true,false);\n      }\n      for (const node of local) {\n        const at=node.box.at;\n        const isRoot=node.depth===0;\n        const left=node.side===\"left\";\n        const paint=topicPaint(object,node.topic,node.side);\n        box({ ...node.box,at },\"rect\",isRoot?12:8,paint.fill,paint.stroke,paint.strokeWidth);\n        const textBox=makeBox(point(at.x+9,at.y+5),node.box.width-18,node.box.height-10);\n        items.push({kind:\"nodeLabel\",box:textBox,topicId:node.topic.id,text:node.topic.text||\"未命名\",rows:node.lines,fontSize:node.fontSize,\n          weight:isRoot?800:600,color:paint.textColor,maxLines:6});\n        if(node.topic.collapsed&&node.topic.childIds.length){\n          const x=at.x+(left?5:node.box.width-5),y=at.y+7;\n          label(point(x,y),\"+\",10,paint.textColor,\"center\",700);\n        }\n      }\n      if(bounds){\n        const group={id,items,picks,bounds,topicCount:picks.length};\n        topicGeometry.set(local,{id,theme:object.theme,group});groups.push(placeTopics(group,object.origin));\n      }\n      continue;\n    } else if (object.kind === \"text\") {\n      const at = object.at;\n      const range={...object,at},fixed=object.heightMode===\"fixed\";\n      const lines=wrapPlainText(object.text,object.width,object.fontSize);\n      const height=fixed?object.height:Math.max(object.height,lines.length*object.fontSize*1.4);\n      let width=object.width;\n      if(!fixed&&width\u003cobject.fontSize)for(const row of lines)width=Math.max(width,estimatedTextWidth(row,object.fontSize));\n      let visible    =range;\n      if(height!==object.height||width!==object.width){\n        // Old fitted boxes may contain newly wrapped ink below their stored frame.\n        // Keep their local top edge, rotation pivot and serialized dimensions intact.\n        const offset=object.align===\"left\"?0:object.align===\"right\"?object.width-width:(object.width-width)/2;\n        const center=localToWorld(point(offset+width/2,height/2),range);\n        visible={at:point(center.x-width/2,center.y-height/2),width,height,rotation:range.rotation};\n      }\n      picks.push({box:visible,shape:\"rect\"});bounds=mergeBounds(bounds,boxBounds(visible));\n      items.push({kind:\"textBlock\",box:range,lines,textAlign:object.align,fontSize:object.fontSize,color:object.color,...(fixed?{clip:true}:{})});\n    } else if(object.kind===\"path\"){\n      const segments=pathSegments(object),pad=object.strokeWidth/2;\n      const points=[segments[0].from,...segments.slice(0,object.vertices.length-1).map(s=>s.to)];\n      items.push({kind:\"path\",points,segments,closed:object.closed,fill:object.fill,color:object.stroke,width:object.strokeWidth});\n      picks.push({segments,hitPad:pad,filled:Boolean(object.closed&&object.fill)});\n      const b=vectorBounds(segments);bounds={min:point(b.min.x-pad,b.min.y-pad),max:point(b.max.x+pad,b.max.y+pad)};\n    } else if(object.kind===\"ink\"){\n      const points=inkPoints(object);\n      items.push({kind:\"ink\",points,color:object.color});picks.push({ink:points});bounds=inkBounds(points);\n    } else {\n      const range = object;\n      items.push({kind:\"image\",box:range,assetId:object.assetId});\n      picks.push({box:range,shape:\"rect\"});\n      bounds=mergeBounds(bounds,boxBounds(range));\n    }\n    if (bounds) groups.push({ id,items,picks,bounds });\n  }\n  return groups;\n}\nfunction nearSegment(p      ,a label                              ={\n  front:\"置于顶层\",back:\"置于底层\",forward:\"上移一层\",backward:\"下移一层\",\n  left:\"左对齐\",center:\"水平居中\",right:\"右对齐\",top:\"上对齐\",middle:\"垂直居中\",bottom:\"下对齐\",\n  \"distribute-x\":\"水平等距\",\"distribute-y\":\"垂直等距\",\n};\nconst layer=(command               )                        =>\n  command===\"front\"||command===\"back\"||command===\"forward\"||command===\"backward\";\nconst distribute=(command               )                             =>\n  command===\"distribute-x\"||command===\"distribute-y\";\n\nexport function arrangeLayerOrder(order              ,selected              ,command             )              {\n  const ids=new Set(selected);\n  if(command===\"front\"||command===\"back\"){\n    const moved=order.filter(id=>ids.has(id)),rest=order.filter(id=>!ids.has(id));\n    return command===\"front\"?[...rest,...moved]:[...moved,...rest];\n  }\n  const next=[...order];\n  // Same-direction selected neighbors rise/fall together without swapping\n  // with one another; sweep opposite the direction of motion.\n  if(command===\"forward\"){\n    for(let i=next.length-2;i>=0;i--)if(ids.has(next[i])&&!ids.has(next[i+1]))\n      [next[i],next[i+1]]=[next[i+1],next[i]];\n  }else{\n    for(let i=1;i\u003cnext.length;i++)if(ids.has(next[i])&&!ids.has(next[i-1]))\n      [next[i-1],next[i]]=[next[i],next[i-1]];\n  }\n  return next;\n}\nfunction selectedMovers(doc              ,selected              )              {\n  return [...new Set(selected)].flatMap(id=>{\n    const item=objectById(doc,id);\n    return item&&(item.kind!==\"connector\"||(item.from.kind===\"free\"&&item.to.kind===\"free\"))?[item]:[];\n  });\n}\n                                                        \nfunction measures(doc              ,items                       )          {\n  const indexed=new Map(items.map(item=>[item.id,item]));\n  const ranks=new Map(doc.order.map((id,index)=>[id,index]));\n  return buildScene(doc,undefined,items.map(item=>item.id)).flatMap(group=>{\n    const item=indexed.get(group.id);\n    if(!item)return [];\n    return [{item,bounds:alignmentBounds(item,group.bounds),rank:ranks.get(item.id)??0}];\n  });\n}\n                  \n                                 \nconst epsilon=1e-9;\nconst at=(axis     ,n       )      =>axis===\"x\"?{x:n,y:0}:{x:0,y:n};\nfunction alignDelta(items                   ,command             )      {\n  const axis=command===\"left\"||command===\"center\"||command===\"right\"?\"x\":\"y\";\n  const edge=command===\"left\"||command===\"top\"?\"min\":command===\"right\"||command===\"bottom\"?\"max\":\"middle\";\n  const min=items.reduce((best,i)=>Math.min(best,i.bounds.min[axis]),Infinity);\n  const max=items.reduce((best,i)=>Math.max(best,i.bounds.max[axis]),-Infinity);\n  const target=edge===\"min\"?min:edge===\"max\"?max:(min+max)/2;\n  return new Map(items.map(({item,bounds})=>[\n    item.id,at(axis,target-(edge===\"middle\"?(bounds.min[axis]+bounds.max[axis])/2:bounds[edge][axis])),\n  ]));\n}\nfunction distributeDelta(items                   ,axis     )      {\n  const sorted=[...items].sort((a,b)=>a.bounds.min[axis]-b.bounds.min[axis]||a.rank-b.rank);\n  const first=sorted[0].bounds,last=sorted.at(-1) .bounds;\n  const lengths=sorted.map(({bounds})=>bounds.max[axis]-bounds.min[axis]);\n  const gap=(last.max[axis]-first.min[axis]-lengths.reduce((a,b)=>a+b,0))/(sorted.length-1);\n  // A signed gap can preserve a modest overlap. If equal gaps would\n  // actually reverse the spatial order, leave the arrangement untouched.\n  if(lengths.slice(0,-1).some(length=>length+gap\u003c -epsilon))return new Map();\n  let cursor=first.max[axis]+gap;\n  const deltas=new Map          ();\n  for(let i=1;i\u003csorted.length-1;i++){\n    const {item,bounds}=sorted[i];\n    deltas.set(item.id,at(axis,cursor-bounds.min[axis]));\n    cursor+=lengths[i]+gap;\n  }\n  return deltas;\n}\nconst unchanged={x:0,y:0};\nconst moving=(delta      )=>Math.abs(delta.x)>epsilon||Math.abs(delta.y)>epsilon;\nfunction geometryPatches(doc              ,items                   ,deltas      ,hidden                )                 {\n  const moved=new Map                ();\n  for(const {item} of items){\n    const delta=deltas.get(item.id);\n    if(!delta||!moving(delta))continue;\n    for(const [id,result] of moveObjects(item.kind===\"connector\"?{movers:[],connectors:[item]}:{movers:[item],connectors:[]},delta))moved.set(id,result);\n  }\n  // Bound connector positions are always projected from their anchors.\n  // Explicit bends translate only when both anchors moved together.\n  for(const id of doc.order){\n    const line=doc.objects[id];\n    if(hidden.has(id)||line.kind!==\"connector\"||!line.waypoints.length||line.from.kind!==\"anchor\"||line.to.kind!==\"anchor\")continue;\n    const from=deltas.get(line.from.objectId)??unchanged,to=deltas.get(line.to.objectId)??unchanged;\n    if(moving(from)&&Math.abs(from.x-to.x)\u003c=epsilon&&Math.abs(from.y-to.y)\u003c=epsilon)\n      for(const [id,result] of moveObjects({movers:[],connectors:[line]},from))moved.set(id,result);\n  }\n  return movePatches(moved);\n}\nfunction arrangeUnit(editor              ,id   )   {\n  const group=flowGroupOf(editor.doc,id);return group&&group!==editor.editingGroup?group:id;\n}\nexport function canArrange(editor              ,command               )        {\n  if(editor.busy||!editor.selectedIds.length||editor.selectionLocked)return false;\n  if(layer(command)){\n    const order=arrangeLayerOrder(editor.doc.order,editor.selectedIds,command);\n    return order.some((id,index)=>id!==editor.doc.order[index])&&editor.permitsOrder(order);\n  }\n  const movers=selectedMovers(editor.doc,editor.selectedIds);\n  const count=editor.doc.flowGroups?new Set(movers.map(item=>arrangeUnit(editor,item.id))).size:movers.length;\n  return count>=(distribute(command)?3:2);\n}\nexport function arrangeSelection(editor              ,command               )        {\n  if(!canArrange(editor,command))return false;\n  const doc=editor.doc,selected=editor.selectedIds;\n  if(layer(command))return editor.commitEdit({label:label[command],patches:[\n    {op:\"setOrder\",ids:arrangeLayerOrder(doc.order,selected,command)},\n  ]},editor.generation);\n  const items=measures(doc,selectedMovers(doc,selected)),units=new Map            ();\n  for(const entry of items){\n    const id=arrangeUnit(editor,entry.item.id),previous=units.get(id);\n    units.set(id,previous?{...previous,bounds:mergeBounds(previous.bounds,entry.bounds)}:entry);\n  }\n  const boxes=[...units.values()];if(boxes.length\u003c(distribute(command)?3:2))return false;\n  const offsets=distribute(command)?distributeDelta(boxes,command===\"distribute-x\"?\"x\":\"y\"):alignDelta(boxes,command);\n  const deltas=new Map          ();\n  for(const {item} of items){\n    const representative=units.get(arrangeUnit(editor,item.id)) .item.id,delta=offsets.get(representative);\n    if(delta)deltas.set(item.id,delta);\n  }\n  const patches=geometryPatches(doc,items,deltas,editor.hiddenIds);\n  return patches.length>0&&editor.commitEdit({label:label[command],patches},editor.generation);\n}\n","deps":{"../core/flow-groups.js":"core/flow-groups.js","../core/document.js":"core/document.js","../scene/board.js":"scene/board.js","../session/transform.js":"session/transform.js"}},{"path":"scene/spatial-grid.js","code":"                                            \n                                              \n\nconst CELL=512, TILE_SIDE=16, TILE_SIZE=CELL*TILE_SIDE;\nconst MAX_FOOTPRINT=64, MAX_QUERY_TILES=1600, MAX_FINE_PROBES=16384;\nconst key=(x       ,y       )=>x+\":\"+y;\n\nexport function cellRange(box     ,size=CELL){\n  const x1=Math.floor(box.min.x/size), y1=Math.floor(box.min.y/size);\n  const x2=Math.floor(box.max.x/size), y2=Math.floor(box.max.y/size);\n  const safe=[x1,y1,x2,y2].every(Number.isSafeInteger)&&x1\u003c=x2&&y1\u003c=y2;\n  return {x1,y1,x2,y2,safe,count:(x2-x1+1)*(y2-y1+1)};\n}\n\n                                                   \n                                    \n                                                                                                   \n   \n\n/** Ordinary groups use existing 512-unit buckets. The tile directory holds one\n * reference per occupied bucket; longer groups use tiles directly, up to 64. */\nexport class SceneGrid{\n          fine=new Map                ();\n          tiles=new Map             ();\n          oversized=new Set    ();\n\n  clear(){this.fine.clear();this.tiles.clear();this.oversized.clear();}\n  fineMembers(x       ,y       )                          {return this.fine.get(key(x,y));}\n  add(id   ,box     ){return this.change(id,box,true);}\n  remove(id   ,box     ){this.change(id,box,false);}\n\n          tile(x       ,y       ){\n    const address=key(x,y);\n    let tile=this.tiles.get(address);\n    if(!tile){tile={fine:new Map(),large:new Set()};this.tiles.set(address,tile);}\n    return tile;\n  }\n          prune(x       ,y       ,tile     ){\n    if(!tile.fine.size&&!tile.large.size)this.tiles.delete(key(x,y));\n  }\n          changeFine(id   ,x       ,y       ,add        ){\n    const address=key(x,y),ids=this.fine.get(address);\n    if(ids&&add){ids.add(id);return;}\n    if(!add&&(!ids||!ids.delete(id)||ids.size))return;\n    const tx=Math.floor(x/TILE_SIDE),ty=Math.floor(y/TILE_SIDE);\n    const slot=(y-ty*TILE_SIDE)*TILE_SIDE+(x-tx*TILE_SIDE);\n    if(add){\n      const members=new Set([id]);\n      this.fine.set(address,members);this.tile(tx,ty).fine.set(slot,members);\n    }else{\n      this.fine.delete(address);\n      const tile=this.tiles.get(key(tx,ty)) ;\n      tile.fine.delete(slot);this.prune(tx,ty,tile);\n    }\n  }\n          change(id   ,box     ,add        ){\n    const fine=cellRange(box);\n    if(fine.safe&&fine.count\u003c=MAX_FOOTPRINT){\n      for(let y=fine.y1;y\u003c=fine.y2;y++)for(let x=fine.x1;x\u003c=fine.x2;x++)this.changeFine(id,x,y,add);\n      return true;\n    }\n    const broad=cellRange(box,TILE_SIZE);\n    if(broad.safe&&broad.count\u003c=MAX_FOOTPRINT){\n      for(let y=broad.y1;y\u003c=broad.y2;y++)for(let x=broad.x1;x\u003c=broad.x2;x++){\n        if(add)this.tile(x,y).large.add(id);\n        else{\n          const tile=this.tiles.get(key(x,y));\n          if(tile){tile.large.delete(id);this.prune(x,y,tile);}\n        }\n      }\n    }else if(add)this.oversized.add(id);\n    else this.oversized.delete(id);\n    return false;\n  }\n\n  /** False requests an exact paint-order scan. A budget never truncates visible results. */\n  collect(rect     ,groupCount       ,out        ,audit                            )        {\n    let tiles=0,fineProbes=0,memberships=0;\n    const finish=(mode                      )=>{\n      audit?.({mode,tiles,fineProbes,memberships});\n      return mode===\"indexed\";\n    };\n    const fine=cellRange(rect),broad=cellRange(rect,TILE_SIZE);\n    if(!fine.safe||!broad.safe||broad.count>MAX_QUERY_TILES)return finish(\"extent\");\n    const membershipBudget=Math.max(2048,Math.min(32768,Math.ceil(groupCount*.65)));\n    const take=(ids                )=>{\n      if(memberships+ids.size>membershipBudget)return false;\n      memberships+=ids.size;\n      for(const id of ids)out.add(id);\n      return true;\n    };\n    if(!take(this.oversized))return finish(\"density\");\n    for(let ty=broad.y1;ty\u003c=broad.y2;ty++)for(let tx=broad.x1;tx\u003c=broad.x2;tx++){\n      const tile=this.tiles.get(key(tx,ty));tiles++;\n      if(!tile)continue;\n      if(!take(tile.large))return finish(\"density\");\n      const ox=tx*TILE_SIDE,oy=ty*TILE_SIDE;\n      const x1=Math.max(0,fine.x1-ox),x2=Math.min(TILE_SIDE-1,fine.x2-ox);\n      const y1=Math.max(0,fine.y1-oy),y2=Math.min(TILE_SIDE-1,fine.y2-oy);\n      const slots=(x2-x1+1)*(y2-y1+1);\n      if(fineProbes+Math.min(slots,tile.fine.size)>MAX_FINE_PROBES)return finish(\"fine-limit\");\n      // For a small hit rectangle probe its slots. For a wide sparse view visit only occupied buckets.\n      if(slots\u003ctile.fine.size){\n        for(let y=y1;y\u003c=y2;y++)for(let x=x1;x\u003c=x2;x++){\n          const ids=tile.fine.get(y*TILE_SIDE+x);fineProbes++;\n          if(ids&&!take(ids))return finish(\"density\");\n        }\n      }else{\n        for(const [slot,ids] of tile.fine){\n          const x=slot%TILE_SIDE,y=Math.floor(slot/TILE_SIDE);fineProbes++;\n          if(x>=x1&&x\u003c=x2&&y>=y1&&y\u003c=y2&&!take(ids))return finish(\"density\");\n        }\n      }\n    }\n    return finish(\"indexed\");\n  }\n}\n","deps":{}},{"path":"scene/projector.js","code":"                                                                                  \n                                                \n                                                    \nimport { alignmentBounds,buildScene,mergeBounds } from \"./board.js\";\nimport {DragAlignment} from \"../session/drag-alignment.js\";\nimport {planMove} from \"../session/transform.js\";\n                                                  \nimport {cellRange,SceneGrid} from \"./spatial-grid.js\";\n                                                     \n\n                                                                                               \n                                                                                                                                          \n                                                                                           \n// Optional drag assistance gives way to free movement above either budget.\nconst SNAP_CELLS=256,SNAP_ENTRIES=512;\nconst finite=(b     )=>[b.min.x,b.min.y,b.max.x,b.max.y].every(Number.isFinite);\nconst overlaps=(a     ,b     )=>a.min.x\u003c=b.max.x&&b.min.x\u003c=a.max.x&&a.min.y\u003c=b.max.y&&b.min.y\u003c=a.max.y;\nfunction endpoints(connector          )        {\n  const result=new Set    ();\n  if(connector.from.kind===\"anchor\")result.add(connector.from.objectId);\n  if(connector.to.kind===\"anchor\")result.add(connector.to.objectId);\n  return result;\n}\n\nexport class SceneProjection {\n          identity=new Map              ();\n          doc              ;\n          ordered                ;\n          adjacency=new Map            ();\n          hidden                =new Set();\n          grid=new SceneGrid();\n          alignmentSpanning=new Set    ();\n          rank=new Map           ();\n  constructor(doc              ){this.doc=doc;this.reset(doc);}\n          reset(doc              )                 {\n    this.doc=doc;this.identity.clear();this.adjacency.clear();this.grid.clear();this.alignmentSpanning.clear();\n    this.resetRank();\n    const next=buildScene(doc);\n    for(const group of next)this.registerGroup(group);\n    this.ordered=this.hidden.size?undefined:next;\n    for(const item of Object.values(doc.objects))if(item.kind===\"connector\")this.registerEdge(item);\n    return {mode:\"full\",projected:next.length};\n  }\n          resetRank()     {this.rank.clear();this.doc.order.forEach((id,index)=>this.rank.set(id,index));}\n          registerGroup(group          )     {\n    this.identity.set(group.id,group);\n    if(!this.hidden.has(group.id))this.indexGroup(group);\n  }\n          indexGroup(group          )     {\n    const fine=this.grid.add(group.id,group.bounds);\n    if(!fine&&this.doc.objects[group.id]?.kind!==\"connector\")this.alignmentSpanning.add(group.id);\n  }\n          unregisterGroup(id   )     {\n    const group=this.identity.get(id);\n    if(group&&!this.hidden.has(id))this.unindexGroup(group);\n    this.identity.delete(id);\n  }\n          unindexGroup(group          )     {\n    this.grid.remove(group.id,group.bounds);this.alignmentSpanning.delete(group.id);\n  }\n  /** Keep canonical geometry and adjacency available for restore and undo.\n   * Only paintable groups occupy viewport and snap candidate budgets. */\n  setHidden(ids                )     {\n    if(ids===this.hidden)return;\n    const previous=this.hidden;this.hidden=ids;this.ordered=undefined;\n    for(const id of ids)if(!previous.has(id)){const group=this.identity.get(id);if(group)this.unindexGroup(group);}\n    for(const id of previous)if(!ids.has(id)){const group=this.identity.get(id);if(group)this.indexGroup(group);}\n  }\n          registerEdge(connector          )     {\n    for(const id of endpoints(connector)){\n      let nodes=this.adjacency.get(id);if(!nodes){nodes=new Set();this.adjacency.set(id,nodes);}\n      nodes.add(connector.id);\n    }\n  }\n          unregisterEdge(connector          )     {\n    for(const id of endpoints(connector)){\n      const nodes=this.adjacency.get(id);\n      if(nodes){nodes.delete(connector.id);if(!nodes.size)this.adjacency.delete(id);}\n    }\n  }\n          z(id   )       {return this.rank.get(id)??this.doc.order.length;}\n\n  /** Accept exactly the authoritative ChangeSet for this preceding document. A\n   * new board/missing delta/global style/broad edit deliberately falls back. */\n  update(doc              ,change           )                 {\n    if(doc===this.doc)return {mode:\"none\",projected:0};\n    if(!change||doc.id!==this.doc.id||doc.schemaVersion!==this.doc.schemaVersion||change.themeChanged)return this.reset(doc);\n    const direct=new Set([...change.added,...change.updated,...change.removed]);\n    const dirty=new Set([...direct,...change.invalidatedMaps,...change.invalidatedConnectors]);\n    if(dirty.size>Math.max(512,doc.order.length*.22))return this.reset(doc);\n    for(const id of direct){\n      const before=this.doc.objects[id],after=doc.objects[id];\n      if(before?.kind===\"connector\")this.unregisterEdge(before);\n      if(after?.kind===\"connector\")this.registerEdge(after);\n    }\n    this.doc=doc;\n    if(change.orderChanged)this.resetRank();\n    if(dirty.size||change.orderChanged)this.ordered=undefined;\n    for(const id of dirty)this.unregisterGroup(id);\n    const updated=buildScene(doc,undefined,[...dirty]);\n    for(const group of updated)this.registerGroup(group);\n    return {mode:\"incremental\",projected:updated.length};\n  }\n\n  overlay(override               )                          {\n    if(!override?.objects.size)return EMPTY;\n    const dirty=new Set(override.objects.keys());\n    for(const [id,value] of override.objects)if(value.kind===\"shape\")for(const link of this.adjacency.get(id)??[])dirty.add(link);\n    return new Map(buildScene(this.doc,override,[...dirty].filter(id=>!this.hidden.has(id))).map(item=>[item.id,item]));\n  }\n  all(patch                          =EMPTY)      {\n    const scene=this.ordered??=this.doc.order.flatMap(id=>{const group=this.identity.get(id);return group&&!this.hidden.has(id)?[group]:[];});\n    if(!patch.size)return scene;\n    return [...scene.map(group=>patch.get(group.id)??group),...[...patch.values()].filter(group=>!this.hidden.has(group.id)&&!this.identity.has(group.id))];\n  }\n  /** Committed neighbors only. A broad or crowded region returns no guides\n   * instead of a partial, insertion-order-dependent sample or a whole-scene scan. */\n          alignmentTargets(rect     ,excluded                ,audit                                 ){\n    const targets                      =[];\n    let lookups=0,memberships=0,spanning=0,objects=0;\n    const finish=(limited=false)=>{\n      audit?.({cells:lookups,memberships,spanning,objects,returned:targets.length,limited});\n      return targets;\n    };\n    const range=cellRange(rect),ids=new Set    ();\n    let examined=this.alignmentSpanning.size;\n    if(!range.safe||range.count>SNAP_CELLS||examined>SNAP_ENTRIES)return finish(true);\n    for(let y=range.y1;y\u003c=range.y2;y++)for(let x=range.x1;x\u003c=range.x2;x++){\n      const bucket=this.grid.fineMembers(x,y);lookups++;\n      if(!bucket)continue;\n      examined+=bucket.size;\n      if(examined>SNAP_ENTRIES)return finish(true);\n      for(const id of bucket){ids.add(id);memberships++;}\n    }\n    for(const id of this.alignmentSpanning){ids.
