?palette.root:depth===1?branch:tint(branch,.79));\n  const stroke=style?.stroke??(underline?branch:root?tint(palette.root,.32):depth===1?branch:tint(branch,.36));\n  const background=fill===\"transparent\"?canvasThemes[workspace].bg:fill;\n  return {fill,stroke,textColor:style?.textColor??contrastInk(background),strokeWidth:style?.strokeWidth??(underline?branchWidth(map):undefined),branch,\n    underline,surfaceInk:fill===\"transparent\"&&style?.textColor===undefined};\n}\nexport function mergeBounds(a                 ,b       )        {\n  if (!a) return b;\n  return { min:point(Math.min(a.min.x,b.min.x),Math.min(a.min.y,b.min.y)), max:point(Math.max(a.max.x,b.max.x),Math.max(a.max.y,b.max.y)) };\n}\nfunction pathBounds(points                 )        {\n  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;\n  for (const p of points) { minX=Math.min(minX,p.x); minY=Math.min(minY,p.y); maxX=Math.max(maxX,p.x); maxY=Math.max(maxY,p.y); }\n  return { min:point(minX,minY), max:point(maxX,maxY) };\n}\n/** World edges shared by drag guides and explicit alignment commands. */\nexport function alignmentBounds(item            ,projected     )     {\n  if(item.kind!==\"shape\"||item.shape===\"rect\")return projected;\n  const w=item.width,h=item.height;\n  const vertices=item.shape===\"diamond\"?[point(w/2,0),point(w,h/2),point(w/2,h),point(0,h/2)]:\n    [point(w/2,0),point(w,h),point(0,h)];\n  return pathBounds(vertices.map(p=>localToWorld(p,item)));\n}\nexport function buildScene(doc              , preview                                                                          ,ids               )       {\n  const lookup = (id   ) => preview?.objects.get(id) ?? doc.objects[id];\n  const endpoint = (e         )                 => {\n    if (e.kind === \"free\") return e.point;\n    const shape = lookup(e.objectId);\n    if (shape?.kind !== \"shape\") return;\n    return portWorld(shape,shape.shape,e.portId);\n  };\n  const groups              = [];\n  const ordered=ids ?? (preview?.extra?.length ? [...doc.order,...preview.extra] : doc.order);\n  for (const id of ordered) {\n    const object = preview?.objects.get(id) ?? doc.objects[id];\n    if(!object)continue;\n    const items              = [], picks         = [];\n    let bounds                  ;\n    const box = (range    , shape          , radius       , fill       , stroke       , strokeWidth        ,underline           ) => {\n      items.push({ kind:\"box\",box:range,shape,radius,fill,stroke,...(strokeWidth===undefined?{}:{strokeWidth}),...(underline?{underline}:{}) });\n      picks.push({ box:range,shape });\n      const b=boxBounds(range), pad=strokeWidth!==undefined&&strokeWidth>DEFAULT_SHAPE_STROKE?strokeWidth/2:0;\n      bounds = mergeBounds(bounds,pad?{min:point(b.min.x-pad,b.min.y-pad),max:point(b.max.x+pad,b.max.y+pad)}:b);\n    };\n    const label = (at      ,text       ,size       ,color = dark,align                        =\"center\",weight = 600,maxWidth        ,canvasInk      ) => {\n      if (text) items.push({ kind:\"text\",at,text,size,color,align,weight,maxWidth,...(canvasInk?{canvasInk}:{}) });\n    };\n    const line = (points                 , color       , width       , arrow                             , curved=false, pick=true, pad=0,junction                   ) => {\n      const arrows=arrow&&connectorArrows(points,width,arrow);\n      items.push({ kind:\"path\",points,color,width,arrow,curved,...(arrows?{arrows}:{}),...(junction?{junction}:{}) });\n      if (pick) picks.push({ points:arrows?.shaft??points,...(pad?{hitPad:pad}:{}) });\n      const b=pathBounds(points);\n      bounds = mergeBounds(bounds,pad?{min:point(b.min.x-pad,b.min.y-pad),max:point(b.max.x+pad,b.max.y+pad)}:b);\n      if(arrows)for(const head of arrows.heads){\n        bounds=mergeBounds(bounds,pathBounds(head));\n        picks.push({segments:head.map((from,i)=>({from,to:head[(i+1)%3]})),hitPad:0,filled:true});\n      }\n    };\n    if (object.kind === \"shape\") {\n      const range = object;\n      box(range,object.shape,object.cornerRadius,object.fill,object.stroke,object.strokeWidth);\n      if(isCard(object)){\n        items.push({kind:\"cardText\",box:object,layout:cardLayout(object)});\n      }else if(object.label){\n        items.push({kind:\"nodeLabel\",box:flowLabelBox(object),text:object.label,\n          fontSize:13,weight:700,color:autoLabelInk(dark,object.fill),labelFill:object.fill,maxLines:object.shape===\"diamond\"?1:3});\n      }\n    } else if (object.kind === \"connector\") {\n      const from = endpoint(object.from),to = endpoint(object.to);\n      if (!from || !to) continue;\n      const path=anchoredFlowPath(from,to,object.routing,object.waypoints,object.from,object.to,lookup);\n      const width=object.strokeWidth??DEFAULT_CONNECTOR_STROKE;\n      line(path,object.stroke,width,object.arrow,false,true,width>DEFAULT_CONNECTOR_STROKE?width/2:0);\n      const anchor=object.label&&flowLabelAnchor(path);\n      if(anchor)label(anchor.point,object.label,10,grey,anchor.align,560,undefined,true);\n    } else if (object.kind === \"mindmap\") {\n      const local=layoutMap(object),cached=topicGeometry.get(local);\n      if(cached?.id===id&&cached.theme===object.theme&&cached.skin===object.skin&&cached.colors===object.branchColors){groups.push(placeTopics(cached.group,object.origin));continue;}\n      const index = layoutIndex(local),branches=mindPalette(object.theme).branches,baseWidth=branchWidth(object);\n      for (const node of local) {\n        const inside = node.parent ? index.get(node.parent) : undefined;\n        if (!inside) continue;\n        const left = node.side === \"left\";\n        const a=topicPort(inside,left),b=topicPort(node,!left);\n        const center = (a.x+b.x)/2;\n        const junction=node.depth\u003c3?undefined:{start:inside.depth>=3?inside.topic.appearance?.strokeWidth??baseWidth:undefined,\n          end:node.topic.appearance?.strokeWidth??baseWidth};\n        const width=(junction?.start??baseWidth)||junction?.end||baseWidth;\n        const slot=object.branchColors?.[node.branch]??node.branch;\n        line([a,point(center,a.y),point(center,b.y),b],branches[slot%branches.length],width,undefined,true,false,\n          junction?Math.max(width,junction.end)/2:0,junction);\n      }\n      for (const node of local) {\n        const at=node.box.at;\n        const isRoot=node.depth===0;\n        const left=node.side===\"left\";\n        const paint=topicPaint(object,node.topic,node);\n        const radius=object.skin===\"square\"?2:object.skin===\"capsule\"?node.box.height/2:(isRoot?12:8)*(object.scale??1);\n        const underline=paint.underline?(node.topic.collapsed||!node.topic.childIds.length?node.side:\"joined\"):undefined;\n        box(node.box,\"rect\",radius,paint.fill,paint.stroke,paint.strokeWidth,underline);\n        const textBox=topicLabelBox(node.box,object.scale,node.depth);\n        items.push({kind:\"nodeLabel\",box:textBox,topicId:node.topic.id,text:node.topic.text||\"未命名\",rows:node.lines,fontSize:node.fontSize,\n          weight:topicTier(node.depth).weight,color:paint.textColor,maxLines:node.lines.length,...(paint.surfaceInk?{surfaceInk:true}:{})});\n        if(node.topic.collapsed&&node.topic.childIds.length){\n          const x=at.x+(left?5:node.box.width-5),y=at.y+7;\n          items.push({kind:\"text\",at:point(x,y),text:\"+\",size:10,color:paint.textColor,align:\"center\",weight:700,...(paint.surfaceInk?{surfaceInk:true}:{})});\n        }\n      }\n      if(bounds){\n        const group={id,items,picks,bounds,topicCount:picks.length,topicIds:local.map(row=>row.topic.id)};\n        topicGeometry.set(local,{id,theme:object.theme,skin:object.skin,colors:object.branchColors,group});groups.push(placeTopics(group,object.origin));\n      }\n      continue;\n    } else if (object.kind === \"table\") {\n      items.push(...tablePrimitives(object));\n      picks.push({box:object,shape:\"rect\"});bounds=boxBounds(object);\n    } else if (object.kind === \"text\") {\n      const fixed=object.heightMode===\"fixed\";\n      const lines=wrapPlainText(object.text,object.width,object.fontSize,object);\n      const range=textFrame(object,lines);\n      let width=object.width;\n      if(!fixed&&width\u003cobject.fontSize)for(const row of lines)width=Math.max(width,plainTextWidth(row,object.fontSize,object));\n      const offset=object.align===\"left\"?0:object.align===\"right\"?object.width-width:(object.width-width)/2;\n      const visible=textBoxWithSize(range,width,range.height,offset);\n      picks.push({box:visible,shape:\"rect\"});bounds=mergeBounds(bounds,boxBounds(visible));\n      const {align:textAlign,fontSize,color,background,fontFamily,fontWeight,italic}=object;\n      const colorMode=automaticTextColor(object)?\"auto\":object.colorMode;\n      items.push({kind:\"textBlock\",box:range,lines,textAlign,fontSize,color,colorMode,background,fontFamily,fontWeight,italic,...(fixed?{clip:true}:{})});\n    } else if(object.kind===\"path\"){\n      const segments=pathSegments(object),pad=object.strokeWidth/2;\n      const points=[segments[0].from,...segments.slice(0,object.vertices.length-1).map(s=>s.to)];\n      items.push({kind:\"path\",points,segments,closed:object.closed,fill:object.fill,color:object.stroke,width:object.strokeWidth});\n      picks.push({segments,hitPad:pad,filled:Boolean(object.closed&&object.fill)});\n      const b=vectorBounds(segments);bounds={min:point(b.min.x-pad,b.min.y-pad),max:point(b.max.x+pad,b.max.y+pad)};\n    } else if(object.kind===\"ink\"){\n      const points=inkPoints(object);\n      items.push({kind:\"ink\",points,color:object.color,...(object.brushVersion===HIGHLIGHTER_BRUSH_VERSION?{highlighter:true         }:{})});\n      picks.push({ink:points});bounds=inkBounds(points);\n    } else {\n      const range = object;\n      items.push({kind:\"image\",box:range,assetId:object.assetId});\n      picks.push({box:range,shape:\"rect\"});\n      bounds=mergeBounds(bounds,boxBounds(range));\n    }\n    if (bounds) groups.push({ id,items,picks,bounds });\n  }\n  return groups;\n}\nfunction nearSegment(p      ,a      ,b      )        {\n  const x=b.x-a.x,y=b.y-a.y;\n  const denom=x*x+y*y;\n  const q=denom?Math.max(0,Math.min(1,((p.x-a.x)*x+(p.y-a.y)*y)/denom)):0;\n  return Math.hypot(p.x-a.x-q*x,p.y-a.y-q*y);\n}\nfunction hitShape(p      ,range    ,shape          )         {\n  const q=worldToLocal(p,range), x=q.x/range.width,y=q.y/range.height;\n  if (shape === \"diamond\") return Math.abs(x-.5)+Math.abs(y-.5)\u003c=.5;\n  if (shape === \"triangle\") return y>=0 && y\u003c=1 && Math.abs(x-.5)\u003c=y*.5;\n  return x>=0 && x\u003c=1 && y>=0 && y\u003c=1;\n}\nexport function hitTest(scene      , world      ,tolerance       )              {\n  for (let i=scene.length-1;i>=0;i--) {\n    const group=scene[i],pose=topicPlacement(group),point=pose?localPoint(world,pose.origin):world;\n    for (const target of (pose?.local??group).picks) {\n      if (\"box\" in target ? hitShape(point,target.box,target.shape) : \"ink\" in target ? hitInk(target.ink,point,tolerance) :\n        \"segments\" in target ? closestSegment(target.segments,point,tolerance+target.hitPad)!==undefined||target.filled&&insideVector(target.segments,point) : target.points.some((b,index) => index > 0 && nearSegment(point,target.points[index-1],b)\u003c=tolerance+(target.hitPad??0))) return group.id;\n    }\n  }\n}\nexport function groupBounds(scene      , ids                 )                  {\n  return scene.reduce                  ((bounds,group)=>!ids||ids.has(group.id)?mergeBounds(bounds,group.bounds):bounds,undefined);\n}\nconst contains=(r       ,p      )        =>p.x>=r.min.x&&p.x\u003c=r.max.x&&p.y>=r.min.y&&p.y\u003c=r.max.y;\nconst overlaps=(a       ,b       )        =>a.min.x\u003c=b.max.x&&b.min.x\u003c=a.max.x&&a.min.y\u003c=b.max.y&&b.min.y\u003c=a.max.y;\nfunction segmentIntersectsRect(a      ,b      ,r       )         {\n  // Intersect two axis slabs, clipping the segment's parametric interval.\n  let start=0,end=1;\n  for (const axis of [\"x\",\"y\"]         ) {\n    const delta=b[axis]-a[axis];\n    if(delta===0){if(a[axis]\u003cr.min[axis]||a[axis]>r.max[axis])return false;continue;}\n    const one=(r.min[axis]-a[axis])/delta,two=(r.max[axis]-a[axis])/delta;\n    start=Math.max(start,Math.min(one,two));end=Math.min(end,Math.max(one,two));\n    if(start>end)return false;\n  }\n  return true;\n}\nfunction corners(r       )        {return [r.min,point(r.max.x,r.min.y),r.max,point(r.min.x,r.max.y)];}\nexport function marqueeHit(scene      , world       ,topics                 )     {\n  return scene.filter(group=>{\n    if(!overlaps(group.bounds,world))return false;\n    const pose=topicPlacement(group),rectangle=pose?localRect(world,pose.origin):world;\n    const source=pose?.local??group;\n    if(topics&&source.topicIds){\n      const ids=new Set    ();\n      source.picks.forEach((target,i)=>{\n        if(\"box\" in target&&overlaps(boxBounds(target.box),rectangle))ids.add(source.topicIds [i]);\n      });\n      if(ids.size)topics.set(group.id,ids);\n      return ids.size>0;\n    }\n    return source.picks.some(target=>{\n      if(\"ink\" in target){\n        if(corners(rectangle).some(corner=>hitInk(target.ink,corner)))return true;\n        return target.ink.some((p,i)=>{\n          const x=Math.max(rectangle.min.x,Math.min(rectangle.max.x,p.x));\n          const y=Math.max(rectangle.min.y,Math.min(rectangle.max.y,p.y));\n          if(Math.hypot(x-p.x,y-p.y)\u003c=p.radius)return true;\n          const next=target.ink[i+1],quad=next&&inkSegmentHull(p,next);\n          return quad&&quad.some((a,j)=>segmentIntersectsRect(a,quad[(j+1)%4],rectangle));\n        });\n      }\n      if(\"segments\" in target){\n        return target.segments.some(s=>segmentDistance(s,rectangle,target.hitPad)\u003c=target.hitPad)||\n          target.filled&&corners(rectangle).some(p=>insideVector(target.segments,p));\n      }\n      if(\"p                                                      \n                                                       \nimport { roundWorld } from \"../core/geometry.js\";\nimport { alignmentBounds,buildScene,mergeBounds } from \"../scene/board.js\";\n                                                          \nimport { moveObjects, movePatches } from \"../session/transform.js\";\n\n                                                      \n                                                                  \n                                                     \n                                                                       \n\nconst label                              ={\n  front:\"置于顶层\",back:\"置于底层\",forward:\"上移一层\",backward:\"下移一层\",\n  left:\"左对齐\",center:\"水平居中\",right:\"右对齐\",top:\"上对齐\",middle:\"垂直居中\",bottom:\"下对齐\",\n  \"distribute-x\":\"水平等距\",\"distribute-y\":\"垂直等距\",\n};\nexport const arrangeCommands=Object.keys(label)                    ;\nexport const isArrangeCommand=(value        )                        =>typeof value===\"string\"&&Object.hasOwn(label,value);\nconst layer=(command               )                        =>\n  command===\"front\"||command===\"back\"||command===\"forward\"||command===\"backward\";\nconst distribute=(command               )                             =>\n  command===\"distribute-x\"||command===\"distribute-y\";\n\nexport function arrangeLayerOrder(order              ,selected              ,command             )              {\n  const ids=new Set(selected);\n  if(command===\"front\"||command===\"back\"){\n    const moved=order.filter(id=>ids.has(id)),rest=order.filter(id=>!ids.has(id));\n    return command===\"front\"?[...rest,...moved]:[...moved,...rest];\n  }\n  const next=[...order];\n  // Same-direction selected neighbors rise/fall together without swapping\n  // with one another; sweep opposite the direction of motion.\n  if(command===\"forward\"){\n    for(let i=next.length-2;i>=0;i--)if(ids.has(next[i])&&!ids.has(next[i+1]))\n      [next[i],next[i+1]]=[next[i+1],next[i]];\n  }else{\n    for(let i=1;i\u003cnext.length;i++)if(ids.has(next[i])&&!ids.has(next[i-1]))\n      [next[i-1],next[i]]=[next[i],next[i-1]];\n  }\n  return next;\n}\nfunction selectedMovers(doc              ,selected              )              {\n  return [...new Set(selected)].flatMap(id=>{\n    const item=objectById(doc,id);\n    return item&&(item.kind!==\"connector\"||(item.from.kind===\"free\"&&item.to.kind===\"free\"))?[item]:[];\n  });\n}\n                                                        \nfunction measures(doc              ,items                       )          {\n  const indexed=new Map(items.map(item=>[item.id,item]));\n  const ranks=new Map(doc.order.map((id,index)=>[id,index]));\n  return buildScene(doc,undefined,items.map(item=>item.id)).flatMap(group=>{\n    const item=indexed.get(group.id);\n    if(!item)return [];\n    return [{item,bounds:alignmentBounds(item,group.bounds),rank:ranks.get(item.id)??0}];\n  });\n}\n                  \n                                 \nconst epsilon=1e-9;\nconst at=(axis     ,n       )      =>axis===\"x\"?{x:roundWorld(n),y:0}:{x:0,y:roundWorld(n)};\nfunction alignDelta(items                   ,command             )      {\n  const axis=command===\"left\"||command===\"center\"||command===\"right\"?\"x\":\"y\";\n  const edge=command===\"left\"||command===\"top\"?\"min\":command===\"right\"||command===\"bottom\"?\"max\":\"middle\";\n  const min=items.reduce((best,i)=>Math.min(best,i.bounds.min[axis]),Infinity);\n  const max=items.reduce((best,i)=>Math.max(best,i.bounds.max[axis]),-Infinity);\n  const target=edge===\"min\"?min:edge===\"max\"?max:(min+max)/2;\n  return new Map(items.map(({item,bounds})=>[\n    item.id,at(axis,target-(edge===\"middle\"?(bounds.min[axis]+bounds.max[axis])/2:bounds[edge][axis])),\n  ]));\n}\nfunction distributeDelta(items                   ,axis     )      {\n  const sorted=[...items].sort((a,b)=>a.bounds.min[axis]-b.bounds.min[axis]||a.rank-b.rank);\n  const first=sorted[0].bounds,last=sorted.at(-1) .bounds;\n  const lengths=sorted.map(({bounds})=>bounds.max[axis]-bounds.min[axis]);\n  const gap=(last.max[axis]-first.min[axis]-lengths.reduce((a,b)=>a+b,0))/(sorted.length-1);\n  // A signed gap can preserve a modest overlap. If equal gaps would\n  // actually reverse the spatial order, leave the arrangement untouched.\n  if(lengths.slice(0,-1).some(length=>length+gap\u003c -epsilon))return new Map();\n  let cursor=first.max[axis]+gap;\n  const deltas=new Map          ();\n  for(let i=1;i\u003csorted.length-1;i++){\n    const {item,bounds}=sorted[i];\n    deltas.set(item.id,at(axis,cursor-bounds.min[axis]));\n    cursor+=lengths[i]+gap;\n  }\n  return deltas;\n}\nconst unchanged={x:0,y:0};\nconst moving=(delta      )=>Math.abs(delta.x)>epsilon||Math.abs(delta.y)>epsilon;\nfunction movedObjects(doc              ,items                   ,deltas      ,hidden                )                            {\n  const moved=new Map                ();\n  for(const {item} of items){\n    const delta=deltas.get(item.id);\n    if(!delta||!moving(delta))continue;\n    for(const [id,result] of moveObjects(item.kind===\"connector\"?{movers:[],connectors:[item]}:{movers:[item],connectors:[]},delta))moved.set(id,result);\n  }\n  // Bound connector positions are always projected from their anchors.\n  // Explicit bends translate only when both anchors moved together.\n  for(const id of doc.order){\n    const line=doc.objects[id];\n    if(hidden.has(id)||line.kind!==\"connector\"||!line.waypoints.length||line.from.kind!==\"anchor\"||line.to.kind!==\"anchor\")continue;\n    const from=deltas.get(line.from.objectId)??unchanged,to=deltas.get(line.to.objectId)??unchanged;\n    if(moving(from)&&Math.abs(from.x-to.x)\u003c=epsilon&&Math.abs(from.y-to.y)\u003c=epsilon)\n      for(const [id,result] of moveObjects({movers:[],connectors:[line]},from))moved.set(id,result);\n  }\n  return moved;\n}\n                                                                                                                                 \n                                                                 \n                                                  \n                                                                                      \nfunction arrangeUnit(editor                 ,id   )   {\n  const group=flowGroupOf(editor.doc,id);return group&&group!==editor.editingGroup?group:id;\n}\nfunction candidates(editor                 ,command               )                                                                                                 {\n  if(editor.busy||!editor.selectedIds.length||editor.selectionLocked)\n    return {kind:\"refused\",message:\"The selection is empty, locked or busy\"};\n  if(layer(command)){\n    const order=arrangeLayerOrder(editor.doc.order,editor.selectedIds,command);\n    if(order.every((id,index)=>id===editor.doc.order[index]))return {kind:\"unchanged\"};\n    return editor.permitsOrder(order)?{kind:\"order\",order}:{kind:\"refused\",message:\"Cannot cross a locked or hidden layer\"};\n  }\n  const movers=selectedMovers(editor.doc,editor.selectedIds);\n  const count=editor.doc.flowGroups?new Set(movers.map(item=>arrangeUnit(editor,item.id))).size:movers.length;\n  if(count\u003c(distribute(command)?3:2))return {kind:\"refused\",message:\"Alignment needs two movable units; distribution needs three\"};\n  return {kind:\"geometry\",command,movers};\n}\nexport function canArrange(editor              ,command               )        {\n  const {kind}=candidates(editor,command);\n  return kind===\"order\"||kind===\"geometry\";\n}\nexport function planArrange(editor                 ,action               )            {\n  const chosen=candidates(editor,action);\n  if(chosen.kind!==\"geometry\")return chosen;\n  const {command,movers}=chosen,doc=editor.doc;\n  const items=measures(doc,movers),units=new Map            ();\n  for(const entry of items){\n    const id=arrangeUnit(editor,entry.item.id),previous=units.get(id);\n    units.set(id,previous?{...previous,bounds:mergeBounds(previous.bounds,entry.bounds)}:entry);\n  }\n  const boxes=[...units.values()];\n  if(boxes.length\u003c(distribute(command)?3:2))return {kind:\"refused\",message:\"Too few measurable units\"};\n  const offsets=distribute(command)?distributeDelta(boxes,command===\"distribute-x\"?\"x\":\"y\"):alignDelta(boxes,command);\n  const deltas=new Map          ();\n  for(const {item} of items){\n    const representative=units.get(arrangeUnit(editor,item.id)) .item.id,delta=offsets.get(representative);\n    if(delta)deltas.set(item.id,delta);\n  }\n  const objects=movedObjects(doc,items,deltas,editor.hiddenIds);\n  return objects.size?{kind:\"move\",objects}:{kind:\"unchanged\"};\n}\nexport function arrangeSelection(editor              ,command               )        {\n  const plan=planArrange(editor,command);\n  if(plan.kind===\"order\")return editor.commitEdit({label:label[command],patches:[{op:\"setOrder\",ids:plan.order}]},editor.generation);\n  return plan.kind===\"move\"&&editor.commitEdit({label:label[command],patches:movePatches(plan.objects)},editor.generation);\n}\n","deps":{"../core/flow-groups.js":"core/flow-groups.js","../core/document.js":"core/document.js","../core/geometry.js":"core/geometry.js","../scene/board.js":"scene/board.js","../session/transform.js":"session/transform.js"}},{"path":"scene/spatial-grid.js","code":"                                            \n                                              \n\nconst CELL=512, TILE_SIDE=16, TILE_SIZE=CELL*TILE_SIDE;\nconst MAX_FOOTPRINT=64, MAX_QUERY_TILES=1600, MAX_FINE_PROBES=16384;\nconst key=(x       ,y       )=>x+\":\"+y;\n\nexport function cellRange(box     ,size=CELL){\n  const x1=Math.floor(box.min.x/size), y1=Math.floor(box.min.y/size);\n  const x2=Math.floor(box.max.x/size), y2=Math.floor(box.max.y/size);\n  const safe=[x1,y1,x2,y2].every(Number.isSafeInteger)&&x1\u003c=x2&&y1\u003c=y2;\n  return {x1,y1,x2,y2,safe,count:(x2-x1+1)*(y2-y1+1)};\n}\n\n                                                   \n                                    \n                                                                                                   \n   \n\n/** Ordinary groups use existing 512-unit buckets. The tile directory holds one\n * reference per occupied bucket; longer groups use tiles directly, up to 64. */\nexport class SceneGrid{\n          fine=new Map                ();\n          tiles=new Map             ();\n          oversized=new Set    ();\n\n  clear(){this.fine.clear();this.tiles.clear();this.oversized.clear();}\n  fineMembers(x       ,y       )                          {return this.fine.get(key(x,y));}\n  add(id   ,box     ){return this.change(id,box,true);}\n  remove(id   ,box     ){this.change(id,box,false);}\n\n          tile(x       ,y       ){\n    const address=key(x,y);\n    let tile=this.tiles.get(address);\n    if(!tile){tile={fine:new Map(),large:new Set()};this.tiles.set(address,tile);}\n    return tile;\n  }\n          prune(x       ,y       ,tile     ){\n    if(!tile.fine.size&&!tile.large.size)this.tiles.delete(key(x,y));\n  }\n          changeFine(id   ,x       ,y       ,add        ){\n    const address=key(x,y),ids=this.fine.get(address);\n    if(ids&&add){ids.add(id);return;}\n    if(!add&&(!ids||!ids.delete(id)||ids.size))return;\n    const tx=Math.floor(x/TILE_SIDE),ty=Math.floor(y/TILE_SIDE);\n    const slot=(y-ty*TILE_SIDE)*TILE_SIDE+(x-tx*TILE_SIDE);\n    if(add){\n      const members=new Set([id]);\n      this.fine.set(address,members);this.tile(tx,ty).fine.set(slot,members);\n    }else{\n      this.fine.delete(address);\n      const tile=this.tiles.get(key(tx,ty)) ;\n      tile.fine.delete(slot);this.prune(tx,ty,tile);\n    }\n  }\n          change(id   ,box     ,add        ){\n    const fine=cellRange(box);\n    if(fine.safe&&fine.count\u003c=MAX_FOOTPRINT){\n      for(let y=fine.y1;y\u003c=fine.y2;y++)for(let x=fine.x1;x\u003c=fine.x2;x++)this.changeFine(id,x,y,add);\n      return true;\n    }\n    const broad=cellRange(box,TILE_SIZE);\n    if(broad.safe&&broad.count\u003c=MAX_FOOTPRINT){\n      for(let y=broad.y1;y\u003c=broad.y2;y++)for(let x=broad.x1;x\u003c=broad.x2;x++){\n        if(add)this.tile(x,y).large.add(id);\n        else{\n          const tile=this.tiles.get(key(x,y));\n          if(tile){tile.large.delete(id);this.prune(x,y,tile);}\n        }\n      }\n    }else if(add)this.oversized.add(id);\n    else this.oversized.delete(id);\n    return false;\n  }\n\n  /** False requests an exact paint-order scan. A budget never truncates visible results. */\n  collect(rect     ,groupCount       ,out        ,audit                            )        {\n    let tiles=0,fineProbes=0,memberships=0;\n    const finish=(mode                      )=>{\n      audit?.({mode,tiles,fineProbes,memberships});\n      return mode===\"indexed\";\n    };\n    const fine=cellRange(rect),broad=cellRange(rect,TILE_SIZE);\n    if(!fine.safe||!broad.safe||broad.count>MAX_QUERY_TILES)return finish(\"extent\");\n    const membershipBudget=Math.max(2048,Math.min(32768,Math.ceil(groupCount*.65)));\n    const take=(ids                )=>{\n      if(memberships+ids.size>membershipBudget)return false;\n      memberships+=ids.size;\n      for(const id of ids)out.add(id);\n      return true;\n    };\n    if(!take(this.oversized))return finish(\"density\");\n    for(let ty=broad.y1;ty\u003c=broad.y2;ty++)for(let tx=broad.x1;tx\u003c=broad.x2;tx++){\n      const tile=this.tiles.get(key(tx,ty));tiles++;\n      if(!tile)continue;\n      if(!take(tile.large))return finish(\"density\");\n      const ox=tx*TILE_SIDE,oy=ty*TILE_SIDE;\n      const x1=Math.max(0,fine.x1-ox),x2=Math.min(TILE_SIDE-1,fine.x2-ox);\n      const y1=Math.max(0,fine.y1-oy),y2=Math.min(TILE_SIDE-1,fine.y2-oy);\n      const slots=(x2-x1+1)*(y2-y1+1);\n      if(fineProbes+Math.min(slots,tile.fine.size)>MAX_FINE_PROBES)return finish(\"fine-limit\");\n      // For a small hit rectangle probe its slots. For a wide sparse view visit only occupied buckets.\n      if(slots\u003ctile.fine.size){\n        for(let y=y1;y\u003c=y2;y++)for(let x=x1;x\u003c=x2;x++){\n          const ids=tile.fine.get(y*TILE_SIDE+x);fineProbes++;\n          if(ids&&!take(ids))return finish(\"density\");\n        }\n      }else{\n        for(const [slot,ids] of tile.fine){\n          const x=slot%TILE_SIDE,y=Math.floor(slot/TILE_SIDE);fineProbes++;\n          if(x>=x1&&x\u003c=x2&&y>=y1&&y\u003c=y2&&!take(ids))return finish(\"density\");\n        }\n      }\n    }\n    return finish(\"indexed\");\n  }\n}\n","deps":{}},{"path":"scene/projector.js","code":"                                                                                  \n                                                \n                                                    \nimport { alignmentBounds,buildScene,mergeBounds } from \"./board.js\";\nimport {DragAlignment} from \"../session/drag-alignment.js\";\nimport {planMove} from \"../session/transform.js\";\n                                                          \n                                                  \nimport {cellRange,SceneGrid} from \"./spatial-grid.js\";\n                                                     \n\n                                                                                               \n                                                                                                                                          \n                                                                                           \n// Optional drag assistance gives way to free movement above either budget.\nconst SNAP_CELLS=256,SNAP_ENTRIES=512;\nconst finite=(b     )=>[b.min.x,b.min.y,b.max.x,b.max.y].every(Number.isFinite);\nconst overlaps=(a     ,b     )=>a.min.x\u003c=b.max.x&&b.min.x\u003c=a.max.x&&a.min.y\u003c=b.max.y&&b.min.y\u003c=a.max.y;\nfunction endpoints(connector          )        {\n  const result=new Set    ();\n  if(connector.from.kind===\"anchor\")result.add(connector.from.objectId);\n  if(connector.to.kind===\"anchor\")result.add(connector.to.objectId);\n  return result;\n}\n\nexport class SceneProjection {\n          identity=new Map              ();\n          doc              ;\n          ordered                ;\n          adjacency=new Map            ();\n          hidden                =new Set();\n          grid=new SceneGrid();\n          alignmentSpanning=new Set    ();\n          rank=new Map           ();\n  constructor(doc              ){this.doc=doc;this.reset(doc);}\n          reset(doc              )                 {\n    this.doc=doc;this.identity.clear();this.adjacency.clear();this.grid.clear();this.alignmentSpanning.clear();\n    this.resetRank();\n    const next=buildScene(doc);\n    for(const group of next)this.registerGroup(group);\n    this.ordered=this.hidden.size?undefined:next;\n    for(const item of Object.values(doc.objects))if(item.kind===\"connector\")this.registerEdge(item);\n    return {mode:\"full\",projected:next.length};\n  }\n          resetRank()     {this.rank.clear();this.doc.order.forEach((id,index)=>this.rank.set(id,index));}\n          registerGroup(group          )     {\n    this.identity.set(group.id,group);\n    if(!this.hidden.has(group.id))this.indexGroup(group);\n  }\n          indexGroup(group          )     {\n    const fine=this.grid.add(group.id,group.bounds);\n    if(!fine&&this.doc.objects[group.id]?.kind!==\"connector\")this.alignmentSpanning.add(group.id);\n  }\n          unregisterGroup(id   )     {\n    const group=this.identity.get(id);\n    if(group&&!this.hidden.has(id))this.unindexGroup(group);\n    this.identity.delete(id);\n  }\n          unindexGroup(group          )     {\n    this.grid.remove(group.id,group.bounds);this.alignmentSpanning.delete(group.id);\n  }\n  /** Keep canonical geometry and adjacency available for restore and undo.\n   * Only paintable groups occupy viewport and snap candidate budgets. */\n  setHidden(ids                )     {\n    if(ids===this.hidden)return;\n    const previous=this.hidden;this.hidden=ids;this.ordered=undefined;\n    for(const id of ids)if(!previous.has(id)){const group=this.identity.get(id);if(group)this.unindexGroup(group);}\n    for(const id of previous)if(!ids.has(id)){const group=this.identity.get(id);if(group)this.indexGroup(group);}\n  }\n          registerEdge(connector          )     {\n    for(const id of endpoints(connector)){\n      let nodes=this.adjacency.get(id);if(!nodes){nodes=new Set();this.adjacency.set(id,nodes);}\n      nodes.add(connector.id);\n    }\n  }\n          unregisterEdge(connector          )     {\n    for(const id of endpoints(connector)){\n      const nodes=this.adjacency.get(id);\n      if(nodes){nodes.delete(connector.id);if(!nodes.size)this.adjacency.delete(id);}\n    }\n  }\n          z(id   )       {return this.rank.get(id)??this.doc.order.length;}\n\n  /** Accept exactly the authoritative ChangeSet for this preceding document. A\n   * new board/missing delta/global style/broad edit deliberately falls back. */\n  update(doc              ,change           )                 {\n    if(doc===this.doc)return {mode:\"none\",projected:0};\n    if(!change||doc.id!==this.doc.id||doc.schemaVersion!==this.doc.schemaVersion||change.themeChanged)return this.reset(doc);\n    const direct=new Set([...change.added,...change.updated,...change.removed]);\n    const dirty=new Set([...direct,...change.invalidatedMaps,...change.invalidatedConnectors]);\n    if(dirty.size>Math.max(512,doc.order.length*.22))return this.reset(doc);\n    for(const id of direct){\n      const before=this.doc.objects[id],after=doc.objects[id];\n      if(before?.kind===\"connector\")this.unregisterEdge(before);\n      if(after?.kind===\"connector\")this.registerEdge(after);\n    }\n    this.doc=doc;\n    if(change.orderChanged)this.resetRank();\n    if(dirty.size||change.orderChanged)this.ordered=undefined;\n    for(const id of dirty)this.unregisterGroup(id);\n    const updated=buildScene(doc,undefined,[...dirty]);\n    for(const group of updated)this.registerGroup(group);\n    return {mode:\"incremental\",projected:updated.length};\n  }\n\n  overlay(override               )                          {\n    if(!override?.objects.size)return EMPTY;\n    const dirty=new Set(override.objects.keys());\n    for(const [id,value] of override.objects)if(value.kind===\"shape\")for(const link of this.adjacency.get(id)??[])dirty.add(link);\n    return new Map(buildScene(this.doc,override,[...dirty].filter(id=>!this.hidden.has(id))).map(item=>[item.id,item]));\n  }\n  all(patch                          =EMPTY)      {\n    const scene=this.ordered??=this.doc.order.flatMap(id=>{const group=this.identity.get(id);return group&&!this.hidden.has(id)?[group]:[];});\n    if(!patch.size)return scene;\n    return [...scene.map(group=>patch.get(group.id)??group),...[...patch.values()].filter(group=>!this.hidden.has(group.id)&&!this.identity.has(group.id))];\n  }\n  /** Search the immediate neighborhood first. A long spacing strip only contributes\n   * targets if we can see all of its intervening objects within the same budget. */\n          alignmentTargets(near     ,strips                ,excluded                ,audit                                 ){\n    const targets                      =[];\n    let lookups=0,memberships=0,spanning=0,objects=0;\n    const finish=(limited=false)=>{\n      audit?.({cells:lookups,memberships,spanning,objects,returned:targets.length,limited});\n      return targets;\n    };\n    const ids=new Set    (),searched       =[],visited=new Set        ();\n    const fineBudget=SNAP_ENTRIES-this.alignmentSpanning.size;\n    const collect=(rect     )=>{\n      const range=cellRange(rect);\n      if(!range.safe||range.count>SNAP_CELLS)return false;\n      for(let y=range.y1;y\u003c=range.y2;y++)for(let x=range.x1;x\u003c=range.x2;x++){\n doc;\n  }\n  const put = (value             ) => {\n    const old = objects.get(value.id);\n    if (old?.kind === \"image\" && (value.kind !== \"image\" || old.assetId !== value.assetId)) released.add(old.assetId);\n    objects.set(value.id, value); patches.push({op:\"putObject\", value});\n  };\n  for (const [index,raw] of input.entries()) {\n    const op = record(raw), name = string(op.op, \"op\")                                ;\n    if (!Object.hasOwn(operationFields, name)) reject(\"INVALID\", \"Unknown operation: \" + name);\n    keys(op, [\"op\", ...operationFields[name]]);\n    if (Object.hasOwn(structureFields,name)) {\n      const opName=name                      ;\n      const result=planStructure(editor,stagedDocument(),opName,op,put);\n      results.push({index,op:opName,...result});\n      continue;\n    }\n    if (name === \"arrange\") {\n      const {plan,result}=planIdArrangement(editor,stagedDocument(),op);\n      if(plan.kind===\"order\")patches.push({op:\"setOrder\",ids:plan.order});\n      if(plan.kind===\"move\")for(const item of plan.objects.values())put(item);\n      results.push({index,op:name,...result});\n      continue;\n    }\n    if (name === \"layoutFlow\") {\n      for (const node of planSelectedFlow(editor,stagedDocument(),op)) put(node);\n      continue;\n    }\n    if (name === \"moveTopic\") {\n      const map = objectById(stagedDocument(),string(op.id,\"map ID\"));\n      const topicId = string(op.topicId,\"topicId\"), target = string(op.targetId,\"targetId\");\n      if (map?.kind !== \"mindmap\" || !Object.hasOwn(map.topics,topicId) || !Object.hasOwn(map.topics,target))\n        reject(\"NOT_FOUND\",\"Both topic IDs must exist in the specified mind map\");\n      const {place,side} = op;\n      if (place !== \"child\" && place !== \"before\" && place !== \"after\") reject(\"INVALID\",\"Expected place child, before or after\");\n      if (side !== undefined && side !== \"left\" && side !== \"right\") reject(\"INVALID\",\"Expecte                                                      \n                                                                                                                                 \nconst draftReasons=new Set             ([\"INK_STROKE\",\"FLOW_EDIT\",\"PATH_DRAFT\",\"TEXT_EDITOR\",\"MIND_TOPIC_DRAFT\",\"PROPERTY_PREVIEW\",\"INSPECTOR_DRAFT\"]);\n                \n                                                                                                \n                                                            \n                                                                         \n  \n                                                                                                \nfunction sorted(value        )         {\n  if (Array.isArray(value)) return value.map(sorted);\n  if (isRecord(value)) return Object.fromEntries(Object.keys(value).sort().map(key=>[key,sorted(value[key])]));\n  return value;\n}\nasync function fingerprint(value        ) {\n  const bytes = new TextEncoder().encode(JSON.stringify(sorted(value)));\n  const digest = await crypto.subtle.digest(\"SHA-256\", bytes);\n  return Array.from(new Uint8Array(digest), b=>b.toString(16).padStart(2,\"0\")).join(\"\");\n}\nexport function createLiveCommands({editor,vault,epoch,busy,focusedTopic,save}        ) {\n  const opened = editor.generation, receipts = new Map                ();\n  let saving = false;\n  const revision = () => epoch + \".\" + editor.history.revision;\n  const stateRevision=()=>revision()+\".\"+editor.lockRevision+\".\"+editor.visibilityRevision;\n  function blockers(skipSaving=false)              {\n    const external=busy();\n    const reasons=new Set             (typeof external===\"boolean\"?(external?[\"EDITOR_BUSY\"]:[]):external);\n    if(editor.busy)reasons.add(\"POINTER_GESTURE\");\n    if(saving&&!skipSaving)reasons.add(\"SAVING\");\n    return [...reasons];\n  }\n  function status(skipSaving=false) {\n    return {source:\"session\",revision:revision(),dirt is.ids[0]],key);\n      if(!first)continue;\n      let common=true,mixed=false,min=first.min,max=first.max;\n      for(const id of this.ids.slice(1)){\n        const next=member(doc.objects[id],key);\n        if(!next){common=false;break;}\n        if(comparable(first.value)!==comparable(next.value))mixed=true;\n        if(next.min!==undefined)min=Math.max(min??-Infinity,next.min);\n        if(next.max!==undefined)max=Math.min(max??Infinity,next.max);\n      }\n      if(common)this.fields.push({key,label:captions[key],numeric:typeof first.value===\"number\",value:mixed?undefined:first.value,min,max});\n    }\n  }\n  get current()        {\n    return this.visibility===this.editor.visibilityRevision&&this.locks===this.editor.lockRevision&&!this.editor.selectionLocked&&this.history===this.editor.history&&this.generation===this.editor.generation&&this.ids===this.editor.selectedIds;\n  }\n  get canTranslate()        {\n    return Boolean(this.movePlan&&(this.movePlan.movers.length||this.movePlan.connectors.length));\n  }\n  preview(edits      ,offset               ={})                                      {\n    if(!this.current||this.editor.busy)return;\n    return this.plan(edits,offset);\n  }\n  plan(edits      ,offset               ={})                                      {\n    const delta={x:offset.x??0,y:offset.y??0};\n    if(!Number.isFinite(delta.x)||!Number.isFinite(delta.y))return;\n    for(const [key,value] of edits){\n      const field=this.fields.find(field=>field.key===key);\n      if(!field)return;\n      if(field.numeric){\n        if(typeof value!==\"number\"||!Number.isFinite(value)||value\u003c(field.min??-Infinity)||value>(field.max??Infinity))return;\n      }else if(!isHexPaint(value)&&(typeof value!==\"string\"||value!==field.value))return;\n    }\n    const changed=new Map                ();\n    if(delta.x||delta.y){\n      if(!this.canTranslate||!this.movePlan)return;\n      for(const [id,item] of moveObjects(this.movePlan,delta)){\n        if \"独立图片\",ink:\"手写笔迹\",path:\"矢量路径\",table:\"表格\"};\nexport const LAYER_PAGE_SIZE=180;\n\n/** The first line is a text layer's name. Search the full line even when its caption is shortened. */\nexport function layerName(item            )       {\n  if(isCard(item))return cardTitle(item);\n  if(item.kind===\"table\")return \"表格 · \"+item.cells.length+\" 行 × \"+item.cells[0].length+\" 列\";\n  if(item.kind===\"shape\"||item.kind===\"connector\")return item.label||kindNames[item.kind];\n  if(item.kind===\"mindmap\")return item.topics[item.rootId].text||kindNames.mindmap;\n  if(item.kind===\"text\")return item.text.split(\"\\n\",1)[0]||\"空文字\";\n  return kindNames[item.kind];\n}\nexport function layerTitle(item            )       {\n  const name=layerName(item);return item.kind===\"text\"||isCard(item)?(graphemePrefix(name,100)||\"空文字\"):name;\n}\nexport function layerQuery(raw       )       {return raw.trim().normalize(\"NFC\").toLowerCase();}\n\nexport class LayerSearch {\n          names=new WeakMap                    ();\n          previous               ;\n          query=\"\";\n          ids              =[];\n          matches(item            ,query       )        {\n    let name=this.names.get(item);\n    if(name===undefined){name=layerQuery(layerName(item));this.names.set(item,name);}\n    return name.includes(query);\n  }\n  /** Keep document stacking order. Only the visible page is reversed for the sidebar. */\n  list(doc              ,query       ,change           )              {\n    const before=this.previous,sameQuery=query===this.query;\n    if(before===doc&&sameQuery)return this.ids;\n    if(!query)this.ids=doc.order;\n    else if(!sameQuery||!before||before.order!==doc.order||!change||\n      change.updated.some(id=>this.matches(before.objects[id],query)!==this.matches(doc.objects[id],query))){\n      this.ids=doc.order.filter(id=>this.matches(doc.objects[id],query));\n    }\n    this.previous=doc;this.query=query;return this.ids;\n  }\n}\nexport functi  .end;\n    }\n  }\n  list(query       ,expanded                        )                      {\n    if(query)return this.rows.filter(row=>row.name.includes(query));\n    const list             =[];\n    for(let i=0;i\u003cthis.rows.length;){\n      const row=this.rows[i];list.push(row);\n      i=(expanded.get(row.topic.id)??!row.topic.collapsed)?i+1:row.end;\n    }\n    return list;\n  }\n  /** At most three ancestor captions per displayed row, even for very deep maps. */\n  context(row           ,search        )       {\n    const count=this.counts.get(row.name)??1;\n    if(!search&&count\u003c2)return \"\";\n    const path         =[];let parent=row.parent;\n    while(parent&&path.length\u003c3){\n      const next=this.byId.get(parent) ;path.unshift(next.caption);parent=next.parent;\n    }\n    if(parent)path.unshift(\"…\");\n    if(count>1)path.push(\"同名 \"+row.occurrence+\"/\"+count);\n    return path.join(\" › \");\n  }\n}\n","deps":{"../features/text-layout.js":"features/text-layout.js","./layer-search.js":"app/layer-search.js"}},{"path":"app/topic-tree.js","code":"                                                    \n                                                     \nimport {TopicOutline,TOPIC_PAGE_SIZE} from \"./topic-outline.js\";\n                                                   \n\n              \n                                                                                             \n                                                                       \n                                                 \n  \n                                                                                                                \nfunction element                                       (tag  ,cls        ){\n  const e=document.createElement(tag);if(cls)e.className=cls;return e;\n}\nfunction control(id       ,label       ){\n  const b=element(\"button\");b.type=\"button\";b.id=id;b.textContent=label;return b;\n}\nexport class TopicTree{\n          root
