<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>绘图工作台 · 无限画布</title>
<style>
:root{--workspace-font:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif}
/* Shell tokens do not alter the document's fill, stroke, or project theme. */
:root{
  font-family:var(--workspace-font,system-ui,sans-serif);
  color-scheme:light;color:var(--text);background:var(--surface);font-size:13px;line-height:1.5;
  --surface:#fff;--canvas:#f3f5f9;--well:#f8f9fc;--hover:#f3f6fb;--line:#dde3ed;
  --text:#1f293b;--head:#202436;--muted:#637187;--secondary:#4c5c76;
  --blue:#3659d9;--blue-hover:#294ac3;--focus:#5674ee;--soft:#edf2ff;--accent-ink:#294ab8;
  --insignia:#334fac;--warning:#964607;--shape-icon:#5473ac;--shape-tint:#eef4ff;
  --map-icon:#6758bd;--map-tint:#f1edff;--path-icon:#4e647c;--path-tint:#f0f4f8;
  --shadow-xs:#30457512;--shadow-sm:#26375b20;--shadow-lg:#1b2b5627;
}
:root[data-workspace-theme=dark]{
  color-scheme:dark;
  --surface:#24262e;--canvas:#1b1d23;--well:#20222a;--hover:#303442;--line:#3b404e;
  --text:#e9edf5;--head:#f1f3fa;--muted:#a8b1c3;--secondary:#c0cadc;
  --blue:#385cca;--blue-hover:#4262c2;--focus:#93afff;--soft:#303c60;--accent-ink:#c7d7ff;
  --insignia:#3f518a;--warning:#ffc286;--shape-icon:#a9c9ff;--shape-tint:#303d58;
  --map-icon:#d3c6ff;--map-tint:#403659;--path-icon:#c2d2e5;--path-tint:#344255;
  --shadow-xs:#0002;--shadow-sm:#0005;--shadow-lg:#0007;
}

*{box-sizing:border-box}
body{margin:0}
button,input,select,textarea,summary{font:inherit;color:inherit}
button,summary{cursor:pointer}
button:disabled{cursor:default;opacity:.45}
:where(button,summary,input,select,textarea,[tabindex]):focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.icon-library{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}
.ui-icon,.tool svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
#workspace{
  --space:16px;--dock-bottom:max(var(--space),env(safe-area-inset-bottom));--dock-height:54px;
  display:grid;grid-template-areas:"header" "viewport";grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);
  height:100vh;height:100dvh;isolation:isolate
}
.header{
  grid-area:header;position:relative;z-index:6;display:grid;grid-template-columns:minmax(150px,1fr) auto auto;
  align-items:center;gap:20px;min-height:64px;padding:9px 20px;border-bottom:1px solid var(--line);background:var(--surface)
}
.doc,.doc-meta,.document-actions,.workspace-actions,.panel-switch,.workspace-theme{display:flex;align-items:center}
.doc{gap:10px;min-width:0}.doc-info{min-width:0}
.doc strong{display:block;font-size:16px;font-weight:680;line-height:1.4;color:var(--head);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-meta{min-width:0;gap:7px;font-size:11px;color:var(--muted);white-space:nowrap}
#status{overflow:hidden;text-overflow:ellipsis}
.subtitle{padding-inline-start:7px;border-inline-start:1px solid var(--line)}
.sigil{display:grid;place-items:center;width:37px;height:37px;flex:none;border-radius:11px;color:#fff;background:var(--insignia)}.sigil svg{width:28px;height:28px}
.workspace-actions{gap:16px}.document-actions,.panel-switch{gap:4px}
.document-actions{padding-inline-start:16px;border-inline-start:1px solid var(--line)}
.button,.header-button,.panel-toggle,.file-history summary,.menu-button,.icon-button,.flat,.tool{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:8px;background:transparent;
  font-weight:550;line-height:1.35;white-space:nowrap
}
.button,.header-button,.panel-toggle,.file-history summary{min-height:36px;padding:5px 10px}
.button{border:1px solid var(--line);background:var(--surface);font-size:12px}
.button.primary{color:white;background:var(--blue);border-color:var(--blue);font-weight:650}
.button.primary:not(:disabled):hover{background:var(--blue-hover)}
:where(.button,.header-button,.panel-toggle,.file-history summary,.icon-button,.flat,.tool,.menu-button):not(:disabled):hover{background:var(--hover)}
.header-button,.panel-toggle,.file-history summary{color:var(--secondary);font-size:13px}
.panel-toggle[aria-expanded=true],.tool:is(.selected,[aria-pressed=true]),.flat[aria-pressed=true]{background:var(--soft);color:var(--accent-ink)}
.tool[aria-expanded=true]:not([aria-pressed=true]){color:var(--accent-ink);box-shadow:inset 0 0 0 1px var(--line)}
.file-history{position:relative}.file-history summary{list-style:none}.file-history summary::-webkit-details-marker{display:none}
.file-history[open] summary{background:var(--well);color:var(--head)}
.file-history-list,.floating-panel,.tool-strip,.zoom-bar{border:1px solid var(--line);background:var(--surface);box-shadow:0 2px 5px var(--shadow-xs),0 8px 24px var(--shadow-sm)}
.file-history-list{position:absolute;top:calc(100% + 6px);right:0;z-index:7;width:max-content;min-width:154px;max-width:calc(100vw - 16px);max-height:58dvh;overflow:auto;border-radius:12px;padding:6px}
.menu-button{display:flex;width:100%;min-height:34px;padding:6px 9px;justify-content:flex-start}
.workspace-theme{padding:3px;gap:2px;background:var(--well);border:1px solid var(--line);border-radius:10px}
.workspace-theme label{position:relative;min-width:0;cursor:pointer}
.workspace-theme input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.workspace-theme label>span{display:flex;align-items:center;justify-content:center;gap:5px;min-height:29px;padding:3px 8px;border-radius:6px;color:var(--secondary);font-size:12px;white-space:nowrap}
.workspace-theme .ui-icon{width:15px;height:15px}
.workspace-theme label:hover>span{background:var(--hover)}
.workspace-theme input:checked+span{color:var(--accent-ink);background:var(--surface);box-shadow:0 1px 3px var(--shadow-sm);font-weight:650}
.workspace-theme input:focus-visible+span{outline:2px solid var(--focus);outline-offset:-2px}
#viewport{grid-area:viewport;min-width:0;min-height:0;position:relative;overflow:hidden;isolation:isolate;background:var(--canvas)}
#canvas{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;overscroll-behavior:none}
#canvas:focus-visible{outline-offset:-3px}
.table-controls,.table-cell-editor{position:absolute;z-index:1}
.table-controls{pointer-events:none;--table-accent:var(--focus)}
.table-selection{position:absolute;pointer-events:none;border:2px solid var(--table-accent);background:color-mix(in srgb,var(--focus) 12%,transparent)}
.table-controls button{font:inherit;cursor:pointer}
.table-controls .table-control{position:absolute;pointer-events:auto;border:0;border-radius:5px;padding:0;background:color-mix(in srgb,var(--focus) 22%,var(--surface));color:var(--accent-ink);touch-action:manipulation}
.table-controls .table-control:hover,.table-controls .table-control:focus-visible{background:color-mix(in srgb,var(--focus) 38%,var(--surface))}
.table-controls .table-control:disabled{opacity:.45;cursor:default}
.table-controls .table-addRow,.table-controls .table-addCol{font:600 20px/1 var(--workspace-font)}
.table-addRow{left:0;top:calc(100% + 8px);width:100%;height:24px}
.table-addCol{left:calc(100% + 8px);top:0;height:100%;width:24px}
.table-controls .table-row,.table-controls .table-col,.table-controls .table-whole{width:24px;height:20px;background:transparent;display:grid;place-items:center}
.table-row{left:-32px;transform:translateY(-50%)}
.table-col{top:-30px;transform:translateX(-50%)}
.table-whole{left:-32px;top:-30px}
.table-row::after,.table-col::after,.table-whole::after{content:"";width:15px;height:5px;border-radius:4px;background:var(--table-accent)}
.table-row::after{width:5px;height:14px}.table-whole::after{width:7px;height:7px}
.table-axis-menu{position:absolute;z-index:2;display:grid;min-width:120px;pointer-events:auto;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:4px;box-shadow:0 4px 14px var(--shadow-sm)}
.table-axis-menu button{border:0;border-radius:4px;background:transparent;color:inherit;text-align:left;white-space:nowrap;padding:6px 9px}
.table-axis-menu button:hover,.table-axis-menu button:focus-visible{background:var(--soft)}.table-axis-menu button:disabled{opacity:.45;cursor:default}
.table-cell-editor{outline:2px solid var(--focus);outline-offset:-1px;overflow:hidden}
.table-cell-editor .inline-text{height:100%;border-radius:0;background:transparent;color:inherit;box-sizing:border-box;white-space:pre-wrap;overflow-wrap:anywhere}
.view-controls{position:absolute;z-index:2;inset-block-start:var(--space);inset-inline-start:var(--space)}
.zoom-bar{display:flex;align-items:center;padding:3px;gap:1px;border-radius:12px}
.icon-button,.flat{color:var(--secondary);min-width:32px;height:32px;padding:3px 5px;font-size:12px}
.snap-toggle{padding-inline:8px;margin-right:3px}.zoom-bar .snap-toggle::after{content:"";height:16px;border-inline-end:1px solid var(--line);margin-left:4px}
#zoom-read{min-width:38px;text-align:center;font-variant-numeric:tabular-nums}
.flow-help{position:absolute;top:calc(var(--space) + 47px);left:var(--space);max-width:min(450px,calc(100% - 2 * var(--space)));z-index:1;margin:0;padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--secondary);font-size:12px;pointer-events:none}
.floating-panel{
  grid-area:viewport;align-self:start;justify-self:end;z-index:3;min-height:0;width:min(316px,calc(100% - 2 * var(--space)));
  margin:var(--space);max-height:calc(100% - var(--space) - var(--dock-bottom) - var(--dock-height) - 12px);
  overflow:auto;overscroll-behavior:contain;scroll-padding-block:54px 8px;border-radius:16px;scrollbar-width:thin;scrollbar-color:var(--muted) transparent
}
#workspace:has(.secondary-tools:not([hidden])) .floating-panel{max-height:calc(100% - var(--space) - var(--dock-bottom) - 2 * var(--dock-height) - 20px)}
.panel-title{position:sticky;top:0;z-index:2;min-height:48px;padding:6px 12px 6px 16px;display:flex;align-items:center;justify-content:space-between;gap:6px;border-bottom:1px solid var(--line);background:var(--surface)}
.panel-title>strong{display:flex;align-items:center;gap:8px;color:var(--head);font-size:14px;font-weight:650}
.panel-title>strong .ui-icon{color:var(--accent-ink)}
.panel-title .icon-button{margin-inline-start:3px}
.tool-strip{
  position:absolute;z-index:4;left:50%;transform:translateX(-50%);display:flex;flex-flow:row nowrap;align-items:center;gap:3px;
  width:max-content;max-width:calc(100% - 2 * var(--space));min-height:var(--dock-height);padding:4px;
  overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin;scrollbar-color:var(--muted) transparent;border-radius:14px
}
.main-tools{bottom:var(--dock-bottom)}
.secondary-tools{bottom:calc(var(--dock-bottom) + var(--dock-height) + 8px)}
.sticky-palette{gap:2px;padding:3px 8px;min-height:36px}
.sticky-swatch{position:relative;display:grid;place-items:center;flex:none;width:28px;height:28px;padding:0;border:0;border-radius:50%;background:transparent}
.sticky-swatch span{width:17px;height:17px;border:1px solid #2222;border-radius:50%}
.sticky-swatch[aria-checked=true]::after{content:"";position:absolute;inset:2px;border:2px solid var(--focus);border-radius:50%}
.sticky-swatch:hover{background:var(--hover)}
@media(pointer:coarse){.sticky-swatch{width:40px;height:40px}.sticky-swatch[aria-checked=true]::after{inset:7px}}
#placement-preview{position:absolute;z-index:0;pointer-events:none;user-select:none;box-sizing:border-box}
#placement-preview[data-kind=sticky]{border:1px solid #28212930;border-radius:3px;opacity:.82;box-shadow:0 2px 5px var(--shadow-sm)}
#placement-preview[data-kind=markdown]{border:1.5px dashed var(--focus);border-radius:5px;background:rgb(255 255 255 / .68);box-shadow:0 2px 5px var(--shadow-sm)}
#placement-preview[data-hint]::before{content:attr(data-hint);display:block;color:#303c4c;font-weight:400;line-height:1.5}
#placement-preview[data-kind=text]{border:1.5px dashed var(--focus);border-radius:3px;background:color-mix(in srgb,var(--soft) 45%,transparent)}
#placement-preview[data-kind=text]::before{content:"";position:absolute;top:20%;bottom:20%;left:4px;border-left:1px solid var(--accent-ink)}
#placement-preview[data-kind=table]{
  border:1px dashed var(--focus);background-color:color-mix(in srgb,var(--surface) 65%,transparent);
  background-image:linear-gradient(var(--focus),var(--focus)),linear-gradient(var(--focus),var(--focus));
  background-size:1px 100%,100% 1px;background-position:center;background-repeat:no-repeat
}
.tool{min-height:40px;padding:5px 10px;flex:none;color:var(--secondary);font-size:12px;font-weight:500}
.tool-strip :focus-visible{outline-offset:-2px}.tool-strip>*{flex:none}
.tool-sep{width:1px;height:22px;margin:0 3px;background:var(--line)}
.dock-control{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;min-height:40px;white-space:nowrap;font-size:12px;color:var(--secondary)}
.dock-control input,.dock-control select{min-width:0;border:1px solid var(--line);border-radius:6px;background:var(--well);accent-color:var(--blue)}
#path-segment{width:3.5em;padding:4px}#path-part{max-width:8em;padding:4px}.part-control:has([hidden]){display:none}
.ink-tools{gap:2px;padding:5px 7px}
.ink-tools .ink-tool,.ink-tools .ink-weight{width:34px;min-height:34px;padding:4px}
.ink-tools .ink-tool svg{width:22px;height:22px}
.ink-tools .ink-weight{width:29px}.ink-weight svg{width:19px;stroke-width:1.7}.ink-weight.thick svg{stroke-width:4.5}
.ink-size,.ink-swatches{display:inline-flex;align-items:center;gap:2px}
.ink-size{padding-inline:3px;color:var(--secondary);font-size:11px;font-variant-numeric:tabular-nums}
#ink-width{width:49px;margin:0;accent-color:var(--accent-ink);cursor:pointer}
#ink-width-value{min-width:2ch;text-align:center}
.ink-swatch,.ink-custom{position:relative;display:inline-grid;place-items:center;width:29px;height:34px;padding:0;border:0;border-radius:7px;background:transparent;flex:none}
.ink-swatch:hover,.ink-custom:hover{background:var(--hover)}
.ink-swatch span,.ink-custom>span,#ink-main-color{border-radius:50%;border:1px solid #64748b50}
.ink-swatch span,.ink-custom>span{width:17px;height:17px}
.ink-swatch[aria-pressed=true] span,.ink-custom[data-selected=true]>span{outline:2px solid var(--accent-ink);outline-offset:2px}
.ink-custom>span{background:conic-gradient(#ef5350,#f5d547,#69cc78,#36b9e8,#986bea,#ef5350)}
.ink-custom:focus-within{outline:2px solid var(--focus);outline-offset:-2px}
#ink-color{position:absolute;inset:0;width:100%;height:100%;padding:0;opacity:0;cursor:pointer}
.ink-custom:has(input:disabled),.ink-swatch:disabled{opacity:.45;cursor:default}
#ink-main-color{display:none;width:10px;height:10px}
#tool-ink[aria-pressed=true] #ink-main-color:not([hidden]){display:inline-block}
@media(pointer:coarse){.ink-tools .ink-tool,.ink-tools .ink-weight,.ink-swatch,.ink-custom{width:44px;min-height:44px}}
.layer-lock-actions{display:flex;gap:3px}
.layer-visibility{flex:none;margin-left:auto;font-size:10px;color:var(--accent-ink)}
.layer-visibility[hidden]{display:none}
.layer[data-hidden=true] .layer-name{color:var(--secondary)}
.layer-lock-actions button{height:28px;padding:0 5px;border:1px solid var(--line);border-radius:6px;background:var(--well);color:var(--text);font-size:12px}
.layer-lock-actions button[hidden]{display:none}
.layer[data-locked=true]::after{content:"锁";margin-left:auto;padding:1px 5px;border:1px solid var(--line);border-radius:4px;color:var(--secondary);background:var(--well);font-size:10px;flex:none}
@media(max-width:760px){.layer-lock-actions button{height:44px;min-width:44px}}
.layer-search{display:flex;align-items:center;gap:2px;padding:6px 8px;background:var(--surface)}
.layer-search-field{display:block;flex:1;min-width:0}
.layer-search input{width:100%;min-width:0;height:32px;padding:0 9px;font:inherit;color:var(--text);background:var(--well);border:1px solid var(--line);border-radius:7px}
.layer-search input::placeholder{color:var(--muted);opacity:1}
.layer-search input:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.layer-search-clear{flex:none;width:32px;height:32px;border:0;border-radius:7px;font-size:18px;line-height:1;background:transparent;color:var(--secondary)}
.layer-search-clear:hover{background:var(--hover)}
.layer-results{margin:0;padding:2px 12px 6px;color:var(--secondary);font-size:11px}
.layer{scroll-margin-block-start:46px}
.layer-search-clear[hidden],.layer-results[hidden],.layer-paging>div[hidden]{display:none}
@media(max-width:760px){
  .layer-search input{height:44px;font-size:16px}
  .layer-search-clear{width:44px;height:44px}
  .layer{scroll-margin-block-start:58px}
}
#layers{display:grid;gap:2px;padding:0 8px}
.layer{border:0;background:transparent;padding:8px 8px;display:flex;align-items:center;gap:9px;border-radius:7px;min-height:38px;text-align:left;white-space:nowrap;overflow:hidden}
.layer[data-flow-group] .layer-name::before{content:"";display:inline-block;width:5px;height:9px;border-left:2px solid currentColor;opacity:.6;margin-right:5px}
.layer .layer-name{overflow:hidden;text-overflow:ellipsis}
.layer[aria-pressed=true]{background:var(--soft);color:var(--accent-ink)}
.layer:hover:not([aria-pressed=true]){background:var(--hover)}
.topic-tree{margin:0 6px 5px;border-block:1px solid var(--line);color:var(--text)}
.topic-tree[hidden],.topic-tree [hidden],#topic-tree-current[hidden]{display:none}
.topic-tree button{font:inherit;color:inherit;border:0;background:transparent;text-align:start}
#topic-tree-toggle,#topic-tree-current{display:block;width:100%;padding:6px 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#topic-tree-toggle{font-weight:650}
#topic-tree-current{color:var(--accent-ink);font-size:11px}
.topic-tree-status{margin:0;padding:2px 5px 5px;color:var(--secondary);font-size:11px}
.topic-tree-list{max-height:min(34vh,285px);overflow:auto;overscroll-behavior:contain}
.topic-row{display:flex;align-items:center;width:100%;min-height:30px;padding:3px 4px;gap:3px;border-radius:5px}
.topic-tree button:hover{background:var(--hover)}
.topic-tree .topic-row[aria-selected=true]{background:var(--soft);color:var(--accent-ink);font-weight:650}
.topic-row[aria-selected=true] .topic-caption::before{content:"● ";font-size:8px}
.topic-tree button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.topic-caret{flex:0 0 19px;align-self:stretch;display:grid;place-items:center;color:var(--secondary)}
.topic-row-copy{min-width:0}
.topic-caption,.topic-context{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topic-context{font-size:10px;color:var(--secondary)}
.topic-tree-pager{display:flex;align-items:center;justify-content:space-between;gap:4px;color:var(--secondary);font-size:10px}
.topic-tree-pager button{padding:5px}
@media(max-width:760px){
  .topic-tree button{min-height:44px}
  .topic-caret{flex-basis:32px}
  .topic-tree-list{max-height:22dvh}
}
.layer-icon{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;font-size:13px;color:var(--shape-icon);background:var(--shape-tint);flex:none}
.layer-icon.mindmap{color:var(--map-icon);background:var(--map-tint)}
.layer-icon.connector{color:var(--path-icon);background:var(--path-tint)}

.inside{display:grid;gap:14px;padding:16px;color:var(--text)}
.inside>*{min-width:0}
.inside h2,.inside h3,.inside p{margin:0}
.inside h2{font-size:18px;font-weight:665;line-height:1.4;color:var(--head);overflow-wrap:anywhere}
.inside h3{font-size:13px;font-weight:650;color:var(--head)}
.inside p{font-size:12px;line-height:1.6;color:var(--secondary)}
.inside p:empty{display:none}
.object-heading{display:grid;gap:5px}
.type-chip{color:var(--muted);font-size:12px;font-weight:550}
.props{display:flex;gap:14px;flex-wrap:wrap;margin:0}
.props div{display:flex;align-items:baseline;gap:6px}
.props dt,.props dd{margin:0;font-size:12px}.props dt{color:var(--muted)}.props dd{font-weight:600}
.inside>.transform,.inside>.flow-properties,.flow-properties>.transform,.flow-properties>.flow-properties,.flow-properties>form,.inside>.standalone-actions{border-top:1px solid var(--line);padding-top:13px}
.flow-properties>:first-child{border-top:0;padding-top:0}
.transform,.flow-properties{display:grid;min-width:0;gap:9px}
.transform-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.transform-fields.appearance-fields{grid-template-columns:minmax(0,1fr)}
.transform-fields label{display:flex;align-items:center;gap:5px;min-width:0;min-height:36px;padding:0 8px;border-radius:8px;background:var(--well);border:1px solid var(--line)}
.transform-fields label>span,.flow-field>span,.endpoint-rows>span{flex:none;color:var(--secondary);font-size:12px}

.inline-actions{display:flex;position:relative;width:max-content;gap:4px;padding-top:5px}
.inline-actions .button{flex:none;height:29px;padding:0 9px;white-space:nowrap;box-shadow:0 2px 6px var(--shadow-xs)}
.node-editor{transform:translateY(-50%);text-align:center;border-radius:3px;box-shadow:0 1.5px 0 color-mix(in srgb,currentColor 42%,transparent)}
/* The mirror grows with native wrapping, including a trailing blank line. The
   textarea owns the caret, selection and scrolling once the node is full. */
.node-editor::before,.node-editor .inline-text{padding:2px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.node-editor::before{content:attr(data-value) "\200b";display:block;visibility:hidden}
.node-editor[data-auto-width]::before,.node-editor[data-auto-width] .inline-text{white-space:pre;overflow-wrap:normal}
.node-editor .inline-text{position:absolute;inset:0;height:100%;text-align:inherit;background:transparent;scrollbar-width:none}
.node-editor .inline-text::placeholder{color:currentColor;opacity:.65}
.node-editor .inline-text::selection{background:Highlight;color:HighlightText}
.layer-paging{padding:9px 8px;display:grid;gap:5px;font-size:10px;color:var(--muted)}
.layer-paging[hidden]{display:none}
.layer-paging>div{display:flex;align-items:center;justify-content:space-between;gap:3px}
.layer-paging .button{font-size:10px;padding:0 5px}
@media(max-width:760px){.layer-paging .button{min-height:44px}}

.arrange-menu[hidden],.arrange-menu [role="menuitem"][hidden]{display:none}
.arrange-menu{position:fixed;z-index:20;width:210px;max-width:calc(100vw - 16px);max-height:calc(100dvh - 16px);overflow:auto;padding:5px;background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 28px var(--shadow-lg)}
.arrange-menu [role="menuitem"]{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 9px;min-height:26px;border:0;border-radius:5px;background:var(--surface);text-align:left;white-space:nowrap}
.arrange-menu kbd{font:inherit;font-size:10px;color:var(--muted)}
.arrange-menu [role="menuitem"]:not(:disabled):is(:focus-visible,:hover){background:var(--soft);outline-offset:-2px}
.arrange-menu .layout-feedback{margin:3px 8px 5px;color:var(--secondary);font-size:12px;line-height:1.45;overflow-wrap:anywhere}
.arrange-menu [role="separator"]{margin:4px 1px;border-top:1px solid var(--line)}
.arrange-menu[data-connection-drop]{width:146px}
.arrange-menu [data-drop-node]{justify-content:flex-start;gap:12px;min-height:32px}
.arrange-menu [data-drop-node]::before{content:"";box-sizing:border-box;flex:none;width:14px;height:10px;border:1.5px solid currentColor;border-radius:2px;color:var(--shape-icon)}
.arrange-menu [data-drop-node="decision"]::before{width:10px;height:10px;margin-inline:2px;transform:rotate(45deg)}
.arrange-menu [data-drop-node="free"]::before{height:0;border:0;border-top:1.5px dashed currentColor;border-radius:0;color:var(--muted)}
@media(pointer:coarse){.arrange-menu [role="menuitem"]{min-height:44px}}

@media(max-width:960px){
  .header{gap:10px;padding-inline:14px}
  .workspace-actions{gap:7px}.document-actions{padding-inline-start:9px}
  .header-button,.panel-toggle,.file-history summary{padding-inline:7px}
  .subtitle{display:none}
}
@media(max-width:820px){
  .header{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"doc files" "view view";gap:6px;padding:8px 12px}
  .doc{grid-area:doc}.workspace-actions{grid-area:view;justify-content:space-between}
  .document-actions{grid-area:files;border:0;padding:0}
  .workspace-theme label>span,.panel-toggle,.document-actions :is(button,summary){min-height:40px}
  .doc strong{font-size:14px}.sigil{height:33px;width:33px}
}
@media(max-width:760px){
  #workspace{--space:10px;--dock-height:58px}
  .floating-panel{margin-block-start:calc(var(--space) + 52px);max-height:calc(100% - var(--space) - 52px - var(--dock-bottom) - var(--dock-height) - 8px)}
  #workspace:has(.secondary-tools:not([hidden])) .floating-panel{max-height:calc(100% - var(--space) - 52px - var(--dock-bottom) - 2 * var(--dock-height) - 16px)}
  .tool,.dock-control,.flat,.icon-button,.header-button,.panel-toggle,.file-history summary,.document-actions .button,.workspace-theme label>span{min-height:44px}
  .header-button,.panel-toggle,.file-history summary,.icon-button,.flat{min-width:44px}
  .flow-help{top:calc(var(--space) + 54px)}
  #workspace:has(.floating-panel:not([hidden])) .flow-help{visibility:hidden}
  .inside{padding:13px;gap:11px}
  .floating-panel :is(input:not([type=color],[type=checkbox]),select,.button){min-height:40px}
  .inline-actions .button,.aspect-option{min-height:44px}
  .tool-strip{padding:3px;gap:2px}.tool{padding-inline:10px}
  .file-history-list{right:auto;left:0}
}
@media(max-width:520px){
  .header{padding:5px 8px;gap:3px}
  .document-actions{gap:0}.header-button>span,.file-history summary>span{display:none}
  .doc{gap:6px}.document-actions #save{padding-inline:9px}
  .workspace-actions{gap:4px}.panel-switch{gap:2px}
  .workspace-theme{padding:1px;gap:0}.workspace-theme label>span{padding-inline:6px}
  .panel-toggle{padding:4px 6px;gap:4px;font-size:12px}
}
@media(max-width:365px){
  .panel-toggle>span{display:none}.workspace-theme label>span{padding-inline:7px}
  .document-actions #save .ui-icon{display:none}
}
@media(max-height:500px) and (max-width:820px){
  .floating-panel{margin-block-start:4px;max-height:calc(100% - var(--dock-bottom) - var(--dock-height) - 8px)}
  #workspace:has(.secondary-tools:not([hidden])) .floating-panel{max-height:calc(100% - var(--dock-bottom) - 2 * var(--dock-height) - 16px)}
}
.card-editor{position:absolute;z-index:1;transform-origin:top left;box-sizing:border-box;border-radius:5px;box-shadow:0 0 0 1.5px var(--accent,#5279df);overflow:visible}
.card-editor[data-kind="sticky"]{border-radius:3px}
.card-sheet{box-sizing:border-box;width:100%;height:100%;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;line-height:1.5}
.card-editor .card-input{display:block;box-sizing:border-box;width:100%;min-height:1.5em;margin:0;padding:0;border:0;outline:0;resize:none;overflow:hidden;background:transparent;color:inherit;font:inherit;line-height:1.5;text-align:inherit;text-decoration:inherit;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:none}
.card-input::placeholder{color:var(--card-placeholder-ink);opacity:1}
.card-sheet .card-block{position:relative;margin:0;min-height:1.5em;color:inherit;font-family:inherit;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;cursor:text}
.card-sheet [data-block="heading"]{min-height:1.28em;line-height:1.28;font-weight:700}
.card-sheet [data-block="heading"]:not(:first-child){margin-top:.23em}
.card-sheet [data-block="space"]{min-height:.87em}
.card-sheet [data-block="quote"]{padding-inline-start:.65em;border-inline-start:.15em solid color-mix(in srgb,currentColor 42%,transparent)}
.card-sheet [data-block="code"]{padding:.5em .8em;background:color-mix(in srgb,currentColor 7%,transparent);border-radius:4px}
.card-block[data-marker]::before{position:absolute;content:attr(data-marker);margin-inline-start:-1.4em}
.card-block code{font-family:Consolas,"Cascadia Mono",monospace}
.card-block a{color:inherit;text-decoration:underline;text-underline-offset:.15em}
.markdown-field{position:relative;min-height:1.5em;outline:0;caret-color:currentColor;white-space:pre-wrap;overflow-wrap:anywhere;cursor:text}
.card-editor:not([data-composing]) .markdown-field[data-empty]::before{content:attr(aria-placeholder);position:absolute;inset:0;color:var(--card-placeholder-ink);pointer-events:none;user-select:none}
.markdown-field:focus-visible{outline:0}
.markdown-field .card-block[data-block=space]{line-height:.87}
.markdown-field pre{font-family:Consolas,"Cascadia Mono",monospace}
.card-source-switch{position:absolute;right:6px;bottom:5px;border:0;border-radius:4px;padding:2px 7px;background:var(--surface);color:var(--muted);font:500 11px/1.5 var(--workspace-font);cursor:pointer}
.card-source-switch:focus-visible,.card-source-switch:hover{outline:1px solid var(--accent);color:var(--ink)}

</style>
<!-- mgcanvas-input -->
</head>
<body>

<div id="workspace">
  <header class="header">
    <div class="doc">
      <div class="sigil" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M5 22V10l6 6 5-6 5 6 6-6v12" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/></svg></div>
      <div class="doc-info"><strong>会议室系统</strong><div class="doc-meta"><span id="status" role="status" aria-live="polite">未保存</span><div class="subtitle">开发预览 M5AX</div></div></div>
    </div>
    <div class="workspace-actions">
      <div id="workspace-theme" class="workspace-theme" role="radiogroup" aria-label="工作区外观">
        <label title="浅色"><input id="theme-light" type="radio" name="appearance" value="light"><span><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#glyph-sun"/></svg><span>浅色</span></span></label>
        <label title="深色"><input id="theme-dark" type="radio" name="appearance" value="dark"><span><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#glyph-moon"/></svg><span>深色</span></span></label>
        <label title="跟随系统"><input id="theme-system" type="radio" name="appearance" value="system" checked><span><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#glyph-display"/></svg><span>跟随系统</span></span></label>
      </div>
      <div class="panel-switch" role="group" aria-label="工作区面板">
        <button id="toggle-layers" class="panel-toggle" type="button" aria-label="图层" title="图层" aria-controls="layers-panel" aria-expanded="false"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#glyph-layers"/></svg><span>图层</span></button>
        <button id="toggle-inspector" class="panel-toggle" type="button" aria-label="属性" title="属性" aria-controls="inspector-panel" aria-expanded="false"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#glyph-sliders"/></svg><span>属性</span></button>
      </div>
    </div>
    <div class="document-actions" role="group" aria-label="文件">
      <details id="file-history" class="file-history"><summary title="重开已保存的画板" aria-label="已存画板"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#glyph-history"/></svg><span>历史</span></summary>
        <div class="file-history-list">
      <button id="open" class="menu-button" type="button" title="打开最近保存的画板">重开</button>
      <button id="open-other" class="menu-button" type="button" hidden>另一副本</button>
      <button id="open-legacy" class="menu-button" type="button" hidden>旧副本</button>
      <button id="open-fourth" class="menu-button" type="button" hidden>更多副本</button>
      <button id="open-fifth" class="menu-button" type="button" hidden>更多副本</button>
      <button id="open-sixth" class="menu-button" type="button" hidden>更多副本</button>
      <button id="open-seventh" class="menu-button" type="button" hidden>更多副本</button>
      <button id="open-eighth" class="menu-button" type="button" hidden>更多副本</button>
        </div>
      </details>
      <button id="project-open" class="header-button" type="button" title="导入项目文件" aria-label="导入"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#glyph-file"/></svg><span>导入</span></button>
      <button id="project-export" class="header-button" type="button" title="导出项目文件" aria-label="导出"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#glyph-upload"/></svg><span>导出</span></button>
      <button id="save" class="button primary" type="button" title="保存（Ctrl+S）"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#glyph-save"/></svg><span>保存</span></button>
    </div>
  </header>
  <aside id="layers-panel" class="floating-panel layers-panel" aria-label="图层" tabindex="-1" hidden>
    <div class="panel-title"><strong><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#glyph-layers"/></svg>图层</strong><div class="layer-lock-actions">
      <button id="layer-hide" type="button" title="隐藏所选图层，仅限本次打开" aria-label="隐藏所选图层" disabled>隐藏</button>
      <button id="layer-show-all" type="button" title="显示当前画板的全部图层" aria-label="显示全部图层" hidden>全显</button>
      <button id="layer-lock" type="button" title="锁定所选图层，仅限本次打开" aria-label="锁定所选图层" disabled>锁定</button>
      <button id="layer-unlock" type="button" title="解锁所选图层" aria-label="解锁所选图层" hidden>解锁</button>
      <button id="close-layers" class="icon-button" type="button" title="收起图层面板" aria-label="收起图层面板"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#glyph-close"/></svg></button>
    </div></div>
    <div class="layer-search" role="search" aria-label="图层名称">
      <span id="layer-search-field" class="layer-search-field"></span>
      <button id="layer-search-clear" class="layer-search-clear" type="button" aria-label="清空图层搜索" title="清空图层搜索" hidden>×</button>
    </div>
    <p id="layer-results" class="layer-results" role="status" hidden></p>
    <section id="topic-tree" class="topic-tree" aria-label="当前脑图的主题层级" hidden></section>
    <div id="layers" aria-label="对象列表"></div>
    <div id="layer-paging" class="layer-paging" hidden>
      <div id="layer-page-controls"><button id="layer-newer" class="button" type="button">上一页</button><span id="layer-page-read" aria-live="polite"></span><button id="layer-older" class="button" type="button">下一页</button></div>
      <button id="layer-locate" class="button" type="button">定位所选图层</button>
    </div>
  </aside>
  <main id="viewport" aria-label="无限画布工作区">
    <canvas id="canvas" tabindex="0" aria-label="项目画布：可点选图层，拖形状或图片的角点缩放，也可用属性面板输入数值。"></canvas>
    <div class="view-controls">
      <div id="view-zoom" class="zoom-bar" aria-label="画布控件">
        <button id="drag-snap" class="flat snap-toggle" type="button" aria-label="拖动对齐与等距吸附" aria-pressed="false" title="移动和复制都可对齐或等距。先按 Alt / Option 再拖动可复制，普通拖动中再按可暂停吸附"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#glyph-snap"/></svg><span>吸附</span></button>
        <button id="zoom-out" class="icon-button" aria-label="缩小" type="button"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#glyph-minus"/></svg></button>
        <button id="fit" class="flat" title="查看整板（0）" type="button"><span id="zoom-read">100%</span></button>
        <button id="zoom-in" class="icon-button" aria-label="放大" type="button"><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#glyph-plus"/></svg></button>
      </div>
    </div>
    <output id="flow-help" class="flow-help" aria-live="polite" hidden></output>
    <div id="path-tools" class="tool-strip secondary-tools" role="group" aria-label="路径操作" hidden>
      <label id="path-segment-label" class="dock-control" hidden><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#glyph-point"/></svg><span>段</span> <input id="path-segment" type="number" inputmode="numeric" min="1" step="1" aria-label="选中路径段"></label>
      <button id="path-insert" class="tool" type="button" aria-pressed="false" aria-keyshortcuts="I Insert" title="点路径插入，Enter 在选中段的参数中点插入" hidden><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#glyph-insert"/></svg><span>插入顶点</span></button>
      <button id="path-convert" class="tool" type="button" hidden><svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><use href="#glyph-curve"/></svg><span>转为曲线</span></button>

<script type="module">
const units=[{"path":"core/text-style.js","code":"export const DEFAULT_TEXT_COLOR=\"#243854\";\nexport const textFamilies=[\"system\",\"arial\",\"roboto\",\"yahei\",\"pingfang\",\"noto-sans\",\"serif\",\"georgia\",\"times\",\"songti\",\"simsun\",\"noto-serif\"]         ;\n                                                   \n                                       \n                                                                                               \n                                                                                             \n\n/** Older projects only stored a color. An explicit choice matching the old default needs a marker. */\nexport function automaticTextColor(paint                         )        {\n  if(paint.colorMode)return paint.colorMode===\"auto\";\n  return paint.color===DEFAULT_TEXT_COLOR||paint.color===\"#52647e\"&&(paint.id===\"flow-heading\"||paint.id===\"mind-heading\");\n}\n","deps":{}},{"path":"core/table.js","code":"                                         \nimport { textFamilies } from \"./text-style.js\";\n                                                \n\n                                             \n                                                                                      \n                                      \n   \n                                                                  \n                                          \n                                                                                     \n   \nexport const MAX_TABLE_AXIS=256, MAX_TABLE_CELLS=10_000, MAX_CELL_TEXT=12_000;\nexport function fitsTable(rows       ,cols       )        {\n  return Number.isInteger(rows)&&Number.isInteger(cols)&&rows>0&&cols>0&&rows\u003c=MAX_TABLE_AXIS&&\n    cols\u003c=MAX_TABLE_AXIS&&rows*cols\u003c=MAX_TABLE_CELLS;\n}\nconst record=(value        )                                =>value!==null&&typeof value===\"object\"&&\n  (Object.getPrototypeOf(value)===Object.prototype||Object.getPrototypeOf(value)===null);\nconst hex=(value        )=>typeof value===\"string\"&&/^#[a-f0-9]{6}$/i.test(value);\nexport function validCellStyle(style        )                   {\n  return record(style)&&Object.entries(style).every(([key,value])=>{\n    switch(key){\n      case \"fontFamily\": return textFamilies.some(f=>f===value);\n      case \"fontSize\": return typeof value===\"number\"&&Number.isFinite(value)&&value>=6&&value\u003c=160;\n      case \"fontWeight\": return [400,500,600,700].some(w=>w===value);\n      case \"italic\": case \"strike\": case \"underline\": return typeof value===\"boolean\";\n      case \"align\": return value===\"left\"||value===\"center\"||value===\"right\";\n      case \"color\": return value===\"auto\"||hex(value);\n      case \"background\": return value===\"transparent\"||hex(value);\n      default: return false;\n    }\n  });\n}\nexport function validTableCells(cells        )                              {\n  if(!Array.isArray(cells)||!Array.isArray(cells[0])||!fitsTable(cells.length,cells[0].length))return false;\n  const columns=cells[0].length;\n  for(const row of cells){\n    if(!Array.isArray(row)||row.length!==columns)return false;\n    for(const cell of row){\n      if(!record(cell)||typeof cell.text!==\"string\"||cell.text.length>MAX_CELL_TEXT||\n        !Object.keys(cell).every(k=>k===\"text\"||k===\"style\")||(\"style\" in cell&&!validCellStyle(cell.style)))return false;\n    }\n  }\n  return true;\n}\n","deps":{"./text-style.js":"core/text-style.js"}},{"path":"platform/theme.js","code":"import {automaticTextColor} from \"../core/text-style.js\";\n                                                     \n                                                    \n                                                             \nexport const THEME_STORAGE_KEY=\"mg-canvas:workspace-theme\";\nexport function parseTheme(value        )                {return value===\"light\"||value===\"dark\"?value:\"system\";}\nexport function resolveTheme(preference                ,prefersDark        )               {\n  return preference===\"system\"?(prefersDark?\"dark\":\"light\"):preference;\n}\nexport const canvasThemes={\n  light:{bg:\"#f3f5f9\",grid:\"#d8dee9\",accent:\"#3566e7\",guide:\"#b02570\",spacing:\"#0b716a\",accentMuted:\"#89a6ef\",accentFill:\"#3566e721\",handle:\"#ffffff\",\n    valid:\"#16886e\",invalid:\"#c54a3e\",placeholder:\"#e7edf6\",placeholderBorder:\"#b4c3dc\",placeholderInk:\"#52647d\",ink:\"#212735\",halo:\"#ffffff\"},\n  dark:{bg:\"#1b1d23\",grid:\"#363b49\",accent:\"#84a7ff\",guide:\"#ff91ca\",spacing:\"#65ddca\",accentMuted:\"#6178ac\",accentFill:\"#84a7ff29\",handle:\"#252938\",\n    valid:\"#4bd7ae\",invalid:\"#ff8e82\",placeholder:\"#2b3443\",placeholderBorder:\"#687c9a\",placeholderInk:\"#d9e4f5\",ink:\"#e9eefb\",halo:\"#a2b5d3\"},\n}         ;\nfunction rgb(hex       )                 {\n  const spec=/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(hex)?.[1];\n  return spec?Number.parseInt(spec.length===3?[...spec].map(x=>x+x).join(\"\"):spec,16):undefined;\n}\nfunction luminance(hex       )                 {\n  const n=rgb(hex);\n  if(n===undefined)return;\n  const lin=(b       )=>{const x=b/255;return x\u003c=.04045?x/12.92:((x+.055)/1.055)**2.4;};\n  return .2126*lin(n>>16)+.7152*lin((n>>8)&255)+.0722*lin(n&255);\n}\nexport function contrastRatio(fg       ,bg       )                 {\n  const a=luminance(fg),b=luminance(bg);\n  return a===undefined||b===undefined?undefined:(Math.max(a,b)+.05)/(Math.min(a,b)+.05);\n}\nexport function contrastInk(background       )              {\n  const lightness=luminance(background);\n  if(lightness===undefined)return \"#fff\";\n  const black=(lightness+.05)/.05,white=1.05/(lightness+.05);\n  return white>=black?\"#fff\":\"#000\";\n}\n/** A dark, opaque connector gets one lighter tint for both the shaft and its heads. */\nexport function canvasStroke(ink       ,theme               ){\n  const contrast=contrastRatio(ink,canvasThemes[theme].bg)??Infinity;\n  const color=theme===\"dark\"&&contrast\u003c3?rgb(ink):undefined;\n  if(color===undefined)return {contrast,connector:ink};\n  const tint=(channel       )=>Math.round(channel*.55+255*.45).toString(16).padStart(2,\"0\");\n  return {contrast,connector:\"#\"+tint(color>>16)+tint((color>>8)&255)+tint(color&255)};\n}\n/** Applies to automatically chosen diagram labels only, never persistent object ink. */\nexport function autoLabelInk(preferred       ,fill       )       {\n  const score=contrastRatio(preferred,fill);\n  if(score===undefined||score>=4.5)return preferred;\n  return (contrastRatio(\"#ffffff\",fill)??0)>=(contrastRatio(\"#000000\",fill)??0)?\"#ffffff\":\"#000000\";\n}\n\n/** Legacy shape fills may be named CSS colors or translucent. Composite them over the canvas first. */\nconst surfaces=new Map               ();\nlet sampler                                        ;\nexport function labelSurface(fill                 ,theme               )       {\n  const bg=canvasThemes[theme].bg;\n  if(!fill||fill===\"transparent\")return bg;\n  if(rgb(fill)!==undefined)return fill;\n  const key=bg+\" \"+fill,cached=surfaces.get(key);\n  if(cached)return cached;\n  if(typeof document===\"undefined\")return bg;\n  if(sampler===undefined){\n    const pixel=document.createElement(\"canvas\");pixel.width=pixel.height=1;\n    sampler=pixel.getContext(\"2d\",{willReadFrequently:true});\n  }\n  if(!sampler)return bg;\n  sampler.fillStyle=bg;sampler.fillRect(0,0,1,1);sampler.fillStyle=fill;sampler.fillRect(0,0,1,1);\n  const data=sampler.getImageData(0,0,1,1)?.data;\n  if(!data)return bg;\n  const surface=\"#\"+Array.from(data.subarray(0,3),v=>v.toString(16).padStart(2,\"0\")).join(\"\");\n  if(surfaces.size>=256)surfaces.clear();\n  surfaces.set(key,surface);return surface;\n}\nexport function standaloneInk(paint          ,theme               )       {\n  if(!automaticTextColor(paint))return paint.color;\n  if(paint.background)return autoLabelInk(paint.color,paint.background);\n ithin this subinterval.\n    const error=Math.max(distance(controls.c1,lerp(from,to,1/3)),distance(controls.c2,lerp(from,to,2/3)));\n    if(distance(chord,p)>best+error)return;\n    if(error\u003c=.0001||depth>=36){consider(lo+(hi-lo)*u,segmentPoint(part,u));return;}\n    const [left,right]=splitSegment(part,.5),mid=(lo+hi)/2;\n    consider(mid,left.to);\n    if(u\u003c=.5){visit(left,lo,mid,depth+1);visit(right,mid,hi,depth+1);}\n    else{visit(right,mid,hi,depth+1);visit(left,lo,mid,depth+1);}\n  };\n  visit(s,0,1,0);return time;\n}\nfunction pointRect(p      ,r     )       {\n  return Math.hypot(Math.max(0,r.min.x-p.x,p.x-r.max.x),Math.max(0,r.min.y-p.y,p.y-r.max.y));\n}\nfunction chordDistance(a      ,b      ,r     )       {\n  if(r.min.x===r.max.x&&r.min.y===r.max.y)return pointLine(r.min,a,b);\n  let lo=0,hi=1;\n  for(const axis of [\"x\",\"y\"]         ){\n    const d=b[axis]-a[axis];\n    if(!d){if(a[axis]\u003cr.min[axis]||a[axis]>r.max[axis]){lo=2;break;}continue;}\n    const one=(r.min[axis]-a[axis])/d,two=(r.max[axis]-a[axis])/d;\n    lo=Math.max(lo,Math.min(one,two));hi=Math.min(hi,Math.max(one,two));\n  }\n  if(lo\u003c=hi)return 0;\n  return Math.min(pointRect(a,r),pointRect(b,r),pointLine(r.min,a,b),pointLine(r.max,a,b),\n    pointLine({x:r.min.x,y:r.max.y},a,b),pointLine({x:r.max.x,y:r.min.y},a,b));\n}\n/** Compare against a finite chord, including collinear handles beyond either endpoint.\n * Prune disjoint hulls. Maximum flattening error is 0.0016 CSS px at zoom 16. */\nexport function segmentDistance(segment            ,region     ,limit       )       {\n  let best=Infinity;\n  const visit=(s            ,depth       )=>{\n    if(best===0)return;\n    const {from:a,to:b,controls}=s;\n    if(!controls){const d=chordDistance(a,b,region);if(d\u003c=limit)best=Math.min(best,d);return;}\n    const {c1,c2}=controls,cutoff=Math.min(best,limit);\n    const dx=Math.max(0,region.min.x-Math.max(a.x,b.x,c1.x,c2.x),Math.min(a.x,b.x,c1.x,c2.x)-region.max.x);\n    const dy=Math.max(0,region.min.y-Math.max(a.y,b.y,c1.y,c2.y),Math.min(a.y,b.y,c1.y,c2.y)-region.max.y);\n    if(Math.hypot(dx,dy)>cutoff)return;\n    const flat=Math.max(pointLine(c1,a,b),pointLine(c2,a,b));\n    const chord=chordDistance(a,b,region);\n    if(chord-flat>cutoff)return;\n    if(flat\u003c=.0001||depth>=36){if(chord\u003c=limit)best=Math.min(best,chord);return;}\n    const [left,right]=splitSegment(s,.5);visit(left,depth+1);visit(right,depth+1);\n  };\n  visit(segment,0);return best;\n}\nexport function closestSegment(segments                       ,p      ,radius       ,preferred        )                 {\n  const region={min:p,max:p};\n  let best=preferred!==undefined&&segments[preferred]?segmentDistance(segments[preferred],region,radius):Infinity;\n  let index=Number.isFinite(best)?preferred:undefined;\n  segments.forEach((s,i)=>{\n    if(i===preferred)return;\n    const d=segmentDistance(s,region,Math.min(best,radius));\n    if(d\u003cbest){best=d;index=i;}\n  });\n  return index;\n}\n","deps":{}},{"path":"core/path-transform.js","code":"                                                    \nimport {gridPoint} from \"./geometry.js\";\nimport {gridPath} from \"./document-grid.js\";\n                                                           \nimport {validPathGeometry} from \"./document.js\";\nimport {segmentBetween,vectorBounds} from \"./path-geometry.js\";\n\n                                                                                          \nconst frames=new WeakMap                      ();\nconst minus=(a      ,b      )      =>({x:a.x-b.x,y:a.y-b.y});\n\n/** A contour-relative box follows rotations even for asymmetric curves. Its axes\n * come from the first significant directed edge; the bounds include cubic extrema. */\nexport function pathFrame(path           )          {\n  const cached=frames.get(path);\n  if(cached)return cached;\n  const {vertices,closed,curves}=path,first=vertices[0],count=vertices.length-(closed?0:1);\n  const edges=Array.from({length:count},(_,i)=>minus(vertices[(i+1)%vertices.length],vertices[i]));\n  const lengths=edges.map(p=>Math.hypot(p.x,p.y));\n  const longest=lengths.reduce((a,b)=>Math.max(a,b),0);\n  const index=lengths.findIndex(n=>n>0&&n>=longest*1e-8);\n  const ux=index\u003c0?1:edges[index].x/lengths[index],uy=index\u003c0?0:edges[index].y/lengths[index];\n  const local=(p      )      =>({x:p.x*ux+p.y*uy,y:-p.x*uy+p.y*ux});\n  const points=vertices.map(p=>local(minus(p,first)));\n  const segments=edges.map((_,i)=>{\n    const pair=curves?.[i];\n    return segmentBetween(points[i],points[(i+1)%points.length],pair?{out:local(pair.out),in:local(pair.in)}:undefined);\n  });\n  const {min,max}=vectorBounds(segments),x=(min.x+max.x)/2,y=(min.y+max.y)/2;\n  const center={x:(path.at.x+first.x)+(x*ux-y*uy),y:(path.at.y+first.y)+(x*uy+y*ux)};\n  const frame={center,width:max.x-min.x,height:max.y-min.y,rotation:Math.atan2(uy,ux)};\n  frames.set(path,frame);return frame;\n}\n\n/** Make the four corner targets distinct even for a single horizontal segment.\n * Padding belongs to the editing UI and is never part of the contour. */\nexport function pathHandleBox(frame          ,camera       )    {\n  const min=48/camera.zoom,width=Math.max(min,frame.width),height=Math.max(min,frame.height);\n  return {at:{x:frame.center.x-width/2,y:frame.center.y-height/2},width,height,rotation:frame.rotation};\n}\n\n/** Painted round caps and joins extend equally along both local axes. Grips still transform the centerline. */\nexport function pathStrokeBox(frame          ,strokeWidth       )    {\n  const width=frame.width+strokeWidth,height=frame.height+strokeWidth;\n  return {at:{x:frame.center.x-width/2,y:frame.center.y-height/2},width,height,rotation:frame.rotation};\n}\n\nfunction handleCoincides(at      ,vertex      ,delta      )        {\n  const x=at.x+vertex.x,y=at.y+vertex.y;\n  return x+delta.x===x&&y+delta.y===y;\n}\n\n/** At the new origin a drawable edge or handle must not vanish through numerical rounding. */\nfunction checkedPlacement(original           ,next           )                     {\n  if(!validPathGeometry(next))return;\n  const {vertices,at}=next,old=original.vertices;\n  for(let i=0;i\u003cvertices.length-(next.closed?0:1);i++){\n    const j=(i+1)%vertices.length,a=vertices[i],b=vertices[j];\n    if(at.x+a.x===at.x+b.x&&at.y+a.y===at.y+b.y&&\n      (original.at.x+old[i].x!==original.at.x+old[j].x||original.at.y+old[i].y!==original.at.y+old[j].y))return;\n    const pair=next.curves?.[i],before=original.curves?.[i];\n    if(pair&&before&&(handleCoincides(at,a,pair.out)&&!handleCoincides(original.at,old[i],before.out)||\n      handleCoincides(at,b,pair.in)&&!handleCoincides(original.at,old[j],before.in)))return;\n  }\n  return next;\n}\n\n/** Bake a center-based similarity, then place explicitly supplied axes at their final path origin.\n * For translation alone, retain the original relative anchors and cubic handles. */\nexport function transformPath(path           ,angle       ,scale       ,frame           ,position                )                     {\n  if(!Number.isFinite(angle)||!Number.isFinite(scale)||scale\u003c=0)return;\n  const turn=angle%(2*Math.PI);\n  const quarter=Math.PI/2,k=Math.round(turn/quarter);\n  const axis=Math.abs(turn-k*quarter)\u003c=4*Number.EPSILON;\n  const i=(k%4+4)%4,c=axis?[1,0,-1,0][i]:Math.cos(turn),s=axis?[0,1,0,-1][i]:Math.sin(turn);\n  if(c===1&&s===0&&scale===1){\n    const {x,y}=gridPoint({x:position?.x??path.at.x,y:position?.y??path.at.y});\n    return x===path.at.x&&y===path.at.y?path:checkedPlacement(path,{...path,at:{x,y}});\n  }\n  frame??=pathFrame(path);\n  const vector=(p      )      =>({x:(p.x*c-p.y*s)*scale,y:(p.x*s+p.y*c)*scale});\n  // Older files can place a valid short contour extremely far from its local\n  // origin. Rebase only if the origin's rounding error threatens contour detail.\n  const first=path.vertices[0];\n  const rebase=Math.hypot(first.x,first.y)*Number.EPSILON>Math.max(frame.width,frame.height)*1e-12;\n  const origin=rebase?{x:path.at.x+first.x,y:path.at.y+first.y}:path.at;\n  const offset=vector(minus(origin,frame.center));\n  const at={x:frame.center.x+offset.x,y:frame.center.y+offset.y};\n  const vertices=rebase?path.vertices.map(p=>vector(minus(p,first))):path.vertices.map(vector);\n  const next={...path,at,vertices};\n  if(path.curves){\n    const curves                            ={};\n    for(const [edge,handles] of Object.entries(path.curves))curves[edge]={out:vector(handles.out),in:vector(handles.in)};\n    next.curves=curves;\n  }\n  const snapped=gridPath(next);\n  const placed=position?{...snapped,at:gridPoint({x:position.x??snapped.at.x,y:position.y??snapped.at.y})}:snapped;\n  return checkedPlacement(path,placed);\n}\n","deps":{"./geometry.js":"core/geometry.js","./document-grid.js":"core/document-grid.js","./document.js":"core/document.js","./path-geometry.js":"core/path-geometry.js"}},{"path":"core/flow-groups.js","code":"                                                    \n\n                                                  \nconst cache=new WeakMap                     ();\n/** Explicit node references determine group ownership. Only links with both\n * endpoints inside the same group belong to its whole-group selection. */\nfunction index(doc              )      {\n  let result=cache.get(doc);if(result)return result;\n  const owners=new Map       (),units=new Map         ();\n  for(const [id,nodes] of Object.entries(doc.flowGroups .members)){\n    units.set(id,[]);\n    for(const node of nodes)owners.set(node,id);\n  }\n  for(const id of doc.order){\n    const item=doc.objects[id];\n    if(item.kind===\"connector\"&&item.from.kind===\"anchor\"&&item.to.kind===\"anchor\"){\n      const group=owners.get(item.from.objectId);\n      if(group&&group===owners.get(item.to.objectId))owners.set(id,group);\n    }\n    const group=owners.get(id);if(group)units.get(group) .push(id);\n  }\n  result={owners,units};cache.set(doc,result);return result;\n}\nexport const flowGroupOf=(doc              ,id    )=>doc.flowGroups&&id?index(doc).owners.get(id):undefined;\nexport const groupUnit=(doc              ,group   )              =>doc.flowGroups?index(doc).units.get(group)??[]:[];\nexport function expandGroupSelection(doc              ,ids              ,editing    )              {\n  if(!doc.flowGroups)return ids;\n  const seen=new Set    (),out=new Set    ();\n  for(const id of ids){\n    const group=flowGroupOf(doc,id);\n    if(!group||group===editing)out.add(id);\n    else if(!seen.has(group)){seen.add(group);for(const child of groupUnit(doc,group))out.add(child);}\n  }\n  return [...out];\n}\nexport function groupableNodes(doc              ,ids              )               {\n  if(ids.length\u003c2)return;\n  const picked=new Set(ids),nodes     =[];\n  for(const id of picked){\n    const item=doc.objects[id];if(!item||flowGroupOf(doc,id))return;\n    if(item.kind===\"shape\")nodes.push(id);\n    else if(item.kind!==\"connector\"||item.from.kind!==\"anchor\"||item.to.kind!==\"anchor\"||\n      !picked.has(item.from.objectId)||!picked.has(item.to.objectId))return;\n  }\n  return nodes.length>=2?nodes:undefined;\n}\n","deps":{}},{"path":"core/history.js","code":"import { assertDocument, DocumentValidationError,isRecord,contentVersion, freezeData, has, isBox,isPoint,objectById,readDocument,resolveEndpoint,zeroLengthConnector } from \"./document.js\";\nimport { hasIntegerGeometry } from \"./document-grid.js\";\nimport { onGrid } from \"./geometry.js\";\nimport { validInkGeometry } from \"../features/ink.js\";\n                                                                                           \n\n                   \n                                                                             \n                                            \n                                                          \n                                                    \n                                                   \n                                           \n                                                \n                                                                                 \n                                  \n                                                                       \n                                                                       \n                                                                                                     \n   \n                                                                                 \n                                                                                                                           \n                                                                               \n\nconst HISTORY_LIMIT = 100;\nconst checkedDocuments=new WeakSet               ();\nconst unchanged = freezeData           ({\n  added: [], updated: [], removed: [], invalidatedMaps: [], invalidatedConnectors: [],\n  assetsChanged: [], orderChanged: false, themeChanged: false,\n});\nexport function createHistory(doc               )          {\n  const checked=readDocument(structuredClone(doc));checkedDocuments.add(checked);\n  return asState(checked, 0, [], []);\n}\n\nfunction asState(doc               , revision        , past         , future         )          {\n  // Document snapshots share their frozen unchanged objects. Do not re-walk history.\n  return Object.freeze({ doc, revision, past: Object.freeze(past), future: Object.freeze(future) });\n}\nfunction frame(label        , doc               , forward          )        {\n  return Object.freeze({ label, doc, forward });\n}\nfunction appendCapped(frames                  , entry       )          {\n  return [...frames.slice(-(HISTORY_LIMIT - 1)), entry];\n}\n\n/** A freshly placed object's first edit completes the same undo step. Both revisions remain observable to persistence. */\nexport function completeInsertion(placed al           ,value           ,generation       ,label=\"移动路径顶点\")        {\n  if(value===original||editor.doc.objects[original.id]!==original||editor.selectedIds.length!==1||editor.selection!==original.id)return false;\n  return editor.commitEdit({label,patches:[{op:\"putObject\",value}]},generation);\n}\nexport {commitPathEdit as commitPathVertex};\n/** The path formats store opaque hex paints; a closed path without a fill is transparent. */\nexport function withPathAppearance(original           ,stroke       ,strokeWidth       ,fill        )                     {\n  if(!isHexPaint(stroke)||!Number.isFinite(strokeWidth)||strokeWidth\u003c.25||strokeWidth>MAX_PATH_STROKE||\n    fill!==undefined&&(!original.closed||!isHexPaint(fill)))return;\n  if(stroke===original.stroke&&strokeWidth===original.strokeWidth&&fill===original.fill)return original;\n  if(fill!==undefined)return {...original,stroke,strokeWidth,fill};\n  const {fill:previous,...geometry}=original;\n  return {...geometry,stroke,strokeWidth};\n}\nexport function stylePath(editor              ,original           ,stroke       ,strokeWidth       ,fill        )        {\n  const next=withPathAppearance(original,stroke,strokeWidth,original.closed?fill:undefined);\n  return Boolean(next&&commitPathEdit(editor,original,next,editor.generation,\"修改路径外观\"));\n}\n","deps":{"../core/id.js":"core/id.js","../core/document.js":"core/document.js","../core/path-geometry.js":"core/path-geometry.js","../core/geometry.js":"core/geometry.js"}},{"path":"features/path-input.js","code":"import {MAX_BOARD_PATH_VERTICES,MAX_PATH_VERTICES} from \"../core/document.js\";\n                                                                  \nimport {pathSegments,closestSegment,nearestParameter,segmentPoint} from \"../core/path-geometry.js\";\n                                                          \nimport {gridPoint,screenToWorld,worldToScreen} from \"../core/geometry.js\";\n                                                      \n                                                        \n                                                         \nimport {commitPathEdit,finishPath,withPathVertex,withPathControl,withSegmentKind,withInsertedVertex,interiorSplit} from \"./vector-path.js\";\n\n                                                                                                                             \n                                                             \n                                                                                                                                              \nconst distance=(a      ,b      )=>Math.hypot(a.x-b.x,a.y-b.y);\nfunction worldVertices(item           ){return item.vertices.map(p=>({x:item.at.x+p.x,y:item.at.y+p.y}));}\n\nexport class PathInput {\n           editor              ;\n  mode                  ;\n  pointer       ;\n  preview             ;\n  points        =[];\n          hover       ;\n          source               ;\n          generation        ;\n          item            ;\n          candidate            ;\n          segments                       =[];\n          marker           ;\n  inserting=false;\n  canInsert=false;\n  constructor(editor              ){this.editor=editor;}\n  segment=0;\n  part                           =\"auto\";\n  get segmentCount(){return this.item?this.item.vertices.length-(this.item.closed?0:1):0;}\n  get curved(){return Boolean(this.item?.curves?.[this.segment]);}\n  choose(index       ){\n    if(!this.pointer&&Number.isInteger(index)&&index>=0&&index\u003cthis.segmentCount){\n      this.segment=index;this.part=\"auto\";\n      if(this.inserting)this.marker=this.site(index,.5);\n    }\n  }\n  armInsert(){\n    if(!this.item||this.pointer||!this.canInsert)return false;\n    this.inserting=!this.inserting;this.marker=this.inserting?this.site(this.segment,.5):undefined;return true;\n  }\n  stopInsert(){this.inserting=false;this.marker=undefined;this.pointer=undefined;}\n          site(index       ,t       ,touch=false,click       )                    {\n    const s=this.segments[index];\n    if(!s||!interiorSplit(t))return;\n    const point=gridPoint(segmentPoint(s,t)),clearance=(touch?12:6)/this.editor.camera.zoom;\n    const nearEnd=(p      )=>Math.min(distance(p,s.from),distance(p,s.to))\u003c=clearance;\n    if(nearEnd(point)||click&&nearEnd(click))return;\n    return {index,t,point};\n  }\n          locate(screen      ,type       )                    {\n    if(!this.item)return;\n    const camera=this.editor.camera,p=screenToWorld(screen,camera),touch=type===\"touch\";\n    const hit=closestSegment(this.segments,p,(touch?17:8)/camera.zoom+this.item.strokeWidth/2,this.segment);\n    return hit===undefined?undefined:this.site(hit,nearestParameter(this.segments[hit],p),touch,p);\n  }\n          insert(site           )        {\n    if(!this.inserting||!this.canInsert||!site||!this.item||!this.generation)return false;\n    const item=this.item,value=withInsertedVertex(item,site.index,site.t);\n    if(!commitPathEdit(this.editor,item,value,this.generation,\"插入路径顶点\"))return false;\n    const next=this.editor.doc.objects[item.id];\n    if(next?.kind===\"path\")this.start(next,site.index);\n    return true;\n  }\n  insertMidpoint()        {return !this.pointer&&this.insert(this.site(this.segment,.5));}\n  history(redo        ){\n    const item=this.item,index=this.segment,part=this.part,generation=this.generation;\n    if(item)this.cancel();\n    if(redo)this.editor.redo();else this.editor.undo();\n    const next=item&&this.editor.doc.objects[item.id];\n    if(next?.kind===\"path\"&&generation===this.editor.generation&&this.editor.selectedIds.length===1&&this.editor.selection===next.id){\n      this.start(next,Math.min(index,next.vertices.length-(next.closed?1:2)));\n      if(this.curved)this.part=part;\n    }\n  }\n  toggle(){\n    const item=this.item;\n    if(!item||this.pointer||!this.generation)return false;\n    const index=this.segment,value=withSegmentKind(item,index,!this.curved);\n    const applied=commitPathEdit(this.editor,item,value,this.generation,this.curved?\"曲线转直线\":\"直线转曲线\");\n    const next=this.editor.doc.objects[item.id];\n    if(applied&&next?.kind===\"path\")this.start(next,index);\n    return applied;\n  }\n  start(item            ,index=0){\n    this.cancel();if(item&&(this.editor.isLocked(item.id)||this.editor.isHidden(item.id)))return;\n    this.source=this.editor.doc;this.generation=this.editor.generation;\n    this.mode=item?\"anchors\":\"draw\";this.item=item;this.segment=index;this.part=\"auto\";\n    if(item){\n      this.segments=pathSegments(item);\n      this.canInsert=item.vertices.length\u003cMAX_PATH_VERTICES&&Object.values(this.editor.doc.objects)\n        .reduce((count,o)=>count+(o.kind===\"path\"?o.vertices.length:0),0)\u003cMAX_BOARD_PATH_VERTICES;\n    }\n  }\n  cancel(){\n    this.mode=undefined;this.pointer=undefined;this.points=[];this.hover=undefined;\n    this.segments=[];this.marker=undefined;this.inserting=false;this.canInsert=false;\n    this.source=undefined;this.generation=undefined;this.item=undefined;this.candidate=undefined;this.preview=undefined;\n  }\n  sync(){\n    if(this.inserting&&!this.pointer)this.marker=undefined;\n    if(this.mode&&(this.source!==this.editor.doc||this.generation!==this.editor.generation||\n      this.pointer&&this.pointer.camera!==this.editor.camera||\n      (this.item?this.editor.isLocked(this.item.id)||this.editor.selection!==this.item.id||this.editor.selectedIds.length!==1:this.editor.selectedIds.length>0)))this.cancel();\n  }\n  decor()                    {\n    if(this.mode===\"draw\")return {points:this.points,hover:this.hover,drawing:true};\n    if(this.item){\n      const value=this.candidate??this.item;\n      return {points:worldVertices(value),drawing:false,selected:(this.candidate?pathSegments(value):this.segments)[this.segment],insertAt:this.marker?.point};\n    }\n  }\n  down(id       ,type       ,screen      ) r.camera);\n    if(this.mode===\"draw\"){this.hover=gridPoint(world);return;}\n    const press=this.pointer,item=this.item;\n    if(!press||!item||press.index===undefined)return;\n    const start=screenToWorld(press.start,this.editor.camera);\n    const moved=distance(press.start,screen)>=(press.type===\"touch\"?6:2);\n    const delta={x:world.x-start.x,y:world.y-start.y};\n    this.candidate=moved?(press.control?withPathControl(item,press.index,press.control,delta):withPathVertex(item,press.index,delta)):undefined;\n    this.preview=this.candidate?{ids:[item.id],objects:new Map([[item.id,this.candidate]])}:undefined;\n  }\n  up(id       ,screen      ){\n    const press=this.pointer;\n    if(!press||press.id!==id)return;\n    this.move(id,screen);this.pointer=undefined;\n    if(this.inserting){\n      const site=this.marker;this.marker=undefined;this.insert(site);return;\n    }\n    if(this.mode===\"anchors\"&&this.item){\n      const original=this.item,candidate=this.candidate;\n      this.preview=undefined;this.candidate=undefined;\n      if(candidate&&this.generation){\n        const segment=this.segment,part=this.part;\n        commitPathEdit(this.editor,original,candidate,this.generation,press.control?\"移动曲线控制柄\":\"移动路径顶点\");\n        const next=this.editor.doc.objects[original.id];\n        if(next?.kind===\"path\"&&this.editor.selection===next.id){this.start(next,segment);this.part=part;}\n      }\n      return;\n    }\n    if(this.mode!==\"draw\")return;\n    if(this.points.length>=3&&distance(worldToScreen(this.points[0],this.editor.camera),screen)\u003c=(press.type===\"touch\"?14:8)){\n      this.finish(true);return;\n    }\n    const point=gridPoint(screenToWorld(screen,this.editor.camera)),last=this.points.at(-1);\n    if(this.points.length\u003cMAX_PATH_VERTICES&&(!last||last.x!==point.x||last.y!==point.y))this.points.push(point);\n    this.hover=undefined;\n  }\n  finish(closed        )        {\n    if(this.mode!==\"draw\"||this.pointer||!this.generation)return false;\n    const applied=finishPath(this.editor,this.generation,this.points,closed);\n    if(applied)this.cancel();\n    return applied;\n  }\n  leave(){if(!this.pointer){this.hover=undefined;this.marker=undefined;}}\n}\n","deps":{"../core/document.js":"core/document.js","../core/path-geometry.js":"core/path-geometry.js","../core/geometry.js":"core/geometry.js","./vector-path.js":"features/vector-path.js"}},{"path":"features/mindmap-layout.js","code":"import {MAX_TOPIC_LENGTH} from \"./plain-text.js\";\nimport {estimatedTextWidth,graphemePrefix,normalizeBreaks,textRows} from \"./text-layout.js\";\nimport {inkWidth,nodeFont,topicMeasureContext} from \"../platform/text-metrics.js\";\n                                                             \n                                                     \n\n                                                                                                                                                         \n                                                                                               \nconst layouts=new WeakMap                                                                                                 ();\n// Immutable topics survive sibling style edits. Reflow the visible tree, but measure only changed topics.\nconst measurements=new WeakMap                                                              ();\nexport const DEFAULT_TOPIC_GAP=17;\nconst tiers=[\n  {fontSize:18,weight:800,minWidth:126,minHeight:48,padX:12,padY:8,gap:1},\n  {fontSize:15,weight:700,minWidth:84,minHeight:40,padX:10,padY:7,gap:1},\n  {fontSize:13,weight:600,minWidth:74,minHeight:34,padX:8,padY:6,gap:.8},\n  {fontSize:12,weight:500,minWidth:60,minHeight:27,padX:6,padY:5,gap:.65},\n]         ;\nconst columnStep=[0,199,188];\nexport const topicTier=(depth       )=>tiers[Math.min(depth,tiers.length-1)];\nconst point=(x       ,y       )      =>({x,y});\nconst box=(at      ,width       ,height       )    =>({at,width,height,rotation:0});\nfunction size(topic      ,depth       ,context                          )           {\n  const role=Math.min(depth,tiers.length-1),tier=tiers[role];\n  let cached=measurements.get(topic);\n  if(!cached||cached.context!==context){cached={context,tiers:[]};measurements.set(topic,cached);}\n  const previous=cached.tiers[role];if(previous)return previous;\n  const {fontSize,weight,minWidth,minHeight,padX,padY}=tier;\n  const original=normalizeBreaks(topic.text||\"未命名\"),text=graphemePrefix(original,MAX_TOPIC_LENGTH);\n  const display=text.length\u003coriginal.length?text+\"…\":text;\n  if(context)context.font=nodeFont(fontSize,weight);\n  const measure=context?(s       )=>inkWidth(context.measureText(s)):undefined;\n  let width=topic.appearance?.width,lines         ;\n  if(width===undefined){\n    lines=display.split(\"\\n\");\n    const longest=Math.max(...lines.map(row=>measure?measure(row):estimatedTextWidth(row,fontSize)));\n    width=Math.max(minWidth,Math.ceil(longest)+2*padX+2);\n  }else lines=textRows(display,width-2*padX,fontSize,{measure});\n  const height=Math.max(minHeight,Math.ceil(lines.length*fontSize*1.35)+2*padY);\n  return cached.tiers[role]={width,height,lines,fontSize};\n}\nexport function layoutMap(map        )                      {\n  const scale=map.scale??1,spacing=map.spacing??DEFAULT_TOPIC_GAP;\n  const gapAt=(depth       )=>spacing*scale*topicTier(depth).gap;\n  const key=[map.rootId,map.layout,scale,spacing].join(\"/\");\n  const context=topicMeasureContext();\n  let cached=layouts.get(map.topics);\n  if(!cached||cached.context!==context){cached={context,entries:new Map()};layouts.set(map.topics,cached);}\n  const cache=cached.entries,previous=cache.get(key);if(previous)return previous;\n  const root=map.topics[map.rootId], dimensions=new Map               (), height=new Map           ();\n                           \n  const widths                      ={left:[],right:[]};\n  const pending h:3}[end.portId];\n    const axis=((Math.round(shape.rotation/(Math.PI/2))+offset)%4+4)%4;\n    return [{x:1,y:0},{x:0,y:1},{x:-1,y:0},{x:0,y:-1}][axis];\n  };\n  const start=normal(fromEnd),end=normal(toEnd);\n  if(!start&&!end)return flowPath(from,to,routing,manual);\n  const d=Math.min(18,Math.max(1,distance(from,to)*.2));\n  const outside=(p      ,n                )=>n?{x:p.x+n.x*d,y:p.y+n.y*d}:p;\n  const a=outside(from,start),b=outside(to,end);\n  const unique=(points                 )=>points.filter((p,i)=>i===0||!same(points[i-1],p));\n  const via=(pins                 )=>unique([from,...flowPath(a,b,routing,pins),to]);\n  if(manual.length)return via(manual);\n  const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;\n  const span=Math.max(22,d*2);\n  const candidates                              =[[],[{x:a.x,y:b.y}],[{x:mx,y:a.y},{x:mx,y:b.y}],\n    [{x:a.x,y:my},{x:b.x,y:my}],...[-1,1].flatMap(sign=>{\n      const y=(sign\u003c0?Math.min(a.y,b.y):Math.max(a.y,b.y))+sign*span;\n      const x=(sign\u003c0?Math.min(a.x,b.x):Math.max(a.x,b.x))+sign*span;\n      return [[{x:a.x,y},{x:b.x,y}],[{x,y:a.y},{x,y:b.y}]];\n    })];\n  let best                           ,cost=Infinity;\n  for(const pins of candidates){\n    const points=via(pins);let length=0,bends=0,reversals=0;\n    for(let i=1;i\u003cpoints.length;i++){\n      const p=points[i-1],q=points[i];length+=distance(p,q);\n      if(i\u003c2)continue;\n      const r=points[i-2],u={x:p.x-r.x,y:p.y-r.y},v={x:q.x-p.x,y:q.y-p.y};\n      if(u.x*v.x+u.y*v.y\u003c0)reversals++;\n      if(u.x*v.y-u.y*v.x!==0)bends++;\n    }\n    const score=length+4*bends+reversals*1e6;\n    if(score\u003ccost){cost=score;best=points;}\n  }\n  return best??via([]);\n}\n\nexport function flowLabelAnchor(path                 )                                                        {\n  let best                                                   ;\n  for(let i=1;i\u003cpath.length;i++){\n    const a=path[i-1],b=path[i],length=distance(a,b);\n    if(length
